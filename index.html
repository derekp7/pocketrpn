    // presentation transform over the shared decision: 1200 is plain in both.
    function fmtDisplay(v) {
        // Defensive: the whole stack is supposed to hold Decimals now, but a
        // renderer crash is the worst failure mode a calculator has - coerce
        // any stray primitive at the boundary instead of trusting callers.
        // (The original bug: depth pushed stack.length as a plain number and
        // v.isNaN() blew up with 'v.isNaN is not a function'.)
        if (!(v instanceof Decimal)) v = new Decimal(v);
        if (v.isNaN()) return 'NaN';
        if (!v.isFinite()) return v.isNegative() ? '-Infinity' : 'Infinity';
        const r = v.toSignificantDigits(DISPLAY_SIGDIGITS);
        if (!wantsExponent(v, r)) return fixedText(r);
        // Exponent form. Scientific prints it directly...
        if (!prefs.engNotation) return sciText(r);
        // ...engineering rewrites the SAME rounded value onto a multiple-of-3
        // exponent: shift the mantissa so it lands in [1, 1000). The shift is
        // an exact power-of-ten multiply; no rounding happens.
        const e = r.e;                              // exponent of the MS digit
        const k = ((e % 3) + 3) % 3;                // digits to shift mantissa
        const m = r.times(new Decimal(10).pow(k - e));
        const E = e - k;
        return m.toString() + 'E' + (E >= 0 ? '+' : '') + E;
    }

    // --- Preferences store ---------------------------------------------------
    // One JSON blob in localStorage, validated and clamped on every load: a
    // corrupt or future-version file silently yields defaults, never a broken
    // startup (the STO silent no-op philosophy applied to storage). Every
    // setter path goes through savePrefs(); failures (private mode, quota)
    // are swallowed - prefs are a convenience, not state the app needs.
    const PREFS_KEY = 'rpn-prefs-v1';
    const PREFS_DEFAULTS = {
        displayDigits: 15,     // significant digits the LCD shows (1..30)
        internalDigits: 40,    // guard digits kept internally (8..64)
        sciLargeAt: 15,        // integer positions before scientific (1..64)
        sciSmallZeros: 5,      // leading zeros tolerated before scientific (0..30)
        editSciZeros: 0,       // edit-window padding zeros before exponent form (0 = never)
        engNotation: false,    // engineering exponents (multiples of 3)
        lcdBright: 3,          // LCD backlight detent 1-5 (3 = x1.00, the factory look)
        lcdContrast: 3,        // LCD contrast detent 1-5 (3 = x1.00, the factory look)
        haptics: true,         // key-press vibration (Android; silent no-op elsewhere)
        stackLines: 5,         // requested LCD stack levels (3..6)
        // 'Stored settings' family - what the app is allowed to remember
        // across launches. All default on: an app you live in should start
        // where you left it unless you say otherwise.
        rememberZoom: true,    // pinch writes through to stackLines
        rememberAngle: true,   // Deg/Rad returns; off = always start Deg
        rememberNotation: true,// Sci/Eng returns; off = always start Scientific
        rememberRegisters: true, // STO registers return; off = ten empty slots
        rememberStack: true,   // the stack itself returns; off = empty LCD
        showWelcome: true,     // first-start welcome page (set off on dismiss)
    };
    let prefs = Object.assign({}, PREFS_DEFAULTS);

    function clampPrefs(p) {
        const n = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
        const b = (v, d) => (typeof v === 'boolean') ? v : d;
        p.displayDigits = Math.max(1, Math.min(30, Math.round(n(p.displayDigits, PREFS_DEFAULTS.displayDigits))));
        p.internalDigits = Math.max(8, Math.min(64, Math.round(n(p.internalDigits, PREFS_DEFAULTS.internalDigits))));
        p.sciLargeAt = Math.max(1, Math.min(64, Math.round(n(p.sciLargeAt, PREFS_DEFAULTS.sciLargeAt))));
        p.sciSmallZeros = Math.max(0, Math.min(30, Math.round(n(p.sciSmallZeros, PREFS_DEFAULTS.sciSmallZeros))));
        p.editSciZeros = Math.max(0, Math.min(60, Math.round(n(p.editSciZeros, PREFS_DEFAULTS.editSciZeros))));

        if (p.internalDigits < p.displayDigits + 2)

        p.stackLines = Math.max(3, Math.min(6, Math.round(n(p.stackLines, PREFS_DEFAULTS.stackLines))));

        p.rememberAngle = b(p.rememberAngle, PREFS_DEFAULTS.rememberAngle);
        p.rememberNotation = b(p.rememberNotation, PREFS_DEFAULTS.rememberNotation);
        p.rememberRegisters = b(p.rememberRegisters, PREFS_DEFAULTS.rememberRegisters);
        p.rememberStack = b(p.rememberStack, PREFS_DEFAULTS.rememberStack);
        p.showWelcome = b(p.showWelcome, PREFS_DEFAULTS.showWelcome);

        try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) { }

    // What the 'Stored settings' toggles govern lives in its OWN blob, so
    // 'Reset all storage' has exactly two keys to erase and prefs can never
    // smuggle remembered values. Each remembered thing is one field, written
    // only while its flag is on - turning a flag off deletes its field on
    // the very next save (and restoreSession skips fields whose flag is off,
    // so a field that predates the flag dying still never comes back).
    const SESSION_KEY = 'rpn-session-v1';

    // unguarded save there would stamp an EMPTY stack over the stored one
    // before it was ever restored. Saves are dead until boot completes.
    let sessionBooting = true;

        try { return JSON.parse(localStorage.getItem(SESSION_KEY)) || {}; }
        catch (e) { return {}; }
    }

    // Cheap and idempotent: called after every state change that could be
    // worth keeping. Reads the existing blob, overwrites only the fields the
    // flags currently allow, writes back - so a stack save never clobbers
    // registers saved under a different flag combination.
    function saveSession() {
        if (sessionBooting) return;
        try {
            const s = loadSessionRaw();
            if (prefs.rememberAngle) s.angle = angleMode;
            else delete s.angle;
            if (prefs.rememberNotation) s.eng = prefs.engNotation;
            else delete s.eng;
            if (prefs.rememberRegisters)
                s.regs = registers.map(r => r === null ? null : storedText(r));
            else delete s.regs;
            if (prefs.rememberStack)

            else delete s.stack;
            localStorage.setItem(SESSION_KEY, JSON.stringify(s));
        } catch (e) { }
    }

    // paint. Every field validated independently: one corrupt value must not
    // sink the others (and none of it may throw - startup is sacred).
    function restoreSession() {
        const s = loadSessionRaw();
        if (prefs.rememberAngle && (s.angle === 'deg' || s.angle === 'rad'))
            angleMode = s.angle;
        if (prefs.rememberNotation && typeof s.eng === 'boolean')
            prefs.engNotation = s.eng;
        if (prefs.rememberRegisters && Array.isArray(s.regs)) {
            for (let i = 0; i < 10 && i < s.regs.length; i++) {
                if (s.regs[i] === null || s.regs[i] === undefined) continue;
                try { registers[i] = new Decimal(s.regs[i]); } catch (e) { }
            }
        }
        if (prefs.rememberStack && Array.isArray(s.stack)) {
            for (const v of s.stack) {

            }

        // and operands are entered IN THE ORDER THEY ARE SPOKEN (say it, type

    const entryText = document.getElementById('entry-text');
    const ovfLeft = document.getElementById('ovf-left');
    const ovfRight = document.getElementById('ovf-right');

    // The '…' chips are tiny; reserve their width when keeping the cursor in
    // view so a chip can never sit on top of it.
    const OVF_W = 16;

    // Update the UI
    function updateDisplay() {
        // Render Stack with Position Numbers aligned to bottom
        let html = '';
        const stackSize = stack.length;
        
//        stack.forEach((val, index) => {
	for (let i = stackSize - 1; i >= 0; i--) {
	    const val = stack[i];
            const level = stackSize - i - 1; 
	    // data-level drives the deep-copy tap on the label (the copy listener
	    // resolves it against the live stack, so re-renders can never go stale).
	    if (level == 0 && lastCalc == true)
		html += `<div class="stack-item"><span class="stack-pos copy-rail" data-level="${level}">${level}:</span><span class="stack-val stack-0-val">${fmtDisplay(val)}</span></div>`;
	    else
		html += `<div class="stack-item"><span class="stack-pos copy-rail" data-level="${level}">${level}:</span><span class="stack-val">${fmtDisplay(val)}</span></div>`;
        }
        stackDisplay.innerHTML = html;
        
        // Render Current Input with cursor position indicator and pending negative sign
        const beforeCursor = currentInput.substring(0, cursorPos);
        const afterCursor = currentInput.substring(cursorPos);

        // The '|' is wrapped in a span so keepCursorInView() can measure where
        // the cursor actually is on screen. innerHTML needs escaping even
        // though currentInput only ever holds [0-9.e+-] - cheap insurance.
        const minus = (pendingNegative && currentInput === "") ? '-' : '';
        entryText.innerHTML = escHtml(minus + beforeCursor) +
                              '<span id="caret">|</span>' + escHtml(afterCursor);
        keepCursorInView();

        // blob current without any mutation site having to remember it.
        // Guarded (boot) and flag-filtered (Stored settings) inside.
        saveSession();
    }

    function escHtml(s) {
        return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    }

    // Scroll the entry window just enough that the cursor is visible, leaving
    // room for the overflow chips. This is what makes typing a long number
    // scroll naturally off to the left (the caret rides the right edge), and
    // stepping the cursor with ← walks it back into view from the left.
    function keepCursorInView() {
        if (!entryView || !entryText) return;
        const caret = document.getElementById('caret');
        const over = entryView.scrollWidth - entryView.clientWidth;
        if (over <= 0) {
            entryView.scrollLeft = 0;      // everything fits: auto margin right-aligns
        } else if (caret) {
            const cr = caret.getBoundingClientRect();
            const vr = entryView.getBoundingClientRect();
            if (cr.left < vr.left + OVF_W) {
                entryView.scrollLeft -= (vr.left + OVF_W - cr.left);
            } else if (cr.right > vr.right - OVF_W) {
                entryView.scrollLeft += (cr.right - vr.right + OVF_W);
            }
        }
        updateOvf();
    }

    // Light the chips only over edges where text really continues.
    function updateOvf() {
        if (!entryView || !ovfLeft || !ovfRight) return;
        const over = entryView.scrollWidth - entryView.clientWidth;
        const sl = entryView.scrollLeft;
        ovfLeft.classList.toggle('on', over > 0 && sl > 1);
        ovfRight.classList.toggle('on', over > 0 && sl < over - 1);
    }

    // Anchor the entry view at the FRONT of a value placed there
    // programmatically (pi, e, recalled numbers). If the text overflows the
    // window, park the cursor in front of the most-significant digit: the
    // user sees the head of the number - "3.14159..." - with the real '…'
    // chip lit at the right edge, and reaches the hidden digits by finger
    // scroll or the arrow keys. The alternative (caret after the value)
    // scrolls to the tail and clips the head off-screen left - which is how
    // pi used to read as "...279502884197". Typed keystrokes keep riding the
    // right edge exactly as before; only programmatic inserts anchor here.
    function anchorEntryStart() {
        updateDisplay();          // must render first: overflow measures in DOM
        if (entryView &&
            entryView.scrollWidth > entryView.clientWidth && cursorPos > 0) {
            cursorPos = 0;
            updateDisplay();      // re-render with the caret at the MSB
        }
    }

    // Canonical TEXT form of a value: what the session blob stores, and the base
    // recall writes into the entry line (see recallText for the one thing recall
    // may add). Deliberately not fmtDisplay - this is the value itself, and it has
    // to survive an unedited round trip digit for digit, so its threshold is the
    // register width (WORK_PRECISION), never the display width.
    //
    // Rule: plain digits whenever every significant digit fits the register - a
    // typed 22-digit integer comes back as those 22 digits, not as '1.23e+21' with
    // the tail hidden behind an exponent. Exponent form is reserved for what
    // genuinely cannot be written out: more significant digits than the register
    // holds (reachable by lowering the internal-digits pref under an existing
    // value), or a magnitude whose plain text would run past twice the register
    // width. Both magnitude bounds are register-derived and SYMMETRIC - an
    // inherited 'e < -6' used to abbreviate small numbers while large ones stayed
    // plain out to 2x the register, quietly contradicting 'the edit window shows
    // every digit'.
    function storedText(v) {
        if (!(v instanceof Decimal)) v = new Decimal(v);
        if (v.isNaN() || !v.isFinite() || v.isZero()) return v.toString();
        if (v.sd() > WORK_PRECISION) return v.toString();
        const limit = 2 * WORK_PRECISION;
        if (v.e > limit || (-v.e - 1) > limit) return v.toString();
        // Enough decimal places for any register-sized value; the trim puts
        // back what toFixed pads on (toFixed cannot lose anything here).
        let s = v.toFixed(WORK_PRECISION);
        if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
        return s;
    }

    // Placeholder zeros in a value's plain text: the zeros that carry no
    // information - those after the last significant digit, and those between
    // the decimal point and the first one. Zeros BETWEEN significant digits are
    // not padding (10000000000000000001 has twenty real digits and zero
    // padding), which is what lets one threshold serve both directions.
    function padZeros(v) {
        const trailing = Math.max(0, v.e + 1 - v.sd());
        const leading = v.e < 0 ? (-v.e - 1) : 0;
        return trailing + leading;
    }

    // Exponent form at FULL register precision - every significant digit the
    // value holds. Deliberately not sciText(), which rounds to the DISPLAY
    // width: routing an edit-window value through it would silently truncate 40
    // digits to 15, the exact bug this formatter exists to prevent.
    function sciFullText(v) {
        const dp = Math.max(0, v.sd() - 1);       // sd-1 places == all sig digits
        let s = v.toExponential(dp);
        const at = s.indexOf('e');
        let m = s.slice(0, at);
        if (m.indexOf('.') >= 0) m = m.replace(/0+$/, '').replace(/\.$/, '');
        return m + s.slice(at);
    }

    // Text for a value recalled INTO THE EDIT WINDOW. storedText() plus one
    // rule of its own: when the plain form is mostly placeholder zeros, write it
    // in exponent form instead - 20000000000000000000 reads '2e+19' while
    // 12345678901234567891 keeps all twenty digits, because only the first is
    // padded. Nothing is hidden: sciFullText prints every stored digit, and the
    // entry parser takes '2e+19' straight back (the exponent token is already
    // cursor-atomic and EE-editable), so an unedited round trip stays exact.
    //
    // Applied on RECALL only. Typed text is never reformatted and ± keeps the
    // shape it was given - collapsing digits the user just typed, mid-edit, would
    // destroy the one thing the edit window is for.
    //
    // EDIT_SCI_ZEROS = 0 (the default) disables compaction entirely: every
    // recall shows every digit, exactly as before the setting existed. Note the
    // inversion - 0 means OFF here, not 'tolerate no zeros'; a tolerance of zero
    // would compact 1200 to 1.2e+3, which nobody wants.
    function recallText(v) {
        if (!(v instanceof Decimal)) v = new Decimal(v);
        if (EDIT_SCI_ZEROS > 0 && !v.isNaN() && v.isFinite() && !v.isZero()
            && padZeros(v) > EDIT_SCI_ZEROS) {
            return sciFullText(v);
        }
        return storedText(v);
    }

    // Lst X -> ENTER must round-trip all WORK_PRECISION guard digits; handing over
    // only the displayed digits silently truncated every recalled value to 15
    // significant digits on its way back onto the stack. The '…' chip plus scroll
    // cover what does not fit the window.
    function recallToEntry(v) {
        currentInput = recallText(v);
        cursorPos = currentInput.length;   // fits-case: caret after the value
        pendingNegative = false;           // a '-' in the text is the value's own
        anchorEntryStart();
    }

    //   tap        -> put the cursor under the finger
    //   drag       -> pan the window sideways
    //   hold (no move) -> PASTE the clipboard in at the cursor

    // user-select:none on .input-line stops the browser selecting underneath it -
    // a drag that ran out of scroll travel, or simply moved faster than the pan,
    // used to fall through into a native selection rectangle. There is nothing

    //

    const LONG_PRESS_MS = 450;

        // the finger at the moment the action happens, which is how every other
        // long-press in this app behaves - and it means a hold that ends off the
        // window still pastes, because the decision was already made honestly.
        const disarmHold = () => { clearTimeout(holdTimer); holdTimer = null; };

                holdTimer = null;

            updateOvf();
            e.preventDefault();
        });
        // A release that never crossed the drag threshold AND never reached the
        // hold time was a TAP: put the cursor where it landed. Deliberately in
        // this same listener rather than a separate click handler - the pan state
        // machine already knows whether this gesture moved, and two listeners
        // deciding 'was it a tap?' would eventually disagree (a drag that ends
        // under the threshold, a click arriving after pointercancel, and so on).
        entryView.addEventListener('pointerup', (e) => {
            if (e.pointerId === pid) {
                // Read the timer BEFORE clearing it: holdTimer is what says 'the
                // 450ms never arrived, so this gesture was a tap'. Sampling that
                // after disarmHold() would read the null disarmHold just wrote -
                // a guard that is false on every single tap, silently turning
                // tap-to-position off while everything else still looked right.
                const held = holdTimer !== null;
                disarmHold();
                // !pasted: a gesture whose timer already fired was a PASTE, and a
                // paste is positioned by the cursor, not by the finger. Jumping
                // the caret to the press point afterwards would undo where the
                // user had deliberately put it (the tap that came before the
                // hold), which is the whole point of the pair.
                if (!panning && !pasted && held) placeCursorAt(e.clientX);
            }
            if (e.pointerId === pid) pid = null;
        });
        entryView.addEventListener('pointercancel', (e) => {
            if (e.pointerId === pid) { disarmHold(); pid = null; }
        });
    })();

    // --- the copy rail: one column, two windows, one gesture ----------------
    // The faint box at the left of the stack rows and the one under them in the
    // entry line are the same control: tap it to put a value on the clipboard at
    // FULL stored precision (not the 15 digits the display shows). On the stack
    // that is the level's value; here it is whatever the edit line holds, which
    // for a recalled or computed value is every guard digit.
    //
    // Deliberately NOT tap-on-the-number: a tap in the entry line already means
    // "cursor here", and re-using the same gesture for two actions in one widget
    // is how you get a calculator that copies when you meant to edit. Reserving
    // its own column keeps both meanings intact, and puts the entry copy exactly
    // under the stack control that already does this job.
    const entryCopyBtn = document.getElementById('entry-copy');

    function entryCopyText() {
        if (currentInput !== '') return currentInput;
        // Nothing typed: hand back the top of the stack in full, so the rail is
        // never a dead key - "copy this number" is what it means on the stack.
        const v = stack[stack.length - 1];
        return v === undefined ? '' : storedText(v);
    }

    function copyEntryValue() {
        const text = entryCopyText();
        if (text === '') return;                   // nothing anywhere to copy
        copyToClipboard(text).then(ok =>
            ok ? flashLamp(['ann-full', 'ann-cpy'], 1200) : flashErr());
    }

    // One press, one copy - deliberately NOT attachAutoRepeat, whose contract is
    // 'fire on press and swallow the click'. That is right for a cursor key, but
    // this is a <button>, and a button already knows how to say 'the gesture was
    // abandoned': drag off or pointercancel and it never fires a click at all.
    // Copying on pointerdown would write the clipboard for a press the user took
    // back, so the action rides the click and only the shade follows the finger.
    if (entryCopyBtn) {
        // The shade lives on .pressed (set here, cleared by the window-level
        // pointerup below), NOT on :active: a press that is cancelled - which is
        // what a scroll or a drag-off does to a button - must leave no trace.
        const press = () => entryCopyBtn.classList.add('pressed');
        const lift  = () => entryCopyBtn.classList.remove('pressed');
        entryCopyBtn.addEventListener('pointerdown', (e) => {
            // The rail is the one part of the entry strip that is NOT a gesture
            // surface, so its press never enters the pan/tap state machine - and
            // it must not start a text-selection drag along the edge either.
            e.preventDefault(); e.stopPropagation();
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            press();
        });
        window.addEventListener('pointerup', lift);
        window.addEventListener('pointercancel', lift);
        // The copy rides the CLICK, not pointerdown: a button is exactly the
        // element whose activation is cancelled by dragging off it or by a
        // pointercancel, and 'I meant to leave' must not be answered with a
        // clipboard write. Click is also the event a keyboard-activated press
        // (Enter/Space on the focused button) produces, so this one line covers
        // finger, mouse and keyboard with no double-fire anywhere.
        entryCopyBtn.addEventListener('click', (e) => {
            e.preventDefault();
            copyEntryValue();
            // A cursor left parked on this button means every later Enter/Space
            // fires it again - invisible on an LCD that draws no focus ring.
            entryCopyBtn.blur();
        });
    }

    // --- clipboard in and out of the edit line ------------------------------
    // Paste lands AT THE CURSOR, which is why tap-to-position and hold-to-paste
    // are a pair rather than a conflict: put the caret where it belongs, then
    // hold. Long numbers scroll to keep the insertion point visible.
    function sanitizeClipboardText(raw) {
        // Split the clipboard text into [optional sign][mantissa][exponent] and
        // rebuild only the parts that are legal here. Two traps decided the shape
        // of this: a paste must never be turned into a DIFFERENT number, and it
        // must never leave the entry line in a state no key could have typed.
        let s = String(raw).replace(/[^0-9.eE+-]/g, '');   // digits, dot, exponent, sign
        if (!/[0-9]/.test(s)) return '';
        const neg = s.startsWith('-');
        const eAt = s.toLowerCase().indexOf('e');
        let mant = eAt < 0 ? s : s.slice(0, eAt);
        let expo = eAt < 0 ? '' : s.slice(eAt + 1);
        // Mantissa: at most one '.', and no signs inside it - '3-4' is not a
        // number anyone can enter, so the stray sign goes rather than the digits.
        mant = mant.replace(/[-+]/g, '');
        const dAt = mant.indexOf('.');
        if (dAt >= 0) mant = mant.slice(0, dAt + 1) + mant.slice(dAt + 1).replace(/\./g, '');
        // Exponent: an optional sign and digits, nothing else. Dropping the sign
        // here would multiply the number by 1e2n - so a malformed exponent is
        // discarded whole rather than repaired into a different value.
        const em = /^(e|E)?([+-]?)(\d+)/.exec(expo);
        expo = (em && em[3]) ? (em[2] || '') + em[3] : '';
        if (!/[0-9]/.test(mant)) {
            // '.5' is a legal entry, but a bare sign or dot in front of nothing
            // is not - and 'e19' with no mantissa means the exponent came from
            // something that was never a number.
            if (!expo || !/\d/.test(expo)) return '';
            mant = '1';
        }
        s = mant + (expo ? 'e' + expo : '');
        return (neg && /[0-9]/.test(s) ? '-' : '') + s;
    }

    // `raw` is the text when the caller already has it (a paste event, or
    // Ctrl-V's keydown carrying clipboardData); with nothing handed in, read the
    // clipboard ourselves. A rejected read says 'use Ctrl-V' rather than failing
    // silently - the gesture was right, the permission was not.
    function pasteIntoEntry(raw) {
        const finish = (v) => {
            const text = sanitizeClipboardText(v == null ? '' : v);
            if (text === '') { flashErr(); return; }   // nothing usable to paste
            // appendNum applies the pending minus, keeps '.' and 'e±' legal, and
            // leaves the cursor after what it inserted - one insertion path, so
            // a pasted value cannot be edited into a form no key could type.
            // noAnchor: a paste is not a constant. Without it appendNum anchors
            // the view at the head of any long insert and parks the cursor at 0,
            // which would silently undo the caret the user just placed.
            appendNum(text, { noAnchor: true });
            // No lamp: unlike a copy, a paste lands where you are looking - the
            // number appearing at the cursor is its own confirmation.
        };
        if (raw !== undefined) { finish(raw); return; }
        const byHand = () =>
            // Permission refused, not a secure context, or no readText at all.
            // ERR because the gesture asked for something that did not happen -
            // and the toast says which door is still open (Ctrl-V needs no
            // permission from us, the browser feeds it the clipboard itself).
            () => { flashErr(); showToast('Hold again, or use Ctrl-V', 1800); };
        if (navigator.clipboard && navigator.clipboard.readText) {
            navigator.clipboard.readText().then(finish, byHand());
        } else {
            byHand()();
        }
    }

    // Read-only clipboard read for the Ctrl-V fallback. Returns a promise of
    // string-or-null; never throws, never writes.
    function readClipboardText() {
        if (navigator.clipboard && navigator.clipboard.readText)
            return navigator.clipboard.readText().catch(() => null);
        return Promise.resolve(null);
    }

    // Map a horizontal screen position in the entry line to a cursor index in
    // currentInput. Geometric, not caretRangeFromPoint: the rendered text is
    // [before][caret span '|'][after], so the DOM offset of a hit carries an
    // off-by-one that depends on which side of the caret it landed on and
    // whether the pending-minus prefix is present. Walking character boundaries
    // with Range rects against the two real text nodes sidesteps all of it -
    // the caret span's own '|' is never in the walk because its parent is the
    // span, not #entry-text.
    function placeCursorAt(clientX) {
        if (currentInput === '') return;           // only one place for it
        const el = document.getElementById('entry-text');
        if (!el) return;
        const nodes = [];
        for (const n of el.childNodes)
            if (n.nodeType === 3 && n.data.length) nodes.push(n);
        if (!nodes.length) return;

        let best = 0, bestD = Infinity, acc = 0;   // acc: input chars consumed
        const r = document.createRange();
        for (const n of nodes) {
            for (let i = 0; i <= n.data.length; i++) {
                let x;
                if (i < n.data.length) {           // left edge of char i
                    r.setStart(n, i); r.setEnd(n, i + 1);
                    x = r.getBoundingClientRect().left;
                } else {                           // right edge of the last char
                    r.setStart(n, i - 1); r.setEnd(n, i);
                    x = r.getBoundingClientRect().right;
                }
                const d = Math.abs(x - clientX);
                if (d < bestD) { bestD = d; best = acc + i; }
            }
            acc += n.data.length;
        }
        // Never come to rest between 'e' and its sign: an exponent marker is one
        // token, exactly as moveCursor treats it. Land after the pair instead.
        if (markerAt(currentInput, best - 1)) best++;
        cursorPos = Math.max(0, Math.min(currentInput.length, best));
        updateDisplay();                           // keepCursorInView scrolls to it
    }

    // Add number to current buffer at cursor position
    // opts.noAnchor - a multi-character insert that must NOT be treated like a
    // constant (see the anchor note below). Used by pasteIntoEntry.
    function appendNum(num, opts) {
        // A number has exactly one decimal point, and only in its mantissa. Without
        // this a second '.' is accepted and parseFloat() silently truncates
        // ("1.2.3" -> 1.2); a '.' inside an exponent does the same ("1e+2.5" -> 100).
        if (num === '.') {
            const eAt = currentInput.indexOf('e');
            const mantissa = eAt < 0 ? currentInput : currentInput.substring(0, eAt);
            if (mantissa.indexOf('.') >= 0) return;      // this number has one already
            if (eAt >= 0 && cursorPos > eAt) return;     // cursor is inside the exponent
        }

        if (currentInput === "0" && num !== "." && typeof num === 'string' &&
            num != "e+" && num != "e-") currentInput = "";
        
        const char = String(num);
        currentInput = currentInput.substring(0, cursorPos) + char + currentInput.substring(cursorPos);
        // += length, not ++: multi-char inserts (pi, e) must leave the cursor after
        // the whole value instead of inside it.
        cursorPos += char.length;

        // Apply a pending minus the moment real digits arrive - any insertion
        // beginning with a digit or dot IS "the first digits". The old test
        // was `currentInput.length === 1` plus a leading-dot special case:
        // fine for keystrokes, but pi and e land as 40-character strings, so
        // pendingNegative + pi used to drop the sign and leave the flag set.
        if (pendingNegative && /^[0-9.]/.test(char)) {
            if (!currentInput.startsWith('-')) {
                currentInput = "-" + currentInput;
                cursorPos++;
            }
            pendingNegative = false;
        }

        // A 40-digit constant never fits the window: anchor the view at its
        // front instead of letting the end-of-value caret drag the MSB digits
        // off-screen left (see anchorEntryStart). Single keystrokes keep the
        // natural right-edge scroll.
        //
        // The anchor is a property of inserting a KNOWN CONSTANT, not of the
        // string being long: it parks the cursor at 0 so '3.14159...' reads from
        // its head. A pasted value must not inherit that - the caret was placed
        // deliberately (tap or arrow keys) and the paste belongs exactly there,
        // with the caret after what landed. Hence the opt-out rather than a
        // length test, which cannot tell pi from a clipboard number.
        if (char.length > 1 && !(opts && opts.noAnchor)) anchorEntryStart();
        else updateDisplay();
    }

    // Handle the ENTER key
    function handleEnter() {
        if (currentInput === "") {
	    updateDisplay();
	    return;
	}

        // Backstop for the two half-typed forms: a trailing marker with no digits
        // ("2e+") and, defensively, an orphaned leading one ("-e-15"). Edits prune
        // these as they happen; ENTER must never silently swallow what is left.
        const entry = currentInput.replace(/^(-?)e[+-]/, '$1').replace(/e[+-]?$/i, '');
        // Decimal() THROWS on malformed input where parseFloat returned NaN;
        // same bail-out path either way. ENTER parses only - it never snaps,
        // so what the user typed lands on the stack exactly as entered.
        let val = null;
        try { val = new Decimal(entry); } catch (e) { val = null; }
        if (val === null || val.isNaN()) {
            currentInput = "";
            cursorPos = 0;
            pendingNegative = false;
            updateDisplay();
            return;
        }
        // The internal-digits pref is the register width. decimal.js keeps a
        // parsed string EXACTLY - precision governs arithmetic, never
        // construction - so without this a typed 120-digit number landed on
        // the stack with all 120 digits and no pref could rein it in. Rounding
        // long entries to WORK_PRECISION here is what a fixed-width hardware
        // register physically does when you type past its width. This is NOT
        // snapping: no cascade repair, just plain rounding (half-even) of
        // input longer than the register. Short entries are untouched - the
        // sd() guard keeps ENTER exact for everything that fits.
        if (val.sd() > WORK_PRECISION) val = val.toSignificantDigits(WORK_PRECISION);
        // ENTER is a pure push: it must not touch lastX. (This used to snapshot
        // the previous X here, which meant every mover that commits a pending
        // entry first - dup, swap, roll... - silently overwrote Lst X with a
        // value nobody calculated.)
        stack.push(val);
        currentInput = "";
        cursorPos = 0;
        updateDisplay();
    }

    // Clear Current Entry (C)
    function handleClear() {
        cancelStoArm();   // 'stop what you're doing' also covers an armed pick
        currentInput = "";
        cursorPos = 0;
        pendingNegative = false;
        updateDisplay();
    }

    // All Clear - clears stack and input. pendingNegative must be dropped too:
    // it is a half-typed minus sign, not a mode, and if it survives AC the next
    // digit typed comes out negated with nothing on screen to explain why.
    function handleAllClear() {
        cancelStoArm();   // an armed pick pointing at a stack that no longer
        stack = [];       // exists must not survive it (registers DO - see top)
        lastX = null;
        currentInput = "";
        cursorPos = 0;
        pendingNegative = false;
        updateDisplay();
    }

    // Edit - Pop from stack into edit window. A mover, so it does NOT touch
    // lastX: Lst X exists to serve the calculation flow (recall an operand of
    // the last computation), not as an undo buffer. Pressing Edit mid-flow to
    // fix an entry must never destroy the value being worked with - and while
    // Edit followed by C can lose a value, so can Drop, and Drop has never
    // saved one either. The HP rule this calculator follows, exactly:
    //
    //   Any operator that consumes one or more values from the stack stores
    //   the value in position 0 into Lst X (a pending entry is pushed first,
    //   as if ENTER). No other operation that changes position 0 - pushing a
    //   number, any stack move including this one - sets Lst X.
    function handleEdit() {
        if (currentInput !== "") {
            handleEnter();
        }
        
        if (stack.length > 0) recallToEntry(stack.pop());
    }

    // --- stack movers -----------------------------------------------------
    // Direction words follow the DISPLAY, not the array: the readout shows X on
    // the bottom line with older levels above it, so "down" means values flow
    // toward X (the end of the array) and "up" means they climb away from it.
    // Every mover commits a pending entry first and never touches lastX - only
    // computations do (see handleOp / calcFunc), so Lst X still recalls the
    // value that was on top before the last calculation, however many rolls
    // happened since.

    // dup: push a copy of X.
    function handleDup() {
        if (currentInput !== "") {
            handleEnter();
        }
        
        if (stack.length > 0) {
            const val = stack[stack.length - 1];
            stack.push(val);
            updateDisplay();
        }
    }

    // over: push a copy of Y (the second item). One short of two items, HP's
    // OVER is a no-op; the display starts empty anyway.
    function handleOver() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length >= 2) {
            stack.push(stack[stack.length - 2]);
            updateDisplay();
        }
    }

    // n pick: consume the top item as a position n, then push a copy of stack
    // position n. Positions match the display labels and are 0-based: 0 = X,
    // 1 = Y, 2 = Z... The index applies to the stack AS IT STANDS once n is
    // popped ("1 2 3 1 n pick" leaves 1,2,3,2 - a copy of Y). Popping n first
    // means the deepest selectable position is exactly depth-1, so any integer
    // in [0, depth) picks something. Anything else puts n back and says so -
    // silently doing nothing looks identical to a dead key.
    function handleNPick() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length < 2) {           // just the index, nothing to pick from
            alert('Nothing to pick from');
            return;
        }
        const n = stack.pop();
        // Decimal-aware validation: Number.isInteger(Decimal) is ALWAYS false,
        // which made every n-operation silently reject a perfectly good count
        // after the engine port. Validate with Decimal methods, convert once
        // for index math, and put the ORIGINAL Decimal back on any reject path.
        if (!n.isInteger() || n.lt(0) || n.gte(stack.length)) {
            // not a valid position: put n back and quote the range that is
            // (stack.length here already excludes n - it is the depth to pick from)
            stack.push(n);
            alert('Pick out of range: 0..' + (stack.length - 1));
            updateDisplay();
            return;
        }
        const k = n.toNumber();
        stack.push(stack[stack.length - 1 - k]);
        updateDisplay();
    }

    // drop: delete X. Purely a mover - it does not touch lastX, which belongs
    // to computations only (handleOp / calcFunc / negate), so Lst X keeps
    // meaning "the value that was on top before the last calculation".
    function handleDrop() {
        if(stack.length > 0) {
            stack.pop();
            updateDisplay();
        }
    }

    // nip: delete Y ("negated drop" - the same move one level up).
    function handleNip() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length >= 2) {
            stack.splice(stack.length - 2, 1);
            updateDisplay();
        }
    }

    // tuck: copy X and insert the copy below Y (between Y and Z).
    // ... Z, Y, X  ->  ... Z, X, Y, X. Shares dup's one-item tolerance (a lone
    // X just lands on top of itself; HP does the same).
    function handleTuck() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length >= 1) {
            const x = stack[stack.length - 1];
            // Copy X and insert the copy BELOW Y (index len-2), pushing Y up:
            // [.., Z, Y, X] -> [.., Z, X, Y, X]. Index 0 when there is no Y,
            // so a lone X duplicates to [X, X].
            stack.splice(Math.max(0, stack.length - 2), 0, x);
            updateDisplay();
        }
    }

    // n drop: consume the top item as a count n and delete that many items
    // (the operand included). "5 3 n drop" leaves [5]; asking for more than
    // exists drops everything rather than erroring.
    function handleNDrop() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length < 1) return;
        const n = stack.pop();
        if (!n.isInteger() || n.lt(0)) {   // Decimal-aware - see handleNPick
            stack.push(n);   // not a count: leave the stack untouched
            updateDisplay();
            return;
        }
        const k = n.toNumber();
        // splice's deleteCount is clamped to what exists, so the end index must
        // be computed too: dropping n from a stack of m leaves m-n items, i.e.
        // remove [len-n, len). (Plain splice(len-n, n) on the ORIGINAL length
        // silently under-deletes when n exceeds the remaining depth.)
        stack.splice(Math.max(0, stack.length - k), k);
        updateDisplay();
    }

    // depth: push the current number of stack levels.
    function handleDepth() {
        if (currentInput !== "") {
            handleEnter();
        }

        // Wrap: every stack value must be a Decimal (the renderer calls
        // methods on it; fmtDisplay's coercion is the safety net, not this).
        stack.push(new Decimal(stack.length));
        updateDisplay();
    }

    // Swap top two stack entries
    function handleSwap() {
        if (currentInput !== "") {
            handleEnter();
        }
        
        if (stack.length >= 2) {
            const a = stack.pop();
            const b = stack.pop();
            stack.push(a);
            stack.push(b);
            updateDisplay();
        }
    }

    // roll down: X takes Y's value, every level moves down one, the old X
    // wraps to the bottom of the stack (the top line of the display).
    function handleRollDown() {
        if (currentInput !== "") {
            handleEnter();
        }
        
        if (stack.length >= 2) {
            const val = stack.pop();
            stack.unshift(val);
            updateDisplay();
        }
    }

    // roll up: the exact reverse - every level climbs one, old X lands at the
    // bottom. Replaces the old "press +/- first" gesture for roll-up.
    function handleRollUp() {
        if (currentInput !== "") {
            handleEnter();
        }
        
        if (stack.length >= 2) {
            const val = stack.shift();
            stack.push(val);
            updateDisplay();
        }
    }

    // rot: rotate the TOP THREE levels only; deeper levels are not touched.
    // rot down is "one roll down with everything below Y held still": X wraps
    // to just under Z and Y drops into X's level.
    // L A B C(X) -> L C A B, and the new X is the old Y.
    function handleRotDown() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length >= 3) {
            const x = stack.pop();
            stack.splice(stack.length - 2, 0, x);   // below Z
            updateDisplay();
        }
    }

    // rot up - the exact reverse: X climbs out from under Z and lands on top
    // again. L C A B -> L A B C.
    function handleRotUp() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length >= 3) {
            // Undo of rot down: rot down put X at index len-3, so pull that
            // element out and push it back on top. L C A B -> L A B C.
            const moved = stack.splice(stack.length - 3, 1)[0];
            stack.push(moved);
            updateDisplay();
        }
    }

    // n roll: rotate the TOP n levels (the count operand is consumed first,
    // exactly like n drop). Direction follows the FULL roll keys restricted to
    // the top-n window: rolling DOWN moves every level one step toward X and
    // wraps X under the window. "1 2 3 4 3 n roll-down" rolls the window
    // [2,3,4] -> [4,2,3] (stack becomes 1,4,2,3) and leaves 1 alone. With
    // n = depth this is exactly handleRollDown.
    //
    // DIRECTION FIX: the bodies of these two functions were swapped relative
    // to that convention - old n roll-down took the window's DEEPEST value and
    // lifted it to X, which is roll-UP behaviour (and vice versa). Caught by
    // comparing against handleRollDown with n = depth; the pair now round-trips
    // AND agrees with the unbounded keys. Counts are Decimals - see NPick.
    function handleNRollDown() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length < 2) return;
        const n = stack.pop();
        if (!n.isInteger() || n.lt(2) || n.gt(stack.length)) {
            stack.push(n);   // nothing sensible to roll: leave it alone
            updateDisplay();
            return;
        }
        const k = n.toNumber();
        // Roll down: take X and reinsert it at the bottom of the window.
        const val = stack.pop();
        stack.splice(stack.length - k + 1, 0, val);
        updateDisplay();
    }

    function handleNRollUp() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length < 2) return;
        const n = stack.pop();
        if (!n.isInteger() || n.lt(2) || n.gt(stack.length)) {
            stack.push(n);
            updateDisplay();
            return;
        }
        const k = n.toNumber();
        // Roll up (undo of roll down): lift the window's deepest value to X.
        const val = stack.splice(stack.length - k, 1)[0];
        stack.push(val);
        updateDisplay();
    }

    // Recall Last X
    function handleLastX() {
        if (lastX !== null) recallToEntry(lastX);
    }

    // --- STO / RCL ---------------------------------------------------------
    // One key, two operations: STO arms a store, Inv-STO (RCL) arms a recall.
    // Arming puts the keypad into register-pick mode: every digit button grows
    // a corner tag whose COLOUR shows occupancy (orange = holds a value, dim =
    // empty). NO dialog box ever appears in this flow - it would shatter the
    // hardware-calculator metaphor. Instead every invalid pick is a silent
    // no-op that KEEPS the arm: store-with-nothing-on-the-stack and
    // recall-of-an-empty-register change nothing at all, and the visible tags
    // explain why. Clearing lives only in the store flow: while STO is armed
    // '.' grows a 'Clear' tag (press it to enter clear mode), digits then
    // clear single registers, and ⌫ - tagged 'Clear All' - wipes all ten.
    // Store leaves the value on the stack (level 0 untouched) and never
    // touches lastX; recall writes into the ENTRY LINE, replacing whatever was
    // being typed, so the recalled value can be edited before it is used.
    function armSto(mode) {
        stoMode = mode;
        const rootEl = document.documentElement;
        rootEl.classList.toggle('sto-armed', mode === 'sto');
        rootEl.classList.toggle('rcl-armed', mode === 'rcl');
        rootEl.classList.toggle('clr-armed', mode === 'clr');
        paintRegTags();
    }

    // Occupancy colouring: registers[] is JS-only knowledge, so mirror it onto
    // the digit buttons as .reg-filled every time a pick is armed (and after
    // any clear while in clear mode, where the arm - and the tags - persist).
    function paintRegTags() {
        document.querySelectorAll('.btn-num[data-reg]').forEach((b) => {
            b.classList.toggle('reg-filled',
                                registers[Number(b.dataset.reg)] !== null);
        });
    }

    function cancelStoArm() {
        if (stoMode === null) return;
        armSto(null);
    }

    // STO: commit a pending entry first (like every mover), so typing a number
    // then STO stores what you can see. Arming is UNCONDITIONAL - even with an
    // empty stack - because the armed state is also how you reach clearing
    // registers ('.' -> Clear); digits simply do nothing until there is a
    // value to store, and the dim tags say so.
    function handleSto() {
        if (stoMode === 'sto') { cancelStoArm(); return; }   // pressing it again disarms
        if (currentInput !== "") {
            handleEnter();
        }
        armSto('sto');
    }

    function handleRcl() {
        if (stoMode === 'rcl') { cancelStoArm(); return; }
        armSto('rcl');
    }

    // The digit that finishes an armed pick. Shared by the keypad listener
    // below and the keyboard handler. Failure paths are silent no-ops that
    // stay armed - pick a different register, or another key to disarm.
    function completeStoArm(n) {
        if (stoMode === 'sto') {
            if (stack.length < 1) return;               // nothing to store: stay armed
            registers[n] = stack[stack.length - 1];     // value stays on the stack
            cancelStoArm();                             // tags vanishing = confirmation
        } else if (stoMode === 'rcl') {
            if (registers[n] === null) return;          // empty register: stay armed
            recallToEntry(registers[n]);                // full digits into the entry line
            cancelStoArm();
        } else if (stoMode === 'clr') {
            // Stay in clear mode on purpose: the tag visibly dimming IS the
            // proof the wipe worked, which vanishing tags could never give.
            registers[n] = null;
            paintRegTags();
            return;
        }
        updateDisplay();
    }

    // ⌫ while in clear mode. Stays armed too: all ten tags dim at once, which
    // is the whole bank visibly emptying.
    function clearAllRegisters() {
        for (let i = 0; i < registers.length; i++) registers[i] = null;
        paintRegTags();
    }

    // One capture-phase listener decides what a keypad tap means while armed:
    //   digit button  -> complete/clear the pick (stopPropagation keeps the
    //                    inline appendNum() handler from ever running)
    //   '.'           -> store flow only: enter clear mode / leave it again
    //   ⌫             -> clear mode only: Clear All
    //   STO key       -> its own handler toggles/switches; hands off here
    //   anything else -> disarm first, then behave completely normally
    // Doing it in capture on .keypad covers all 46 buttons without touching a
    // single inline onclick.
    document.querySelector('.keypad').addEventListener('click', (e) => {
        if (stoMode === null) return;
        const btn = e.target.closest ? e.target.closest('button') : null;
        if (!btn) return;
        if (btn.dataset && btn.dataset.func === 'sto') return;   // handleSto/handleRcl decide
        if (btn.id === 'key-dot' && stoMode !== 'rcl') {
            e.stopPropagation();
            armSto(stoMode === 'sto' ? 'clr' : 'sto');  // '.' toggles Clear <-> Store pick
            return;
        }
        if (btn.id === 'key-bs' && stoMode === 'clr') {
            e.stopPropagation();
            clearAllRegisters();
            return;
        }
        if (btn.dataset && btn.dataset.reg !== undefined) {
            e.stopPropagation();
            completeStoArm(Number(btn.dataset.reg));
        } else {
            cancelStoArm();                                      // then the key acts as usual
        }
    }, true);
    // Toggle Fn mode - lightweight state change + update buttons
    // --- Menu mode ---------------------------------------------------------
    // A modal that takes over the LCD (see .menu-display CSS) reached via Fn-STO
    // - STO's Fn face, which the modifier tables already leave free. The stack
    // keeps its state underneath; leaving the menu restores it untouched.
    // While open: the top row is a softkey strip ([Exit][Back][up][OK][down]),
    // every other key dims inert, and the hardware keyboard routes here first.
    let menuOpen = false;
    let menuPath = [];        // stack of screen ids; empty = main menu
    let menuSel = 0;          // highlighted row (keyboard/softkey selection)

    // ------------------------------------------------------------------
    // Documentation: plain text in, LCD pages out.
    //
    // The Help chapters and the About / Welcome copy are prose, and they used to
    // live here as 29 KB of HTML string literals - which made editing a sentence an
    // exercise in JS syntax, and emphasis had to be spelled <b>...</b> to survive
    // being markup. The copy is now plain text in docs.js next to this file, and a
    // screen points at its share of it by name: { doc: 'h_stack' }.
    //
    // docs.js arrives through a classic script tag, not fetch(), and that choice
    // is not stylistic: a page opened straight from disk (file://) cannot read a
    // second file any other way. Chrome refuses fetch/XHR to file: URLs outright,
    // Firefox gives every local file its own opaque origin so there is no "same
    // origin" to be a member of, and Safari differs again - while a classic script
    // loads from disk in all of them, which is the same reason decimal.min.js is a
    // plain tag. The cost of that one mechanism is that the text must live inside a
    // JavaScript string (see the wrapper documented at the top of docs.js), and
    // that a module script would NOT work: modules are fetched under CORS rules,
    // so a type="module" attribute on that tag silently breaks file://.
    // tools/docs-test.js asserts the tag stays a classic one, because the failure
    // is invisible from an http:// preview and only shows up when someone opens
    // the file directly.
    //
    // The markup is a deliberately tiny subset of markdown, because this text is
    // edited by hand - often on a phone - and every feature a formatter supports
    // is one more thing an ordinary sentence can trigger by accident:
    //
    //   blank line        separates paragraphs
    //   ## Word           section heading (the LCD's underlined .menu-h line)
    //   **word**          bold - key names and literals, which is what the copy
    //                     already used <b> for
    //   _word_            italic - variables (x, y, n). Needs whitespace or
    //                     punctuation on the near side, so text like x_y cannot
    //                     italicise itself into a different meaning
    //   [text](#h_sto)    jump to another Help chapter; validated against DOCS,
    //                     because an id that does not exist must not offer a tap
    //                     that goes nowhere
    //   [text](https://…) external link, opened in a new tab
    //   <br>              break inside a paragraph (the worked examples)
    //
    // Raw <b> <i> <em> <strong> <sup> <sub> <br> also pass through for what the
    // subset cannot say: x<sup>y</sup>, log<sub>y</sub>(x). Any OTHER tag - and any
    // tag carrying an attribute - is escaped and reads as the text typed, on the
    // same rule and for the same reason as LABEL_HTML_ALLOWLIST by the keypad
    // labels: this copy is written by us, so the guard is against a future edit
    // going wrong by accident, not against hostile input. HTML entities keep
    // working (&times;, &rarr;, and the &nbsp; runs that align the worked
    // examples); a bare & is escaped to match.
    // ------------------------------------------------------------------
    const DOC_TAGS = /^<\/?(b|i|em|strong|sup|sub|br)\/?>$/;

    // One block's text -> inline html. Escaping comes before any markup is
    // honoured, and in this order on purpose: tags first (so a rejected tag gets
    // its own & escaped exactly once), then the bare ampersands left outside.
    // The entity test allows a DIGIT after the first letter: &sup2; and &sup3;
    // appear in the copy, and an [a-zA-Z]+ lookahead escaped them into visible
    // '&sup2;' text - caught by the round-trip test, which is what it is for.
    function mdInline(t) {
        return t
            .replace(/<[^>]*>/g, (all) => DOC_TAGS.test(all) ? all : escHtml(all))
            .replace(/&(?![a-zA-Z][a-zA-Z0-9]*;|#\d+;|#x[0-9a-fA-F]+;)/g, '&amp;')
            .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) => {
                if (href.charAt(0) === '#') {
                    const id = href.slice(1);
                    return DOCS[id] === undefined ? label
                        : `<span class="menu-link" onclick="welcomeToHelp('${id}')">${label}</span>`;
                }
                return /^https?:/i.test(href)
                    ? `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`
                    : `[${label}](${href})`;      // not a link we know how to make
            })
            .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
            .replace(/(^|[\s(>])_([^_\n]+)_(?=[\s).,;:!?)\]<]|$)/g, '$1<i>$2</i>');
    }

    // Doc text -> page html: blocks split on blank lines, one paragraph (or
    // heading) each. No lists, tables or nesting - this copy is headings and
    // paragraphs, and supporting what nothing uses is how a small formatter
    // turns into something nobody dares edit.
    function md(text) {
        const out = [];
        for (const block of String(text).replace(/\r/g, '').split(/\n{2,}/)) {
            const b = block.replace(/^\s+/, '').replace(/\s+$/, '');
            if (!b) continue;
            const h = /^## +([\s\S]+)$/.exec(b);
            out.push(h ? `<p class="menu-h">${mdInline(h[1])}</p>`
                       : `<p>${mdInline(b)}</p>`);
        }
        return out.join('\n');
    }

    // The docs text, parsed: '@id' alone on a line opens a document and everything
    // up to the next one is its body. Ids are named explicitly rather than
    // derived from the heading text (markdown's own split) because they are also
    // MENU_TREE keys - rewording a title must not silently move a chapter.
    const DOCS_LOADED = typeof RPN_DOCS === 'string';
    const DOCS = (function parseDocs(source) {
        const map = {};
        if (typeof source !== 'string') return map;   // docs.js absent: see docHtml
        let id = null, buf = [];
        for (const line of source.split('\n')) {
            const m = /^@([\w-]+)$/.exec(line.trim());
            if (m) { if (id) map[id] = buf.join('\n'); id = m[1]; buf = []; }
            else if (id !== null) buf.push(line);
        }
        if (id) map[id] = buf.join('\n');
        return map;
    })(typeof RPN_DOCS === 'string' ? RPN_DOCS : null);   // typeof: the file may be missing

    // Page html for a doc id. Failure is never a blank screen: a missing section
    // says which id, and a docs.js that did not load at all (deleted, or left out
    // of the service worker's shell) says that instead - the two need different
    // fixes, and whoever just broke it should not have to read source to find out
    // which one happened.
    function docHtml(id) {
        if (DOCS[id] !== undefined) return md(DOCS[id]);
        return DOCS_LOADED
            ? `<p class="menu-h">Missing documentation</p><p>${escHtml(id)}</p>`
            : '<p class="menu-h">Documentation unavailable</p>' +
              '<p>The docs.js file did not load, so no help text is available. ' +
              'It must sit beside this file; if it was recently added, reload ' +
              'with the browser cache cleared.</p>';
    }

    // Menu tree. Screens are either a list (items -> id) or a page whose copy is
    // named by doc: (see docs.js); nesting is arbitrary and Help is what
    // proves it out - a
    // chapter LIST whose rows open chapter PAGES, one level below the main
    // menu. Nothing here is a placeholder: every row leads somewhere real.
    // Help copy is terse and task-oriented (a screen, not the README's thick
    // book); the README keeps the full tables and rationale.
    // Value-bearing list rows ([label, id, valueFn]) render the live value
    // right-aligned - Preferences shows current settings without a second
    // screen per lookup. Editor screens carry type/get/set/min/max/hint; the
    // setters own their cross-field invariants (display digits raise internal
    // rather than being capped by it).
    const MENU_TREE = {
        main: { title: 'Menu', items: [
            ['About', 'about'],
            ['Preferences', 'prefs'],
            ['Help', 'help'],
        ]},
        prefs: { title: 'Preferences', items: [
            ['Display digits',  'p_disp',  () => String(prefs.displayDigits)],
            ['Internal digits', 'p_int',   () => String(prefs.internalDigits)],
            ['Notation',        'p_notat', () => prefs.engNotation ? 'Engineering' : 'Scientific'],
            ['Large \u2192 sci at', 'p_scill', () => String(prefs.sciLargeAt)],
            ['Small \u2192 sci at', 'p_scis',  () => String(prefs.sciSmallZeros)],
            ['Edit zeros \u2192 sci', 'p_editz', () => prefs.editSciZeros ? String(prefs.editSciZeros) : 'Off'],
            ['Screen\u2026',      'screen'],
            ['Key vibration',   'p_haptic', () => prefs.haptics ? 'On' : 'Off'],
            ['Stored settings', 'stored'],
        ]},
        // How the glass looks, one drawer: two tone detents and the line-count
        // zoom. The tone screens preview as you move (see the live-preview
        // note at menuChoiceStep); Stack lines cannot - its pending value
        // would resize the stack hiding under the fixed-height menu.
        screen: { title: 'Screen', items: [
            ['LCD brightness', 'p_bright', () => String(prefs.lcdBright)],
            ['LCD contrast',   'p_contrast', () => String(prefs.lcdContrast)],
            ['Stack lines',    'p_lines',  () => String(prefs.stackLines)],
        ]},
        // What the app may remember across launches. One submenu so the
        // question is asked in one place; every entry defaults to remembering,
        // and the last entry can wipe ALL stored state (prefs included) with
        // a two-press OK - no dialogs on this calculator, armed-OK is the
        // confirm idiom the register Clear flow already uses.
        stored: { title: 'Stored settings', items: [
            ['Remember zoom',      's_zoom',   () => prefs.rememberZoom ? 'On' : 'Off'],
            ['Remember angle',     's_angle',  () => prefs.rememberAngle ? 'On' : 'Off'],
            ['Remember notation',  's_notat',  () => prefs.rememberNotation ? 'On' : 'Off'],
            ['Remember registers', 's_regs',   () => prefs.rememberRegisters ? 'On' : 'Off'],
            ['Remember stack',     's_stack',  () => prefs.rememberStack ? 'On' : 'Off'],
            ['Welcome screen',     's_welcome',() => prefs.showWelcome ? 'On start' : 'Off'],

        s_zoom: { type: 'toggle', title: 'Remember zoom',

                  labels: ['Session only', 'Remember'],
                  get: () => prefs.rememberZoom, set: v => { prefs.rememberZoom = v; } },
        s_angle: { type: 'toggle', title: 'Remember angle',
                   hint: 'On: Deg/Rad returns to wherever you left it. Off: every launch starts in Degrees.',
                   labels: ['Always Deg', 'Remember'],

        s_notat: { type: 'toggle', title: 'Remember notation',
                   hint: 'On: Scientific/Engineering returns as left. Off: every launch starts Scientific.',
                   labels: ['Always Scientific', 'Remember'],
                   get: () => prefs.rememberNotation, set: v => { prefs.rememberNotation = v; } },
        s_regs: { type: 'toggle', title: 'Remember registers',
                  hint: 'On: the ten STO registers return with their values. Off: they hold nothing at launch.',
                  labels: ['Empty at launch', 'Remember'],
                  get: () => prefs.rememberRegisters, set: v => { prefs.rememberRegisters = v; } },
        s_stack: { type: 'toggle', title: 'Remember stack',

                       // session snapshot immediately re-save exactly what
                       // was just erased. Factory state means factory now.
                       stack = [];
                       registers.fill(null);
                       lastX = null;

                       angleMode = 'deg';

        p_disp: { type: 'num', title: 'Display digits',

        p_int: { type: 'num', title: 'Internal digits',

    // Measure the exact vertical area the stack + entry line occupy BEFORE
    // they are hidden (offsetHeight includes borders; margins must be added
    // by hand - getComputedStyle values are strings and can be 'auto'/empty
    // in edge states, hence the isFinite guards). The result becomes
    // --menu-h so the menu fills that area to the pixel: the panel height
    // never changes when the menu opens, on any layout or zoom state.
    function measureLcdArea() {
        const stackEl = document.getElementById('stack');
        const entryEl = document.getElementById('input-line');
        if (!stackEl || !entryEl) return;
        const marg = (el, side) => {
            const v = parseFloat(getComputedStyle(el)['margin' + side]);
            return isFinite(v) ? v : 0;
        };
        const h = stackEl.offsetHeight + marg(stackEl, 'Bottom')
                + entryEl.offsetHeight + marg(entryEl, 'Bottom');
        // A measurement of zero is NOT a measurement. The first launch of an
        // INSTALLED app hit exactly this: the welcome page is shown from the
        // boot sequence below, and on that path the LCD had not been laid out
        // yet, so both offsetHeights read 0. Storing 0 was worse than storing
        // nothing at all - a stored --menu-h beats the CSS fallback for every
        // screen, so the first welcome page drew short AND every menu opened
        // afterwards inherited it. Leaving the property unset hands the job to
        // the calc() fallback, which needs no live layout.
        //

        // third of the resting window) because fitKeys() may legitimately have
        // shrunk --stack-h toward STACK_MIN_H on a short viewport; below that
        // floor a real reading is meaningless anyway and the fallback is the
        // better answer.
        if (!(isFinite(h) && h > LCD_WINDOW_H / 3)) return;
        document.documentElement.style.setProperty('--menu-h', h + 'px');
    }

    // Re-measure while the menu (or the welcome overlay) already owns the
    // LCD. Needed because --menu-h is a snapshot taken at open time: an
    // installed app's window is still being sized when the boot sequence
    // shows the welcome page, so that first snapshot can be short even
    // though it clears the zero guard above (fitKeys() may have shrunk
    // --stack-h hard against a transient viewport). When the real geometry
    // arrives later on a resize event, fitToViewport() restores the stack -
    // and this brings the panel that replaced it along, instead of leaving
    // it frozen at the stale height until dismissed.
    //
    // The stack and entry line are display:none under .menu-open, so they
    // have to come back for the measurement. The class toggle happens
    // inside a single JS task: offsetHeight forces layout while visible,
    // the class goes straight back on, and no intermediate frame is ever
    // painted - nothing flickers on screen. Scroll position of the open
    // panel is saved and restored across the same hide/show.
    function remeasureMenuHeight() {
        const rootEl = document.documentElement;
        const el = document.getElementById('menu');
        const keepTop = el ? el.scrollTop : 0;
        const had = rootEl.classList.contains('menu-open');
        if (had) rootEl.classList.remove('menu-open');
        measureLcdArea();
        if (had) rootEl.classList.add('menu-open');
        if (el) el.scrollTop = keepTop;
    }

    function openMenu() {
        cancelStoArm();
        fnMode = false; invMode = false;   // drop modifiers on the way in
        measureLcdArea();                  // before .menu-open hides anything
        menuOpen = true; menuPath = []; menuSel = 0;
        document.documentElement.classList.add('menu-open');
        // Re-render BEFORE the softkey swap: the mode flags just changed, and
        // without this every key keeps its Inv/Fn label and tint classes from
        // before the menu opened (state and DOM disagreeing - visible as red/
        // purple outlines stranded on the softkeys, and dimmed caps still
        // reading 'asinh'). updateButtonStates() restores all normal faces +
        // tints and clears the Fn/Inv armed LEDs; renderMenu() then paints
        // the softkey profile for the opening screen.
        updateButtonStates();
        renderMenu();      // paints the keypad profile for the opening screen too
    }

    function closeMenu() {
        menuEditFor = null; menuChoiceFor = null;
        menuConfirmArmed = false; menuConfirmFor = null;
        setLcdTone(prefs.lcdBright, prefs.lcdContrast); // Exit discards any tone preview
        // Drop the measured height: the next open re-measures (zoom, fit,
        // or orientation may have moved since), and the CSS fallback stands
        // for anything that flips .menu-open without measuring.
        document.documentElement.style.removeProperty('--menu-h');
        menuOpen = false;
        document.documentElement.classList.remove('menu-open');
        clearKeypad();
        updateButtonStates();   // restores every relabelled key's face + tint
        // The stack box just became measurable again after possibly having
        // prefs changed under the menu - re-run the LCD geometry against the
        // real visible box so rows tile exactly (self-heals any fallback
        // estimate used while hidden).
        lastLayoutKey = '';
        fitToViewport();
        updateDisplay();
    }

    // Keypad profiles. Which keys are live while the menu owns the LCD depends
    // on the screen type, so painting is per-screen: buttons get their label
    // and onclick swapped in place (the original inline onclick is stashed on
    // first paint) and gain .soft-live; everything else stays dim and inert.
    // clearKeypad() restores exactly what was painted - no selector sweeps,
    // so a button can never be restored that was not hijacked.
    // ------------------------------------------------------------------
    // Key labels. Most faces are plain text; a few need real typography that
    // textContent cannot express - log<sub>y</sub>(x) wants a true subscript.
    //
    // So labels go through here: a label is written to the DOM as HTML only if
    // it matches the allowlist exactly, otherwise it is set as text (a stray
    // '<' then reads as a '<' rather than opening a tag). Every one of the 100
    // labels in stackButtons / funcButtons / opButtons is plain text apart from
    // the log face, and none of them is ever built from user input - this is
    // defence against a future edit introducing markup by accident, not against
    // hostile data.
    const LABEL_HTML_ALLOWLIST = [
        /^log<sub>y<\/sub>\(x\)$/,      // Fn on xʸ: log base y of x
    ];
    function setLabel(btn, label) {
        const text = String(label);
        if (LABEL_HTML_ALLOWLIST.some(re => re.test(text))) btn.innerHTML = text;
        else btn.textContent = text;
    }

    const paintedKeys = [];
    function paintKey(sel, label, handler) {
        const btn = document.querySelector(sel);
        if (!btn) return;
        if (btn._origOnclick === undefined)
            btn._origOnclick = btn.getAttribute('onclick') || '';
        if (label !== null) setLabel(btn, label);
        if (handler !== null) btn.setAttribute('onclick', handler);
        btn.classList.add('soft-live');
        paintedKeys.push(btn);
    }
    function clearKeypad() {
        while (paintedKeys.length) {
            const btn = paintedKeys.pop();
            if (btn._origOnclick !== undefined) {
                btn.setAttribute('onclick', btn._origOnclick);
                delete btn._origOnclick;
            }
            btn.classList.remove('soft-live');
        }
    }

    // Screen-type -> keypad. The five top-row movers are always Exit/Back (no
    // stack to move); the middle three slots and the number pad follow the
    // screen:
    //   list   [Exit][Back][ up ][ OK ][down]      + ENTER = OK
    //   page   [Exit][Back][ -  ][ -  ][ - ]       (back is a header too)
    //   toggle [Exit][Cancel][up][ OK ][down]      arrows step the choice,
    //                                              OK commits, Cancel walks off
    //   num    [Exit][Cancel][ - ][ OK ][ - ]      + digits . BS C live, ENTER commits
    function applyKeypadForScreen() {
        clearKeypad();
        const scr = menuScreen();
        if (scr.type === 'welcome') {
            // One future only: begin. There is deliberately no second softkey
            // here offering a way into the menu - that would be a route which
            // exists on this screen and nowhere else, since in normal use the
            // menu is reached with Fn then STO. The welcome page's link into
            // Help (see MENU_TREE.welcome) uses the ordinary Menu > Help path,
            // so it is not a special case once you are inside.
            paintKey('button[data-func="ac"]',  'AC', 'dismissWelcome()');
            const enter = document.querySelector('.btn-enter');
            return;
        }
        paintKey('button[data-func="dup"]',  'Exit', 'closeMenu()');
        // Cancel, not Back, wherever leaving the screen throws away an edit:
        // a typed number, or a choice moved off the stored value.
        paintKey('button[data-func="over"]',
                 (scr.type === 'num' || scr.type === 'toggle') ? 'Cancel' : 'Back',
                 'menuBack()');
        if (scr.items) {
            paintKey('button[data-func="swap"]', '\u25B2', 'menuMove(-1)');
            paintKey('button[data-func="roll"]', 'OK',    'menuOk()');
            paintKey('button[data-func="drop"]', '\u25BC', 'menuMove(1)');
        } else if (scr.type === 'toggle') {
            // The same three softkeys a list offers, aimed at the value rather
            // than at rows: arrows step through the choices, OK writes one.
            // With two labels both arrows flip it - which is the point, every
            // press does something and neither can overshoot.
            paintKey('button[data-func="swap"]', '\u25B2', 'menuMove(-1)');
            paintKey('button[data-func="roll"]', 'OK',    'menuOk()');
            paintKey('button[data-func="drop"]', '\u25BC', 'menuMove(1)');
        } else if (scr.type === 'confirm') {
            paintKey('button[data-func="roll"]', 'OK', 'menuOk()');
        } else if (scr.type === 'num') {
            paintKey('button[data-func="roll"]', 'OK', 'menuOk()');
            // The number pad joins: digits append, BS deletes, C clears the
            // field. Labels never change here - a 7 is still a 7 - so only
            // handlers swap. No cursor keys: these are <=3-digit integers,
            // appended at the end; editing mistakes take one BS or C.
            for (let d = 0; d <= 9; d++)
                paintKey(`.btn-num[data-reg="${d}"]`, null, `menuEditKey('${d}')`);
            paintKey('#key-bs',   null, 'menuEditBackspace()');
            paintKey('button[data-func="clear"]', null, 'menuEditClear()');
        }
        // ENTER duplicates OK on purpose: it sits right under the thumb when
        // the hand is on the number pad, the softkey sits right under the menu.
        const enter = document.querySelector('.btn-enter');
        if (enter) {
            if (enter._origOnclick === undefined)
                enter._origOnclick = enter.getAttribute('onclick') || '';
            enter.classList.add('soft-live');
            enter.setAttribute('onclick', 'menuOk()');
            paintedKeys.push(enter);
        }
    }

    function menuScreen() { return MENU_TREE[menuPath[menuPath.length - 1] || 'main']; }

    // Numeric-editor scratch buffer: what is typed but not yet committed.
    // Initialised from the pref when an editor opens (tracked via menuPath),
    // so Back/Cancel mid-type simply never writes it anywhere.
    let menuEdit = '';
    let menuEditFor = null;      // menuPath signature that owns menuEdit

    // Choice screens (toggles) keep a scratch selection for exactly the same
    // reason, and with the same lifetime: it is seeded from the pref when the
    // screen opens, moved by the arrows, written by OK - and simply never
    // reaches the pref if the user leaves by Cancel/Back. Stored as an index
    // into scr.labels rather than a boolean so a screen with three or more
    // choices needs no new machinery.
    let menuChoice = 0;
    let menuChoiceFor = null;    // menuPath signature that owns menuChoice

    // The pending index, seeded from the stored value on first ask (which is
    // renderMenu's - but calling it from anywhere is safe).
    function menuChoiceVal(scr) {
        const sig = menuPath.join('/');
        if (menuChoiceFor !== sig) {
            // Boolean toggles: index 0/1. Value lists (`values`): the index
            // of the stored value, so a five-detent screen needs no new state.
            menuChoice = scr.values
                ? Math.max(0, scr.values.indexOf(scr.get()))
                : (scr.get() ? 1 : 0);
            menuChoiceFor = sig;
        }
        return menuChoice;
    }

    // Step the pending choice. Two grammars share this one function:
    //   value lists (`values`) are a rotary dial - ▲ increases, and the ends
    //     HARD STOP: there is nothing above level 5, and wrapping past it to
    //     jump the whole screen's value is never what a nudge meant.
    //   boolean toggles keep the list carousel - they have no direction to
    //     read, and wrapping is what makes both arrows flip them.
    // (List SELECTION elsewhere keeps its own wrap untouched: cycling rows is
    // exactly what a carousel of rows is for.)
    function menuChoiceStep(d) {
        const scr = menuScreen();
        const n = Math.max(2, (scr.labels || []).length);
        menuChoiceVal(scr);
        if (scr.values) menuChoice = Math.max(0, Math.min(n - 1, menuChoice - d));
        else menuChoice = (menuChoice + d + n) % n;
        // Live preview: a look-setting must be seen to be judged, so screens
        // that draw on the glass apply the PENDING value immediately (the
        // menu itself sits on that glass - you watch what you choose). OK
        // still commits and Cancel/Back still discards: prefs are untouched
        // until OK, and closeMenu re-applies them over any preview.
        if (scr.preview) scr.preview(scr.values ? scr.values[menuChoice] : menuChoice !== 0);
        renderMenu();
    }

    function renderMenu() {
        const scr = menuScreen();
        const el = document.getElementById('menu');
        // Breadcrumb: Menu › Help - context survives going deep, so a page
        // never leaves you wondering where you are. The welcome overlay is
        // not menu navigation (nothing above it to be lost) and its message
