        // must fit the shortest LCD without help, so it renders no trail.
        const trail = ['main', ...menuPath]
            .map(id => MENU_TREE[id].title).join(' \u203A ');
        if (scr.items) {
            // Item triples [label, id, valueFn]: the third element renders a
            // live right-aligned value (Preferences), plain pairs do not.
            el.innerHTML = `<div class="menu-title">${trail}</div>` + scr.items.map(
                ([label, , val], i) => `<div class="menu-item${i === menuSel ? ' sel' : ''}"
                       onclick="menuPick(${i})"><span class="menu-num">${i + 1}</span>${escHtml(label)}${
                       val ? `<span class="menu-val">${escHtml(String(val()))}</span>` : ''}</div>`
            ).join('');
        } else if (scr.type === 'num') {
            const sig = menuPath.join('/');
            if (menuEditFor !== sig) { menuEdit = String(scr.get()); menuEditFor = sig; }
            el.innerHTML = `<div class="menu-title">${trail}</div>` +
                           `<div class="menu-edit-val">${menuEdit === '' ? '&nbsp;' : escHtml(menuEdit)}<span class="menu-caret">|</span></div>` +
                           `<div class="menu-hint">${mdInline(scr.hint)}</div>`;
        } else if (scr.type === 'toggle') {
            // Shows the PENDING choice, not the stored one - what is on the LCD
            // is what OK will write. Tapping the value steps it (a touch route
            // to the same place the arrows and the ▲/▼ softkeys lead).
            const idx = menuChoiceVal(scr);
            const shown = scr.labels[Math.min(idx, scr.labels.length - 1)];
            const storedIdx = scr.values
                ? Math.max(0, scr.values.indexOf(scr.get()))
                : (scr.get() ? 1 : 0);
            const dirty = idx !== storedIdx;
            el.innerHTML = `<div class="menu-title">${trail}</div>` +
                           // Nothing is stored until OK, so the one moment that
                           // needs saying is when there is something to commit.
                           // It sits ABOVE the value rather than under the hint:
                           // the shortest LCD (landscape) clips the bottom of
                           // this screen, and a warning you have to scroll to
                           // read is a warning missed.
                           (dirty ? `<div class="menu-hint menu-keys">Changed &middot; <b>OK</b> saves, <b>Cancel</b> discards</div>` : '') +
                           // Tap steps like ▲ does (up = increase on a value
                           // list), which is menuMove(-1) in row-move terms.
                           `<div class="menu-toggle-val" onclick="menuMove(-1)">${escHtml(shown)}</div>` +
                           `<div class="menu-hint">${mdInline(scr.hint)}</div>`;
        } else if (scr.type === 'confirm') {
            // Armed-OK confirmation, the register-Clear idiom: the first OK
            // re-arms the button (label AND body change - unmistakable), the
            // second executes. Leaving the screen disarms. No dialogs.
            const sig = menuPath.join('/');
            if (menuConfirmFor !== sig) { menuConfirmFor = sig; menuConfirmArmed = false; }
            el.innerHTML = `<div class="menu-title">${trail}</div>` +
                           `<div class="menu-page"><p>${mdInline(scr.text)}</p></div>` +
                           `<div class="menu-toggle-val${menuConfirmArmed ? ' armed' : ''}" onclick="menuOk()">${
                            menuConfirmArmed ? 'OK again to ERASE' : 'OK to confirm'}</div>`;
        } else {
            // Pages get a tappable '< back' header: the softkey strip is one
            // tap away, but a touch user mid-scroll should not have to hunt
            // for it. (Keyboard OK/Back already does this; menuOk on a page
            // calls menuBack.) The welcome page has no level above it - no
            // header, its own Start/Menu softkeys are the whole exit story.
            el.innerHTML = (scr.type === 'welcome' ? '' :
                            `<div class="menu-title">${trail}</div>` +
                            `<div class="menu-back" onclick="menuBack()">\u2039 back</div>`) +
                           `<div class="menu-page${scr.type === 'welcome' ?
                             ' welcome-page' : ''}">${scr.doc ? docHtml(scr.doc) : (scr.page || '')}</div>`;
        }
        applyKeypadForScreen();     // profile follows the screen just rendered
        // New screen starts at its top - never mid-scroll of the last one.
        el.scrollTop = 0;
    }

    function menuMove(d) {
        const scr = menuScreen();
        // On a choice screen the arrows aim at the value, not at rows.
        if (scr.type === 'toggle') { menuChoiceStep(d); return; }
        if (!scr.items) return;                 // pages scroll natively; no rows
        menuSel = (menuSel + d + scr.items.length) % scr.items.length;
        renderMenu();
        // keep the highlighted row in view when the list overflows the panel
        const sel = document.querySelector('#menu .menu-item.sel');
        if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
    }

    // Armed-confirmation state for destructive screens (Reset all storage).
    let menuConfirmArmed = false, menuConfirmFor = null;

    // Startup welcome overlay: the same LCD takeover as the menu, but a
    // single page with its own softkeys. It is NOT menu state - closing it
    // reveals the (already fully restored) calculator underneath.
    function showWelcome() {
        measureLcdArea();                  // same exact-fit rule as the menu
        menuOpen = true;
        document.documentElement.classList.add('menu-open');
        menuPath = ['welcome']; menuSel = 0;
        renderMenu();
    }
    function dismissWelcome() {
        prefs.showWelcome = false; savePrefs();
        closeMenu();
    }

    // A link inside the welcome copy that goes straight to a Help chapter.
    // Same LCD takeover, so it can be reached without the welcome page ever
    // having offered a second way in. The path it builds is identical to
    // Menu > Help > <chapter>, which is what gives Back and Exit their normal
    // meaning: back from the chapter lands on the Help list, and Exit leaves
    // the menu outright. openMenu() then closeMenu() both reset menuPath, so
    // the path is applied after opening.
    function welcomeToHelp(chapterId) {
        prefs.showWelcome = false; savePrefs();   // seen is seen
        if (!menuOpen) openMenu();
        menuPath = ['help'];
        if (chapterId && MENU_TREE[chapterId]) { menuPath.push(chapterId); }
        menuSel = 0;
        renderMenu();
    }

    function menuOk() {
        const scr = menuScreen();
        if (scr.type === 'welcome') return dismissWelcome();
        if (scr.type === 'num')    return menuEditCommit();
        if (scr.type === 'confirm') {
            if (!menuConfirmArmed) { menuConfirmArmed = true; renderMenu(); return; }
            scr.action();
            menuConfirmArmed = false; menuConfirmFor = null;
            showToast('Storage erased - defaults restored', 1800);
            menuBack();
            return;
        }
        // Leaving this screen for another: invalidate any editor scratch so
        // RE-entering an editor reseeds from the stored pref. Keying on the
        // path string alone was a bug - leave and return gives the SAME
        // string, and the stale typed buffer greeted the user instead.
        menuEditFor = null;
        if (scr.type === 'toggle') {              // commit the choice the arrows
            const i = menuChoiceVal(scr);         // landed on, then leave - the
            scr.set(scr.values ? scr.values[i] : i !== 0);
            applyPrefs(); savePrefs();            // number editor's flow: OK
            menuBack();                           // writes, Cancel does not
            return;
        }
        if (!scr.items) { menuBack(); return; }   // ENTER on a page = back out
        const target = scr.items[menuSel][1];
        if (MENU_TREE[target]) { menuPath.push(target); menuSel = 0; renderMenu(); }
    }

    // --- numeric editor keys ----------------------------------------------
    function menuEditKey(ch) {
        if (menuEdit === '0') menuEdit = '';       // typing over the seed zero
        if (menuEdit.length < 3) menuEdit += ch;   // <=3 digits: clamped anyway
        renderMenu();                              // taps need a repaint too
    }
    function menuEditBackspace() { menuEdit = menuEdit.slice(0, -1); renderMenu(); }
    function menuEditClear()     { menuEdit = ''; renderMenu(); }
    function menuEditCommit() {
        const scr = menuScreen();
        const v = parseInt(menuEdit, 10);
        if (isNaN(v)) { flashErr(); return; }      // empty field: stay and show ERR
        let min = typeof scr.min === 'function' ? scr.min() : scr.min;
        const clamped = Math.max(min, Math.min(scr.max, v));
        scr.set(clamped);                          // setter owns its invariants
        applyPrefs(); savePrefs();
        menuBack();                                // committed: back to the list
    }

    function menuPick(i) {                       // touch: highlight + select at once
        menuSel = i;
        menuOk();
    }

    function menuBack() {
        menuEditFor = null; menuChoiceFor = null;      // scratch buffers die on
        menuConfirmArmed = false;                      // exit, so a re-entry
                                                       // reseeds from storage
        setLcdTone(prefs.lcdBright, prefs.lcdContrast); // Cancel a live tone preview
        if (menuPath.length) { menuPath.pop(); menuSel = 0; renderMenu(); }
        else closeMenu();                        // Back at the top level exits
    }

    // Hardware keyboard while the menu is open: arrows navigate (both axes -
    // a vertical list driven by whatever arrow the keybed has), Enter selects,
    // Escape exits outright. Everything else is swallowed; nothing reaches
    // the calculator handlers behind the curtain.
    function menuKeyHandler(event) {
        const k = event.key;
        const scr = menuScreen();
        // Escape on the welcome page counts as 'seen it' - same as Start -
        // otherwise a keyboard first-run would re-show it every launch.
        if (scr.type === 'welcome' && k === 'Escape') {
            event.preventDefault(); dismissWelcome(); return;
        }
        // Editors take their keys first: digits append, BS deletes, C clears.
        // (No cursor keys - the field is append-at-end by design.)
        if (scr.type === 'num') {
            if (/^[0-9]$/.test(k)) { event.preventDefault(); menuEditKey(k); return; }
            if (k === 'Backspace') { event.preventDefault(); menuEditBackspace(); return; }
            if (k === 'c' || k === 'C') { event.preventDefault(); menuEditClear(); return; }
        }
        if (k === 'Escape')            { event.preventDefault(); closeMenu(); }
        else if (k === 'Enter')        { event.preventDefault(); menuOk(); }
        else if (k === 'ArrowUp' || k === 'ArrowLeft')  { event.preventDefault(); menuMove(-1); }
        else if (k === 'ArrowDown' || k === 'ArrowRight'){ event.preventDefault(); menuMove(1); }
        else event.preventDefault();
    }

    function toggleFn() {
        cancelStoArm();     // faces are about to change; an armed pick must not
        fnMode = !fnMode;   // survive with stale labels on screen
        updateButtonStates();
    }

    // Toggle Inv mode - lightweight state change + update buttons
    function toggleInv() {
        cancelStoArm();
        invMode = !invMode;
        updateButtonStates();
    }

    // Update all button states based on current fnMode/invMode combination
    function updateButtonStates() {

        opButtons.concat(stackButtons, funcButtons).forEach(item => {
            const btnName = item[0];
            const btn = document.querySelector(`button[data-func="${btnName}"]`);
	    let uInvMode = invMode;
	    let uFnMode = fnMode;
            
            if (!btn) return;

            // Calculate state index based on fnMode and invMode combination
            // 1=Normal, 2=Inv, 3=Fn, 4=Both
            let stateIndex = 1 + (invMode ? 1 : 0) + (fnMode ? 2 : 0);
	    // Fallback when this button has no entry for the current combination.
	    // Prefer dropping Fn before Inv: a button like EE defines only Normal/Inv,
	    // so with both modifiers on it must still show its Inv form ('EE−'),
	    // which an Inv-first decrement would have skipped past.
	    if (! item[stateIndex]) {
		if (stateIndex == 4) {
		    if (item[3]) {
			stateIndex = 3;
		    }
		    else if (item[2]) {
			stateIndex = 2;
		    }
		} else if (stateIndex == 3) {
		    if (item[1]) {
			stateIndex = 1;
		    }
		} else if (stateIndex == 2) {
		    stateIndex = 1;
		}
	    }

            const stateData = item[stateIndex];

            if (stateData) {
                // Update button text. setLabel() rather than a bare textContent:
                // a few faces need real markup (a subscript), and every label in
                // these tables is plain text apart from those, so the helper
                // allowlists exactly what may reach the DOM as HTML.
                setLabel(btn, stateData[0]);

                // Update onclick parameter
                btn.setAttribute('onclick', `${stateData[1]}`);

		// Highlight only the buttons that actually changed for this modifier:
		// Fn tint from state 3+, Inv tint from the odd states (2 = Inv only,
		// 4 = both). A button that fell back to its normal form stays plain.
		updateButtonVisuals(btn, stateIndex > 2 ? uFnMode : null,
				    (stateIndex - 1) % 2 == 1 ? uInvMode : false);
            }

        });

        // The Fn/Inv keys themselves: light their corner LED while locked
        // (CSS .mod-armed::after). Toggled here rather than
        // in toggleFn/toggleInv because every path that can change the modes -
        // click, hardware key, cancelStoArm's callers - ends in this function,
        // so the LED can never disagree with fnMode/invMode.
        const fnBtn = document.querySelector('button.btn-fn');
        const invBtn = document.querySelector('button.btn-inv');
        if (fnBtn) fnBtn.classList.toggle('mod-armed', fnMode);
        if (invBtn) invBtn.classList.toggle('mod-armed', invMode);
    }

    // Visual indicator for individual function buttons (based on global modes)
    function updateButtonVisuals(btn, fnActive, invActive) {
        // Remove all mode classes first
        btn.classList.remove('btn-fn-a', 'btn-inv-a');

	if (fnActive) btn.classList.add('btn-fn-a');
	if (invActive) btn.classList.add('btn-inv-a');
    }

    // Handle Scientific Functions (Unary operations)
    function calcFunc(funcName) {
	// Angle conversions both ways: inputs into the trig functions, results out of
	// the inverse ones. (The first source copy converted only on the way in, so
	// asin/acos/atan returned radians even in Deg mode - fixed here.)
	const pd2r = (d) => angleMode === 'deg' ? d.times(PI_D).div(180) : d;
	const pr2d = (r) => angleMode === 'deg' ? r.times(180).div(PI_D) : r;
	// Deg-mode helper for the trig snap: if the argument is an exact multiple
	// of 90 degrees return that multiple modulo 4 (0->0, 90->1, 180->2, 270->3,
	// negatives wrapped), otherwise null. Rad mode always returns null - in
	// radians no input is ever an exact quarter turn except by luck.
	const degQuarterTurn = (d) => {
	    if (angleMode !== 'deg') return null;
	    const q = d.div(90);
	    if (!q.isInteger()) return null;
	    let n = q.toNumber() % 4;
	    return (n + 4) % 4;
	};
        if (currentInput !== "") {
            handleEnter(); 
        }
	// lastCalc drives the "result of the last calculation" highlight on stack
	// position 0. Set/cleared inside runCalc() so EVERY exit path - including
	// the domain-error bail-outs mid-switch - clears it again; a stuck flag is
	// invisible leftover state that makes later keystrokes look wrong.
	runCalc(funcName, pd2r, pr2d, degQuarterTurn);
    }

    function runCalc(funcName, pd2r, pr2d, quarterTurn) {
	lastCalc = true;
	try {
	    calcBody(funcName, pd2r, pr2d, quarterTurn);
	} finally {
	    lastCalc = false;
	}
    }

    function calcBody(funcName, pd2r, pr2d, quarterTurn) {
        if (stack.length < 1) { flashErr(); return; }   // silent before lamps; now ERR shows why

        const a = stack.pop();
        lastX = a;
        let result = new Decimal(0);

        // Safety net: decimal.js v10 propagates +/-Infinity and NaN VALUES the
        // way Math did (exp of a huge number is Infinity, not an exception), so
        // overflow normally just displays 'Infinity' as always - a future Err
        // annunciator owns that story. This catch exists for the unexpected:
        // a malformed gamma() result or engine error must never leave X popped
        // and the display stale.
        try {
	switch(funcName) {
	    // The Deg-mode quarter-turn snap STAYS with the decimal engine:
	    // trig computes through PI, and PI is transcendental - at precision
	    // 40 sin(180 deg) still comes back 1.69e-40 (measured). This was
	    // never float noise; no finite representation makes it exact, so
	    // the true values stay hard-coded here.
	    case 'sin': {
		const q = quarterTurn(a);          // integer if a is a multiple of 90
		if (q !== null) { result = new Decimal([0, 1, 0, -1][q]); break; }
		result = pd2r(a).sin();
		break;
	    }
	    case 'cos': {
		const q = quarterTurn(a);
		if (q !== null) { result = new Decimal([1, 0, -1, 0][q]); break; }
		result = pd2r(a).cos();
		break;
	    }
	    case 'tan': {
		const q = quarterTurn(a);
		if (q !== null) {
		    if (q % 2 === 1) {                 // odd quarter turn: 90, 270, ...
			alert('Undefined');
			stack.push(a);
			return;
		    }
		    result = new Decimal(0);             // even quarter turn: 0, 180, ...
		    break;
		}
		result = pd2r(a).tan();
		break;
	    }
	    // Domain guards all stay: decimal.js answers out-of-domain
	    // questions with a SILENT NaN value (sqrt(-4), ln(-1)) or an
	    // Infinity value (1/0) instead of objecting - the guards are what
	    // keep garbage off the stack now, just more essential than before.
	    case 'asin':
		if (a.abs().gt(1)) { alert("Domain error"); stack.push(a); return; }
		result = pr2d(a.asin()); break;
	    case 'acos':
		if (a.abs().gt(1)) { alert("Domain error"); stack.push(a); return; }
		result = pr2d(a.acos()); break;
	    case 'atan': result = pr2d(a.atan()); break;

	    case 'ln': result = a.ln(); break;
	    case 'log': result = a.log(10); break;
	    // e^x - Inv on the ln key (the label is typographic; see funcButtons).
	    case 'exp': result = a.exp(); break;
	    case 'pow10': result = new Decimal(10).pow(a); break;
	    case 'pow2': result = a.times(a); break;
	    case 'pow3': result = a.times(a).times(a); break; // x^3
	    // log base 2 - Fn on the log key. Exact for powers of two at any
	    // size (log2(2^50) is exactly 50; doubles got that one right too,
	    // but log10 chains no longer leak).
	    case 'log2': result = a.log(2); break;
	    // 2^x - Inv on the log key (inverse of log2, same pairing as ln/exp).
	    case 'pow2_base': result = new Decimal(2).pow(a); break;
	    case 'sqrt': 
		if (a.lt(0)) { alert("Complex number"); stack.push(a); return; }
		result = a.sqrt(); 
		break;
	    // cbrt: negative radicands now WORK - the engine computes cbrt(-8)
	    // as exactly -2. The old "Complex number" alert here was a bug.
	    case 'cbrt': 
		result = a.cbrt(); break; // cube root
	    case 'inv': 
		if (a.isZero()) { alert("Div by zero"); stack.push(a); return; }
		result = new Decimal(1).div(a); 
		break;
	    // n! - the factorial, extended to every argument gamma accepts. A
		// non-negative INTEGER goes through the exact integer product below,
		// so 20! still keeps every digit; anything else (a fraction, or a
		// negative number off the poles) takes the extension x! = Γ(x+1),
		// which is what makes 0.5! = √π/2 come out at all. The only refusal
		// left is where the function itself is undefined: a negative integer,
		// the pole of Γ(x+1). (It used to be "non-negative integer or nothing".)
	    case 'fact':
		if (a.isInteger() && a.gte(0)) {
		    result = factorial(a.toNumber());   // exact product, x!
		} else {
		    if (a.lt(0) && a.isInteger()) {     // pole of Gamma(x+1)
			alert("Factorial undefined for negative integers");
			stack.push(a);
			return;
		    }
		    result = new Decimal(gamma(a.toNumber() + 1));   // x! = Γ(x+1)
		}
		break;
	    // !x - the inverse factorial: "which number's factorial is this?". It
		// reuses the inverse gamma and takes 1 off the way back, because
		// n! = Γ(n+1) means n = invΓ(y) - 1 exactly. The raw inverse lands on
		// 4.0000000002 for 24 - Newton stops at a tolerance, not at equality -
		// so a candidate whole number is tried back through the factorial and
		// kept only if it reproduces the input; see inverseFactorial().
	    case 'ifact': {
		// null is the one thing inverseFactorial returns when it has no answer:
		// a y under the minimum of Γ, where no real n exists. Infinity is NOT that
		// case - it comes back as Infinity, which lands on the stack and displays
		// like every other overflow in this switch does; the reciprocal key's own
		// zero-divide guard above is the only Infinity refusal here, and !∞ = ∞ is
		// true well enough not to need one.
		const v = inverseFactorial(a);
		if (v === null) {
		    alert('No real inverse factorial below \u2248' + GAMMA_MIN.toFixed(7));
		    stack.push(a);
		    return;
		}
		result = v;
		break;
	    }
	    // (no 'percent' case: % is handled by handlePercent, which needs the
	    // whole stack to decide between percent-change and plain divide)
	    // Hyperbolics are native now. The old hand-written (e^x - e^-x)/2
	    // forms and the tanh exp-overflow dance are gone: the engine has
	    // no fixed exponent range, and tanh saturates at exactly +/-1.
	    case 'sinh': result = a.sinh(); break;
	    case 'cosh': result = a.cosh(); break;
	    case 'tanh': result = a.tanh(); break;
	    case 'asinh': result = a.asinh(); break;

	    // Inverse Hyperbolic Cosine
	    case 'acosh':
		if (a.lt(1)) { alert("Domain error: acosh requires x \u2265 1"); stack.push(a); return; }
		result = a.acosh(); break;

	    // Inverse Hyperbolic Tangent
	    case 'atanh':
		if (a.abs().gte(1)) { alert("Domain error: atanh requires -1 < x < 1"); stack.push(a); return; }
		result = a.atanh(); break;

	    // Gamma - reached via Fn on the ln key. x! = Gamma(x+1). Stays a
	    // double-precision Lanczos computation (decimal.js has no gamma);
	    // wrapping the result adds display digits, not accuracy (~1e-9
	    // relative, as before). Overflow -> Infinity -> caught below.
	    // The key is Γ, so the key gives Γ: no offset. (It used to compute
	    // gamma(x+1), which made it a second factorial key rather than the gamma
	    // function - Γ(5) came back as 120 where Γ(5) = 4! = 24. The +1 belongs to
	    // n!, and n! has its own key.)
	    case 'gamma':
		if (a.lt(0) && a.isInteger()) {
		    alert("Gamma undefined for negative integers");
		    stack.push(a);
		    return;
		}
		result = new Decimal(gamma(a.toNumber()));
		break;

	    // Inverse Gamma - Fn+Inv on the ln key (Newton on the same Lanczos).
	    // invΓ answers "for which x is Γ(x) = a?", the exact inverse of the key
	    // above. Its domain starts at the minimum of Γ itself - 0.8856031944… at
	    // x = 1.4616…, where the function turns around and there is no real
	    // answer below it. The branch invΓ returns is the right-hand one, on
	    // which it is monotonic: invΓ(1) is 2 (Γ(2) = 1), not 1.
	    case 'invGamma':
		if (a.lt(GAMMA_MIN)) {
		    alert("Inverse Gamma undefined below \u22480.8856");
		    stack.push(a);
		    return;
		}
		result = new Decimal(invGamma(a.toNumber()));
		break;
	}

        stack.push(snapResult(result));
        updateDisplay();
        } catch (err) {
            alert('Overflow');
            stack.push(a);
            updateDisplay();
        }
    }

    // Helper function for factorial - exact Decimal product. The double loop
    // this replaces turned Infinity at 171! and lost low digits long before;
    // results past WORK_PRECISION digits carry that rounding instead (20! is
    // exact: 2432902008176640000, last digit included).
    function factorial(n) {
        let result = new Decimal(1);
        for (let i = 2; i <= n; i++) {
            result = result.times(i);
        }
        return result;
    }

    // Gamma function - Lanczos approximation, Numerical Recipes g=5 form. This IS
    // Γ: Γ(n) = (n-1)! for positive integers, so Γ(5) = 4! = 24 and the factorial
    // extension is x! = Γ(x+1) (the n! key applies that +1; nothing here does).
    // NOTE: the second source copy divided by neither z nor used t = z + 5.5 here,
    // which made every result ~1.6x too large (4! came out as 39.55). The /z and
    // the 5.5 offset below are what make it agree with Γ to ~1e-9.
    function gamma(z) {
        if (z < 0.5) {
            // Reflection formula for z < 0.5
            return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
        }

        const c = [
            76.18009172947146,
            -86.50532032941677,
            24.01409824083091,
            -1.231739572450155,
            0.1208650973866179e-2,
            -0.5395239384953e-5
        ];

        let y = z;
        let ser = 1.000000000190015;
        for (let i = 0; i < c.length; i++) {
            y += 1;                       // denominators z+1 .. z+6
            ser += c[i] / y;
        }

        const t = z + 5.5;
        return Math.sqrt(2 * Math.PI) * (ser / z) *
               Math.pow(t, z + 0.5) * Math.exp(-t);
    }

    // The bottom and top of the range invΓ can solve over, both DERIVED from this
    // file's own gamma() rather than quoted from a table - because a table value
    // cannot be bracketed by an approximation. Two measurements made here, not
    // assumed:
    //
    //   * this Lanczos form's turning point sits 1.4e-9 away from the true one at
    //     1.4616321449683623 (its ψ is a double-precision asymptotic series, so it
    //     locates its own zero well but its own minimum imperfectly), and
    //   * its intermediate product overflows at x ≈ 142, nowhere near the true
    //     Γ's ceiling at 171.6: gamma(142) is Infinity while Γ(142) itself is only
    //     about 1e240.
    //
    // So GAMMA_MIN / GAMMA_CEIL are exactly what gamma() can reach, and the domain
    // tests compare against them instead of against '0.8856' (the old hand-typed
    // floor, four decimals short - it refused 0.885603, which is answerable).
    //
    // GAMMA_MIN_X: the minimum found directly on gamma() by golden-section search,
    // then refined by trisection. The region is flat to 1e-17 in x, so its own
    // derivative has nothing reliable to say there - which is why this does NOT use
    // ψ, unlike every other solve below.
    const GAMMA_MIN_X = (() => {
        let lo = 1.0, hi = 2.0;
        const gr = (Math.sqrt(5) - 1) / 2;               // 0.618...
        let c = hi - gr * (hi - lo), d = lo + gr * (hi - lo);
        let fc = gamma(c), fd = gamma(d);
        for (let i = 0; i < 80; i++) {                   // shrinks by 0.618 per pass
            if (fc < fd) { hi = d; d = c; fd = fc; c = hi - gr * (hi - lo); fc = gamma(c); }
            else         { lo = c; c = d; fc = fd; d = lo + gr * (hi - lo); fd = gamma(d); }
        }
        for (let i = 0; i < 60; i++) {                   // then trisect to the ulp
            const t = (2 * lo + hi) / 3, u = (lo + 2 * hi) / 3;
            if (gamma(t) < gamma(u)) hi = u; else lo = t;
        }
        return (lo + hi) / 2;
    })();
    const GAMMA_MIN = gamma(GAMMA_MIN_X);

    // The ceiling: the largest value this Lanczos expression can still write down,
    // found by a coarse walk down from x = 300 to the last finite gamma() and then
    // bisected. invΓ refuses above it instead of returning an x whose Γ cannot be
    // evaluated - 'no answer reachable' and 'the answer is about 142' are different
    // statements, and only the first one is true.
    const GAMMA_CEIL_X = (() => {
        let x = 300;
        for (let i = 0; i < 400 && !isFinite(gamma(x)); i++) x -= 1;
        let lo = x, hi = x + 1;               // gamma(lo) finite, gamma(hi) is not
        for (let i = 0; i < 60; i++) {
            const mid = (lo + hi) / 2;
            if (isFinite(gamma(mid))) lo = mid; else hi = mid;
        }
        return lo;
    })();
    const GAMMA_CEIL = gamma(GAMMA_CEIL_X);

    // A y this close to GAMMA_MIN IS the minimum for anything gamma() can be asked,
    // and gets GAMMA_MIN_X straight out of the closed form - no solve attempted.
    // Measured, not guessed: the curve is flat enough that stepping x by 1e-11
    // changes gamma by under 7e-16 relative at the turn (against 4e-12 at x = 2),
    // and its second difference over [1.46163, 1.4617] is 2e-15 - so the whole
    // neighbourhood of the minimum sits inside one rounding of its own value.
    // Solving for a y in that band asks where the turning point is, and the honest
    // answer is GAMMA_MIN_X; searching for it instead walks down from the top of
    // [1.46…, 2] at one bracket-halving per iteration (measured: 5e-5 after 100
    // passes) and arrives nowhere.
    const GAMMA_MIN_EPS = GAMMA_MIN * 1e-13;

    // Inverse Gamma: Newton-Raphson for x where Γ(x) = y - the inverse of the Γ
    // above, with no +1 anywhere inside it. Γ is U-shaped between its poles at 0
    // and 1, so an inverse needs a branch; this one is the right-hand side, x ≥
    // 1.4616…, where Γ rises without limit - monotonic, and the side factorials
    // live on. So invΓ(1) = 2 (Γ(2) = 1) rather than the other answer at x = 1.
    //
    // Bracketed solve, because a plain Newton on this curve is not safe. Γ rises
    // from the turning point but its slope at x = 1.96 is only ~0.03, so near
    // y = 1 the tangent step is thirty times the distance to go: measured, the old
    // log(y)+1 start walked off past the minimum and then down the pole at x = 0,
    // returning -1479 for invΓ(0.99999) and 0.52 for invΓ(1). So: bisect first to
    // put x on the right of the bracket [lo, hi], then Newton inside it, falling
    // back to another bisection whenever a step leaves the bracket. The interval
    // halves every time one of those happens, so the answer cannot escape.
    //
    // The derivative is analytic - Γ' = Γ·ψ (see digamma below) - not a 0.0001
    // difference quotient, which matters most near the flat turn where such a
    // quotient is mostly cancellation noise.
    function invGamma(y) {
        // The endpoint is inclusive at the bottom: a y within GAMMA_MIN_EPS of the
        // minimum IS the minimum as far as gamma() is concerned. Below it there is
        // no real x and invΓ has never pretended otherwise - that is the '0.8856'
        // test this replaced, which was four decimals short and refused values
        // above the true floor.
        if (!(y > GAMMA_MIN)) return y >= GAMMA_MIN - GAMMA_MIN_EPS ? GAMMA_MIN_X : NaN;
        // Above GAMMA_CEIL there is no x this file can evaluate Γ at: the Lanczos
        // expression runs out of double in the region around 171 where its t^(z+.5)
        // term peaks, so a y of 1e300 has no answer that could be reached or even
        // written down here. Refuse rather than return 171, which answers a
        // different question.
        if (y > GAMMA_CEIL) return NaN;
        let lo = GAMMA_MIN_X, hi = 2.0;
        // Grow the bracket by doubling: nine doublings cover everything a double
        // can hold, and GAMMA_CEIL already turned away anything above it. It used
        // to double to 170 and then crawl upward by twos, which left the top of the
        // range bracketed by [128, 170] - where gamma() is Infinity, so the very
        // comparison that steers the solve stops meaning anything.
        while (gamma(hi) < y && hi < GAMMA_CEIL_X) { lo = hi; hi = Math.min(hi * 2, GAMMA_CEIL_X); }
        let x = (lo + hi) / 2;
        // Tolerance from measurement, not habit. gamma() carries a noise floor of
        // about ±3 ulp near its minimum (its value wobbles by that much between
        // adjacent doubles), so any test tighter than ~1e-15 relative can simply
        // never be satisfied - the solve then spends every iteration bisecting
        // toward a target that does not exist and gives up part-way. 1e-13 sits
        // two orders above the floor and still well inside what this approximation
        // is worth anywhere else (~1e-10 near its ceiling).
        for (let i = 0; i < 200; i++) {
            const g = gamma(x);
            if (!isFinite(g)) return NaN;   // out past the ceiling: no answer here
            // Relative gap, measured on the LOG scale: (g - y) / g. The same test
            // in the linear domain cannot be asked at 1e100 without rounding into
            // meaningless digits; this one is exact to double precision anywhere.
            const rel = (g - y) / g;
            if (rel > -GAMMA_TOL && rel < GAMMA_TOL) break;
            // Both ends of the bracket are held on a real side of y, so its width
            // is an honest error bar and every pass cuts it - which the first cut
            // of this loop did not do: `lo` was left where the bracket search put
            // it (1.46… for any y under Γ(2), or 64 for y = 1e100) while only `hi`
            // moved, so a step forced back to the midpoint walked down from the top
            // at one halving per pass. Measured: 5e-5 relative after 100 iterations
            // near the minimum, and 4e-10 for y = 1e100 - both simply out of time,
            // not out of ideas.
            if (g > y) hi = x; else lo = x;
            // Newton on the log, which is what Γ actually looks like across most
            // of this range: a straight line with slope ψ. d/dx[(ln g)'] = ψ' =
            // trigamma, so   x - (ln g - ln y)/ψ'(x)  ==  x - rel/ψ'(x),
            // written without ever taking a logarithm of an overflowing Γ. Newton on
            // Γ itself - x - (g - y)/(g·ψ), the same root in exact arithmetic -
            // crawls out there: measured at y = 1e100 it moved 0.22 per step against
            // a shrinking bracket and ran the cap out without arriving.
            let next = x;
            const curv = trigamma(x);
            if (isFinite(curv) && curv > 0) {
                next = x - rel / curv;
                // Rejected when it leaves the bracket OR when it is a crawl - under
                // a tenth of the bracket says the derivative has nothing useful to
                // contribute here (it vanishes at the turn, and near the floor that
                // is exactly where this lands). Take the midpoint instead, which
                // always halves the error bar.
                if (!(next > lo && next < hi) || Math.abs(next - x) < 0.1 * (hi - lo))
                    next = (lo + hi) / 2;
            } else {
                next = (lo + hi) / 2;
            }
            if (next === x) break;                  // bracket closed to the ulp
            x = next;
        }
        return x;
    }

    // Digamma ψ(x) = d/dx ln Γ(x), from the asymptotic series. Used as Γ' = Γ·ψ
    // (exact derivative, so Newton converges quadratically) and to locate the
    // minimum of Γ for inverseFactorial()'s small-value branch. For x < 6 the
    // recurrence ψ(x) = ψ(x+1) - 1/x lifts into range first; every call here lands
    // on positive x, so no reflection branch is needed.
    function digamma(x) {
        let r = 0;
        while (x < 6) { r -= 1 / x; x += 1; }
        const l = 1 / (x * x);
        return r + Math.log(x)
             - 0.5 / x
             - l * (1 / 12 - l * (1 / 120 - l * (1 / 252)));
    }

    // Trigamma ψ'(x) - the derivative of the one above, term by term: the
    // recurrence ψ'(x) = ψ'(x+1) - 1/x², then the asymptotic series. Only needed
    // to locate the zero of ψ (that is Γ's minimum), and Newton needs it exactly:
    // the same bracketed recipe as invΓ, run on a function whose slope is well away
    // from zero here, converges in half a dozen steps.
    function trigamma(x) {
        let r = 0;
        while (x < 6) { r += 1 / (x * x); x += 1; }
        const l = 1 / (x * x);
        return r + 1 / x + l * (1 / 2 - l * (1 / 6 - l * (1 / 10 - l * (1 / 12))));
    }

    // How far apart two Lanczos gammas of the same value can be: both sides of a
    // round trip carry this implementation's own error, so an exact comparison
    // could never accept a snap. Measured across the checked range - 24 and 3628800
    // land inside 1e-15 relative of their inputs, y = 1e200 inside 1.2e-10 - so
    // 1e-7 is roughly three orders of magnitude of headroom over what the round
    // trip actually needs, and no more.
    const IFACT_TOL = 1e-7;

    // The solver's side of that same round trip. An integer factorial the size of
    // y is bracketed to about this relative error (measured: 2.3e-12 at y = 1e9,
    // 8e-11 at 1e100, 1.2e-10 at 1e200), and the snap has to survive the sum of
    // the two - so this is what the "did it land on a whole number?" test is
    // checked against, with GAMMA_TOL for the solve and IFACT_TOL for the trial.
    const GAMMA_TOL = 1e-13;

    // Inverse factorial, !y: the n with n! = y. Built on invΓ, never around it -
    // n! = Γ(n+1), so n = invΓ(y) - 1.
    //
    //   a. an integer input wants an exact whole answer when one exists, and only
    //      the factorial ladder can hand that over: walk n! up to y, stop at or
    //      past it, and return n when it lands exactly (5040 -> 7). The same walk
    //      catches 1, which is ambiguous - both 0! and 1! are 1 - and gives the
    //      smaller, matching the branch below.
    //   b. otherwise solve: invΓ, minus 1, then look for zeros in the decimal part.
    //      A y between two factorials has no whole answer and keeps its fraction
    //      (the factorial is strictly increasing past x = 0.4616…, so that fraction
    //      IS the answer); a y of 24 comes back as 3.9999999998 because the solve
    //      stops at a tolerance rather than at equality, and its decimal part is
    //      nine zeros before an 8.
    //   c. round to the nearest whole number and put it back through the factorial.
    //      A snap that reproduces the input was rounding error and is kept; one
    //      that does not (100 -> 4, because 4! = 24) is refused and the decimal
    //      stands. Nothing else on this calculator gets to decide an answer is
    //      whole: only re-doing the forward operation proves it.
    //
    // Returns null when y is below the minimum of Γ, where no real answer exists -
    // the caller owns the alert. (0! = 1 and 1! = 1 are both above it.)
    function inverseFactorial(y) {
        if (!(y instanceof Decimal)) y = new Decimal(y);
        if (y.isNaN() || !y.isFinite()) return y;       // Infinity -> Infinity
        if (y.lt(GAMMA_MIN)) return null;

        // (a) an integer input above 1: the exact ladder first, because only the
        // factorial itself can hand over a whole answer that is exactly right.
        // y = 1 is deliberately not in here - it IS a factorial (0! and 1!, so the
        // smaller, 0) and sending it to the solver instead let the snap below find
        // that !1 reproduces 1 and answer every y under 1.2 with 1: 1.5! -> 1.
        // The ladder starts at 1! for the same reason - 0! would answer nothing
        // this branch is allowed to answer.
        if (y.gt(1) && y.isInteger()) {
            let f = new Decimal(1), n = 1;
            while (f.lt(y) && n < 100000) { n++; f = f.times(n); }
            if (f.eq(y)) return new Decimal(n);
        }
        // y = 1 exactly: both 0! and 1! are 1, and the smaller is the answer.
        if (y.eq(1)) return new Decimal(0);

        // (b) between 0.8856… and 2! = 2 (1 went up the ladder above). The
        // factorial is increasing from x = 0.4616…, where it is 0.8856…, so a y in
        // this range has exactly one answer on that arm - and, because the curve
        // dips down through 1 between its poles at x = -1 and x = 0, a second one
        // just left of -1 (0.9! is also 0.9). The increasing arm is the one worth
        // printing: it is continuous in y, it holds every whole factorial, and the
        // branch chosen everywhere else on this function is the increasing one.
        // So solve Γ(x) = y by bisection between the turning point and 2 (no
        // Newton there: its slope vanishes at the turn), then take x - 1 like
        // everywhere else. Bisection rather than invΓ because invΓ walks the right
        // arm from a start above the turn, and for y under 1 that arm is the wrong
        // side of it.
        if (y.lt(2)) {
            let lo = GAMMA_MIN_X, hi = 2.0;
            for (let i = 0; i < 90; i++) {
                const mid = (lo + hi) / 2;
                if (gamma(mid) > y) hi = mid; else lo = mid;
            }
            return new Decimal((lo + hi) / 2 - 1);
        }

        // (b) the raw inverse, then its decimal part. 2 is already excluded above,
        // so the bracket invΓ works in here starts at Γ(3) = 2 and holds.
        const raw = invGamma(y.toNumber()) - 1;
        if (!isFinite(raw)) return null;
        const d = new Decimal(raw);
        // Error the solver can carry, scaled with the answer: GAMMA_TOL is relative
        // to y, and n grows like log(y) while y grows like n!, so this is wildly
        // conservative for large n - which is the point, since the whole-number
        // test has to stay open at 10! and closed between 10! and 11!.
        const nScale = new Decimal(Math.max(1, Math.abs(raw)))
                           .times(new Decimal(y).ln().plus(1)).times(GAMMA_TOL);
        const cand = d.round();
        // The gate on the snap. Two conditions, because the round trip alone is
        // not enough and neither one on its own is either:
        //
        //   * near a whole number (within 1e-6). Every genuine fractional answer
        //     measured sits at least 0.1 away from one, while the solver puts a
        //     real whole answer within 1e-7 - so this separates them by orders of
        //     magnitude in both directions.
        //   * y near cand!, within IFACT_TOL RELATIVE. Absolute is wrong here: the
        //     spacing between consecutive factorials grows past a million before
        //     n reaches 10, so an absolute band would let !24 = 4 swallow anything
        //     in [23999995, 40000005] and answer 39916800 with 4. Relative is also
        //     what the solver's own error is measured in.
        //
        // The second test alone still fails at one point, which is why the first
        // exists: y = 1.5 has cand! = 1! = 1 within half a unit of it, so on an
        // absolute reading every y under 1.2 snapped to 1 (the solver's answer for
        // 1.5 is 1.09). Under the relative test that gap is 33%, far outside any
        // tolerance - and y = 1 itself never reaches here at all, settled by the
        // ladder above.
        // The width of "is it whole?" comes from the solver's own error, which
        // grows with y: measured at 2.3e-12 relative for y = 1e9 and 1.2e-10 for
        // y = 1e200, so n - and its distance from an integer - scale the same way.
        // A fixed 1e-6 is generous enough for small y and far too tight out there;
        // the max keeps it sane at n = 0. (A wrong candidate never gets as far as
        // being judged anyway: the relative trial test below rejects it outright.)
        const near = new Decimal('1e-6').plus(new Decimal(nScale));
        if (d.minus(cand).abs().lt(near) && !cand.lt(0)) {
            const back = gamma(cand.toNumber() + 1);
            if (isFinite(back) &&
                new Decimal(back).minus(y).abs().lte(y.times(IFACT_TOL)))
                return cand;
        }
        return d;
    }

    // The exponent marker ('e+' / 'e-') is ONE editing token. The cursor steps
    // over both characters at once and backspace removes both, so an edit can
    // never leave something the EE key itself could not produce - "5+3" (sign
    // deleted) or "53" ('e' deleted). Markers are always two characters: they are
    // only inserted as a pair, and Number.prototype.toString() always writes the
    // exponent with a sign (1e+21, 5e-7), so values recalled by Edit qualify too.
    function markerAt(s, i) {
        return s[i] === 'e' && (s[i + 1] === '+' || s[i + 1] === '-');
    }

    // Press-and-hold auto-repeat for a key. The action fires on the press (not
    // on release, so a hold feels immediate), then after an initial pause keeps
    // firing on an interval until the finger/mouse leaves - the same two-stage
    // timing every platform uses for its own cursor keys, and the reason the
    // pause is generous: it must stay comfortably longer than a deliberate tap.
    //
    // The synthesized click is swallowed once the press has acted, otherwise
    // every gesture would move one extra step at release. stopPropagation in
    // CAPTURE beats the inline onclick because capture runs before the target's
    // own handler; without it the two paths double-step.
    const REPEAT_DELAY_MS = 420, REPEAT_EVERY_MS = 75;
    function attachAutoRepeat(btn, action) {
        let timer = null, interval = null, downAt = 0;
        const halt = () => {
            clearTimeout(timer); clearInterval(interval);
            timer = interval = null;
        };
        btn.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            downAt = Date.now();
            action();
            halt();                               // one clean timeline per press
            timer = setTimeout(() => {
                interval = setInterval(action, REPEAT_EVERY_MS);
            }, REPEAT_DELAY_MS);
        });
        btn.addEventListener('pointerup', halt);
        btn.addEventListener('pointercancel', halt);
        // A MOUSE released outside the button never fires pointerup on it (touch
        // pointers are captured implicitly, mouse pointers are not), so without a
        // window-level stop a drag-off would leave the interval running forever.
        window.addEventListener('pointerup', halt);
        window.addEventListener('pointercancel', halt);
        // Swallow the synthesized click of a press THIS handler already acted on.
        // Keyed on press time rather than a flag cleared here: a flag left set by
        // an abandoned gesture (press, drag off, release elsewhere - no click ever
        // arrives to clear it) would silently eat the next click, and that next
        // click might be a keyboard-activated one (Enter/Space on a focused key,
        // which produces no pointerdown at all). An expiring window cannot strand
        // anything: stale means 'let it through'.
        btn.addEventListener('click', (e) => {
            if (!downAt || Date.now() - downAt > 2000) return;
            downAt = 0;
            e.stopPropagation(); e.preventDefault();
        }, true);
    }

    // Move cursor left or right in edit window (a marker counts as one step)
    function moveCursor(direction) {
        if (direction > 0) {
            cursorPos += markerAt(currentInput, cursorPos) ? 2 : 1;
        } else {
            cursorPos -= markerAt(currentInput, cursorPos - 2) ? 2 : 1;
            // defensive: never come to rest between 'e' and its sign
            if (markerAt(currentInput, cursorPos - 1)) cursorPos--;
        }
        if (cursorPos < 0) cursorPos = 0;
        if (cursorPos > currentInput.length) cursorPos = currentInput.length;
        updateDisplay();
    }
    // Toggle sign of current input value or set pending negative flag
    function toggleSign() {
        if (currentInput === "") {
            // No digits entered yet, toggle the pending negative flag
            pendingNegative = !pendingNegative;
            updateDisplay();
        } else {
            // Digits already entered, negate the current value. Exact, and
            // normalising like the parseFloat round trip always did: '2e+3'
            // becomes '-2000'. storedText so a long integer keeps its digits
            // rather than flipping to exponent form mid-edit.
            try {
                currentInput = storedText(new Decimal(currentInput).neg());
                cursorPos = currentInput.length;
                pendingNegative = false; // Clear pending flag since we have a value now
                anchorEntryStart();      // the flip keeps whatever overflow there was
            } catch (e) { /* unparseable entry: leave it alone */ }
        }
    }

    // EE - exponent entry, HP style. Inserts 'e+' at the cursor; with Inv (shown
    // as 'EE−') inserts 'e-'. If the number already carries an exponent, both
    // forms flip that sign instead of inserting a second marker (this folds in
    // handleExponentSign() from the second source copy, which was defined but
    // never wired up). Needs a mantissa, so it is inert on an empty entry.
    function handleExponent(negative) {
        const marker = currentInput.toLowerCase().indexOf('e');

        if (marker !== -1) {
            // Already has an exponent: set/flip its sign, leave the cursor sane.
            const after = currentInput.substring(marker + 1);
            const sign = negative ? '-' : '+';
            currentInput = currentInput.substring(0, marker + 1) + sign +
                           (/^[+-]/.test(after) ? after.substring(1) : after);
            cursorPos = Math.min(cursorPos, currentInput.length);
            updateDisplay();
            return;
        }

        // No mantissa yet - nothing sensible to attach an exponent to.
        if (currentInput === '' || currentInput === '-' || /\.$/.test(currentInput)) return;

        const ins = negative ? 'e-' : 'e+';
        currentInput = currentInput.substring(0, cursorPos) + ins + currentInput.substring(cursorPos);
        cursorPos += ins.length;
        updateDisplay();
    }

    // Negate top of stack value
    function handleNegateStack() {
        if (currentInput !== "") {
            handleEnter();
        }
        
        if (stack.length > 0) {
            const a = stack.pop();
            lastX = a;
            stack.push(a.neg());     // exact - no snap needed on a sign flip
            updateDisplay();
        }
    }

    // Backspace - delete one character to the left of the cursor, or the whole
    // exponent marker when its two characters are what sits there.
    function handleBackspace() {
        if (cursorPos <= 0) return;

        const s = currentInput;
        let n = 1;
        if (markerAt(s, cursorPos - 2)) {
            n = 2;                                  // cursor at the pair's right edge
        } else if (markerAt(s, cursorPos - 1)) {
            // Defensive: cursor sitting between 'e' and its sign. No key sequence
            // reaches that state (moveCursor steps over the pair), but tap-to-position
            // or a future edit might - delete the whole pair rather than half of it.
            cursorPos++;
            n = 2;
        }
        currentInput = s.substring(0, cursorPos - n) + s.substring(cursorPos);
        cursorPos -= n;

        // A marker needs digits in front of it to exponentiate. Deleting the last
        // mantissa character can orphan one: "5e+3" -> "e+3", or (with a leading
        // minus) "-4e-15" -> "-e-15". parseFloat() reads both as NaN, so take the
        // orphaned marker along and keep whatever remains - including the '-'.
        const orphan = /^(-?)(e[+-])/.exec(currentInput);
        if (orphan) {
            // Remove only the 'e[+-]' part. Group 1 is a minus we want to keep, so
            // its length must be stepped over rather than counted as removed -
            // otherwise "-e+1" came out as "+1".
            const at = orphan.index + orphan[1].length;
            currentInput = currentInput.substring(0, at) + currentInput.substring(at + 2);
        }
        if (cursorPos > currentInput.length) cursorPos = currentInput.length;
        updateDisplay();
    }

    // --- operator keys with Inv / Fn forms --------------------------------
    // Same lastX/lastCalc discipline as + - * / : a binary op stores the value
    // that was on top when the key was pressed, so Lst X can recall it.
    // No key changes its meaning based on how many items are on the stack -
    // each mode of a key is one fixed operation.

    // % : "as a fraction" - divide by 100. Unary, always has been.
    // Its inverse pair is Inv-% (x100), so the two keys undo each other.
    function handlePercent() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length < 1) return;
        const a = stack.pop();
        lastX = a;
        stack.push(snapResult(a.div(100)));
        updateDisplay();
    }

    // Inv on % (labelled ×100): multiply by 100 - the exact inverse of %, so "%"
    // then "Inv-%" returns the original number. Pairs with % the way eˣ pairs
    // with ln.
    function handlePercentInv() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length < 1) return;
        const a = stack.pop();
        lastX = a;
        stack.push(snapResult(a.times(100)));
        updateDisplay();
    }

    // Fn on %: HP percent-change. x y pct -> "x to y is what percent?"
    // (y-x)/x*100, so 3 [enter] 5 Fn-% gives +66.67. Binary and lossy by
    // nature (two values become one), which is why it lives on the modifier
    // rather than sharing a key with the unary %.
    function handlePctChange() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length < 2) return;
        const y = stack.pop();   // new value
        const x = stack.pop();   // base value
        if (x.isZero()) { alert("Percent of zero"); stack.push(x); stack.push(y); return; }
        lastX = y;   // HP convention: the value that was on top before the op
        stack.push(snapResult(y.minus(x).div(x).times(100)));
        updateDisplay();
    }

    // Inv on the xʸ key: ˣ√y - "the x'th root of y". Spoken order rules: the
    // index is said first (pos 1), the radicand last, so it sits on top:
    //     3 ENTER 8 ˣ√y   -> 2     ("the third root of eight")
    // Part of the closed reversal cycle (see opButtons): after a power,
    // Lst X + Swap + ˣ√y recovers the original base, and each hop leaves the
    // value the NEXT key in the cycle needs on top.
    // Domain: degree 0 divides by zero in the exponent; negative radicands are
    // rejected like √x and ∛x already are (the app's convention - JS Math.pow
    // returns NaN for fractional powers of negatives anyway).
    function handleRoot() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length < 2) return;
        const rad = stack.pop();       // top = radicand (said last: "root OF y")
        const deg = stack.pop();       // below = index (said first: "x'th root")
        if (deg.isZero()) { alert("Div by zero"); stack.push(deg); stack.push(rad); return; }
        if (rad.lt(0)) { alert("Complex number"); stack.push(deg); stack.push(rad); return; }
        lastX = rad;    // HP rule: the value that was in position 0 before the op
        try {
            // 8 [enter] 3 root -> 2 exactly: the tiny residue of the 40-digit
            // fractional power is a trailing run of 9s, and snapResult carries
            // it (the same rule that makes 1/3*3 land on 1).
            stack.push(snapResult(rad.pow(new Decimal(1).div(deg))));
        } catch (err) {
            alert('Overflow');
            stack.push(deg); stack.push(rad);
        }
        updateDisplay();
    }

    // Fn on the xʸ key: log_y(x) - "the log of x to the base y".
    //     8 ENTER 2 log_y(x)   -> 3   ("log of eight to the base two")
    // The stack order has NOT changed with the relabel: x (the argument) is
    // entered first and sits at position 1, y (the base) second and on top -
    // exactly as when this key read logₓy. Only the label moved, so that the
    // variables appear on the cap in the same x-then-y order they are entered
    // in and spoken in, matching every other binary key here. The subscript is
    // "1y" so that reading left to right gives x then y; a plain log_y(x) would
    // have put y before x on the face again. See the pow entry in the modifier
    // tables above for why the label was changed rather than the operands.
    // Domain: both values positive, base ~1 rejected.
    function handleLogY() {
        if (currentInput !== "") {
            handleEnter();
        }

        if (stack.length < 2) return;
        const base = stack.pop();      // top = y, the base (entered second)
        const arg  = stack.pop();      // below = x, the argument (entered first)
        if (base.lte(0) || arg.lte(0)) { alert("Domain error: log needs positive values"); stack.push(arg); stack.push(base); return; }
        // Same absolute 1e-12 band as before, now a Decimal comparison.
        if (base.minus(1).abs().lt('1e-12')) { alert("Log base 1 undefined"); stack.push(arg); stack.push(base); return; }
        lastX = base;   // HP rule: the value that was in position 0 before the op
        try {
            stack.push(snapResult(arg.ln().div(base.ln())));
        } catch (err) {
            alert('Overflow');
            stack.push(arg); stack.push(base);
        }
        updateDisplay();
    }

    // Handle Basic Arithmetic (+, -, *, /, ^)
    function handleOp(operator) {
        if (currentInput !== "") {
            handleEnter();
        }
	// Same finally-guard as calcFunc: the early returns below (not enough
	// levels, division by zero) must not leave lastCalc stuck on.
	lastCalc = true;
	try {
	    opBody(operator);
	} finally {
	    lastCalc = false;
	}
    }

    function opBody(operator) {
        if (operator === '^') {
            if (stack.length < 2) { flashErr(); return; }
            const b = stack.pop();
            const a = stack.pop();
            // Lst X follows the HP convention exactly: LASTX holds the value
            // that was in X - the TOP of the stack - before the operation.
            // For two-number operations that is the SECOND operand entered,
            // per the HP service documentation's operational sequence for +
            // ("take a copy of the X-register contents and put it in L-register
            // (last-x)" first, then combine Y into X), and the 35s rule ("LAST
            // X preserves the number that was in X before the last numeric
            // operation"). So "2 ENTER 3 *" leaves LASTX = 3, not 2 - the
            // operand already sitting below is NOT what Lst X recalls.
            lastX = b;
            try {
                // NaN parity: a negative base with a fractional exponent gives
                // a NaN value here exactly as Math.pow did (no guard - the old
                // app displayed NaN for it too).
                stack.push(snapResult(a.pow(b)));
            } catch (err) {              // safety net, same as calcBody: huge
                alert('Overflow');       // exponents usually arrive as an
                stack.push(a); stack.push(b);   // Infinity value instead
            }
            updateDisplay();
        } else {
            if (stack.length < 2) { flashErr(); return; }

            const b = stack.pop();
            const a = stack.pop();
            let result = new Decimal(0);

            switch(operator) {
                case '+': result = a.plus(b); break;
                case '-': result = a.minus(b); break;
                case '*': result = a.times(b); break;
                case '/': 
                    // Guard BEFORE dividing: decimal.js hands out an Infinity
                    // value for 1/0 rather than objecting, and that would sit
                    // on the stack poisoning later steps.
                    if(b.isZero()) { alert("Div by zero"); stack.push(a); stack.push(b); return; }
                    result = a.div(b); 
                    break;
            }

            lastX = b;      // previous X = top operand - see note above
            stack.push(snapResult(result));
            updateDisplay();
        }
	lastCalc = false;
    }

    // Toggle Angle Mode (Deg/Rad)
    function toggleAngleMode() {
        angleMode = angleMode === 'deg' ? 'rad' : 'deg';
        updateDegRadBtnState();
        updateAnnunciators();
        updateDisplay();       // its saveSession() now records the angle too
    }

    // Update button states (including angle mode indicator)

    // Update angle mode toggle button visual (highlight active word)
    function updateDegRadBtnState() {
        const degRadBtn = document.querySelector('button[data-func="degRad"]');
        if (degRadBtn) {
            degRadBtn.classList.remove('deg-active', 'rad-active');

            if (angleMode === 'deg') {
                degRadBtn.classList.add('deg-active');
            } else {
                degRadBtn.classList.add('rad-active');
            }
        }
    }


    // ------------------------------------------------------------------
    // Viewport + edge auto-detection - measured, never guessed
    //
    // Two measurements feed the CSS custom properties:
    //   1. how much of the screen is actually visible -> --app-height
    //      (Chrome moves window.innerHeight with its toolbar; Firefox keeps it
    //      fixed and only moves the visual viewport, so take the smaller of the
    //      two readings - that is always the truth on both.)
    //   2. how much of it is covered by hardware or browser UI (camera cutout,
    //      status bar, curved corners, gesture bar) -> --top-floor etc.
    //      Read back out of env(safe-area-inset-*) with a probe element, because
    //      those values are not exposed to JS any other way. Once viewport-fit=
    //      cover lets Chrome draw under the cutout in full screen, this is the
    //      number Chrome itself hands us for it - no device-specific constants.
    const visualVP = window.visualViewport;   // Visual Viewport API

    function measureVisibleHeight() {
        const h = visualVP ? Math.min(window.innerHeight, visualVP.height) : window.innerHeight;
        return Math.max(0, Math.round(h));
    }

    // --- edge (safe area) probe ---------------------------------------------
    const insetProbe = document.createElement('div');
    insetProbe.setAttribute('aria-hidden', 'true');
    insetProbe.style.cssText =
        'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;' +
        'pointer-events:none;' +
        'padding-top:env(safe-area-inset-top,0px);' +
        'padding-bottom:env(safe-area-inset-bottom,0px);' +
        'padding-left:env(safe-area-inset-left,0px);' +
        'padding-right:env(safe-area-inset-right,0px);';
    document.body.appendChild(insetProbe);

    function readInset(side) {                 // 'Top' | 'Bottom' | 'Left' | 'Right'
        if (!window.getComputedStyle) return 0;
        const v = parseFloat(window.getComputedStyle(insetProbe)['padding' + side]);
        return isFinite(v) ? v : 0;
    }

    // Largest inset ever reported per orientation. Two reasons to remember it:
    //   * Chromium resets safe-area values when the "active frame" changes (which
    //     entering full screen does), and its dynamic insets shrink/grow with the
    //     browser controls, so a 0 reading is not proof that nothing overlaps.
    //   * The bottom inset seen while windowed (Android's gesture-navigation area,
    //     which spans the curved bottom corners) is exactly what we want to keep
    //     clear once full screen hides that bar and reports 0 instead.
    // Floors are always learned, but CSS only applies them under html.immersive,
    // so a value learned in one mode never pads the other.
    let floorTop = 0, floorBottom = 0, floorSide = 0, floorOrientation = '';

    function updateInsetFloors() {
        const t = readInset('Top'), b = readInset('Bottom');
        const side = Math.max(readInset('Left'), readInset('Right'));
        // Key on orientation only - the width/height numbers also change when a
        // toolbar tucks away, which must not discard what we have learned.
        const orient = window.innerWidth > window.innerHeight ? 'landscape' : 'portrait';

        if (orient !== floorOrientation) {
            // Rotation: the cutout moves to another edge, so start over.
            floorOrientation = orient;
            floorTop = t; floorBottom = b; floorSide = side;
        } else {
            if (t > floorTop) floorTop = t;
            if (b > floorBottom) floorBottom = b;
            if (side > floorSide) floorSide = side;
        }
        return { top: Math.round(floorTop), bottom: Math.round(floorBottom), side: Math.round(floorSide) };
    }

    // --- one column or two? -------------------------------------------------
    // A phone lying on its side is over twice as wide as it is tall, and nine
    // rows of keys cannot fit in ~360px without being flattened. Past this
    // aspect ratio the keypad splits into the two-column landscape layout (see
    // html.wide in CSS); below it we stay with the single tall column.
    // The minimum width matters: splitting a narrow window would give two stacks
    // of ~30px-wide keys, which is worse than scrolling. PHONEISH_H must equal
    // the (max-height: 620px) in the mobile media query - above it the CSS that
    // .wide switches on does not exist, so the class must not be set.
    const WIDE_RATIO = 1.3;      // width / height at or above which we split
    const WIDE_MIN_W = 560;      // below this the two halves are too narrow
    const PHONEISH_H = 620;

    function isWideLayout(w, h) {
        if (h <= 0 || h > PHONEISH_H) return false;
        return w >= WIDE_MIN_W && (w / h) >= WIDE_RATIO;
    }

    function fitToViewport() {
        const visible = measureVisibleHeight();
        if (visible === 0) return;   // not measurable right now, keep current layout

        const immersive = isImmersive();
        const floors = updateInsetFloors();
        const vw = Math.round(window.innerWidth);
        const wide = isWideLayout(vw, Math.round(window.innerHeight));

        // How much window the browser UI is covering right now; informational,
        // and always 0 when immersive (there is no toolbar left to cover us).
        if (immersive) {
            chromeHeight = 0;
        } else {
            const w = vw;
            if (w !== refWidth) { refWidth = w; maxSeenHeight = visible; }
            else if (visible > maxSeenHeight) maxSeenHeight = visible;
            chromeHeight = maxSeenHeight - visible;
        }

        const key = (immersive ? 'F' : 'W') + (wide ? '2' : '1') + ':' + vw + ':' + visible +
                    ':' + floors.top + '/' + floors.bottom + '/' + floors.side;
        if (key === lastLayoutKey) return;           // nothing moved -> no restyle
        lastLayoutKey = key;

        const rootEl = document.documentElement;
        // Gates the edge guards above: they only apply when we can be drawn under
        // hardware UI. Also handy for styling from CSS.
        rootEl.classList.toggle('immersive', immersive);
        // One column (portrait / narrow) or two (landscape / wide). Set before
        // fitKeys() so it measures the layout this decision produces.
        rootEl.classList.toggle('wide', wide);

        const rootStyle = rootEl.style;
        rootStyle.setProperty('--app-height', visible + 'px');
        rootStyle.setProperty('--chrome-height', chromeHeight + 'px');
        // App mode never pads the top with this (viewport already starts below
        // the status bar there); the Fullscreen-API state does, as a fallback for
        // env() - see --safe-top in the @media block. Also shown by diagnostics.
        rootStyle.setProperty('--top-floor', floors.top + 'px');
        rootStyle.setProperty('--bottom-floor', floors.bottom + 'px');
        rootStyle.setProperty('--side-floor', floors.side + 'px');

        fitKeys();
        // The viewport just moved under us. If the menu/welcome panel is
        // open, its height was measured against the OLD geometry - follow
        // along, or it stays short (or overshoots) for as long as it is up.
        if (menuOpen) remeasureMenuHeight();
    }

    // The page no longer scrolls, so nothing may stick out past the bottom safe
    // area: on a short viewport (landscape phones, a big cutout guard) give space
    // back in a fixed order - first the stack history window, then the key height
    // - instead of letting the ENTER row be clipped by the curved corners.
    const KEY_BASE_PAD = 14;   // matches the CSS default
    // Resting pad for the function block in the two-column layout. It is smaller
    // on purpose: there the number pad is sized by its grid cells (five tall
    // rows), while this block's height is exactly what is left over for the
    // history window - flatter function keys buy those keys back as more lines
    // of stack.
    const KEY_BASE_PAD_WIDE = 11;
    const KEY_MIN_PAD = 5;
    // The stack window's resting height IS a constant again - deliberately kept
    // separate from the font/line-count zoom, which must never resize it. It was
    // 132px on mobile / 144px desktop before the LCD work; 168 was ~+20% on
    // both, and 185 is another 10% on top of that - enough to buy back a stack
    // line at the default detent without encroaching on the keys, which
    // fitKeys() still guards: this window is what it trades back first when a
    // viewport runs short.
    // STACK_MIN_H is the floor fitKeys() may shrink it to when the keys need the
    // room (short landscape viewports); rows re-tile to whatever height survives.
    const LCD_WINDOW_H = 185;
    const STACK_MIN_H = 40;
    // Annunciator strip height, JS's copy of the CSS constant: .stack-display
    // and .menu-display are both calc(--stack-h ... - 18px). Must stay in
    // sync with those rules (lcdGeometry subtracts it when it cannot measure).
    const LCD_ANN_H = 18;

    // ------------------------------------------------------------------
    // LCD font / line-count zoom (pinch on the display).
    //
    // A physical calculator has one LCD cell size, so the entry line and the
    // stack scale together - one setting, not two. A detent says "show N stack
    // levels"; the window's measured height decides the row pitch, and the type
    // is then sized to FILL that row (bounded by leading and by the row's width,
    // in that order of preference). The window itself never changes size, so a
    // pinch is a pure zoom.
    //
    // 3..6 levels: 3 stays usable on a short landscape phone, 6 rewards a large
    // portrait screen. Default is 5 (four history rows plus the highlighted
    // level 0), with the entry line beneath.
    //
    // font here is a CEILING, not the size actually used: the type is sized to
    // fill whatever the row and the row's WIDTH allow (see lcdGeometry), and this
    // number only stops it growing further on a tall/wide window. It also keeps
    // every detent clean at any height, and why a highlighted level 0 - which
    // used to carry 4px of padding its siblings lacked - can no longer push a row
    // out of the box: CSS gives EVERY row that same --lcd-row-pad.
    const LCD_STEPS = [
        { lines: 3, font: 48 },   // biggest type, fewest lines
        { lines: 4, font: 36 },
        { lines: 5, font: 28 },   // default
        { lines: 6, font: 24 }    // smallest type, most lines
    ];
    const LCD_ROW_PAD = 2;        // must match --lcd-row-pad / .stack-0-val
    const LCD_MIN_FONT = 11;

    // How tightly the type fills its row: (row height - padding) / font size.
    // 1.2 is roomy book leading and was what left the big gaps at 3 lines; 1.0
    // would let ascenders touch. Since --lcd-line-h is set to exactly the row's
    // content box, this factor is the ONLY thing deciding how full a line looks -
    // one knob for "fill more of the line", and it scales every detent at once.
    const LCD_LINE_FACTOR = 1.1;

    // Width guard. Bigger type fills the row vertically but eats horizontal
    // room, and .stack-val ellipsizes - so size to the width too, using the
    // widest readout worth guaranteeing. Values are parseFloat(toPrecision(12)),
    // which prints 13-14 characters for almost every result (worst realistic
    // case ~19: '-9999823132850000.0').
    //
    // This is the binding limit at 3 lines, not the row height: a phone row is
    // ~56px tall but only ~370px wide, so type big enough to fill it vertically
    // (47px) could show about 11 characters and would ellipsize ordinary answers.
    // LCD_MAX_TEXT is that trade-off in one number - lower = bigger type, long
    // numbers get '...'; higher = every readout fits, more gap in the row.
    const LCD_MAX_TEXT = 14;
    const LCD_CHAR_W = 0.6;       // Courier New advance width, in ems (exact)
    // The part of a row a number cannot use: label column ('99:' at its fixed
    // 14px, ~26px) + .stack-item padding-right + the highlight's left inset.
    // Font-independent now that the label does not scale with --lcd-font.
    const LCD_ROW_CHROME_W = 36;

    // Smallest row that is still readable, and so the most lines a window of a
    // given height can hold. A detent asking for more lines than fit (6 on a
    // viewport where fitKeys() had to shrink the display) shows fewer rather
    // than a partially cut line - tiling always satisfies N * rowH <= height.
    const LCD_MIN_ROW = 16;
    const LCD_DEFAULT_STEP = 2;   // -> 5 lines
    let lcdStep = LCD_DEFAULT_STEP;
    let lcdActual = { lines: 5, rowH: 33, font: 23 };   // last applied geometry

    // Geometry for the current detent, measured against the window as it is on
    // screen RIGHT NOW (clientHeight = content box, so the 1px border-bottom and
    // any squeeze fitKeys() applied are already accounted for). Deriving the row
    // pitch from the real height instead of from a formula is what makes this
    // immune to browser rounding, device pixel ratio and viewport pressure.
    function lcdGeometry() {
        const lines = LCD_STEPS[lcdStep].lines;
        const el = document.getElementById('stack');
        // Measure the live box when it is on screen. When it is NOT (menu
        // open - display:none, clientHeight 0) or before first layout,
        // derive what the CSS would give: the CURRENT --stack-h inline value
        // (fitToViewport may have shrunk it below LCD_WINDOW_H) minus the
        // annunciator strip. Falling back to bare LCD_WINDOW_H here was a
        // bug: prefs changed from inside the menu computed rows for 18px
        // more than exists, and the top row clipped under the lamp strip.
        let avail;
        if (el && el.clientHeight) {
            avail = el.clientHeight;
        } else {
            const declared = parseFloat(
                document.documentElement.style.getPropertyValue('--stack-h'));
            avail = (isFinite(declared) ? declared : LCD_WINDOW_H) - LCD_ANN_H;
        }
        avail = Math.max(STACK_MIN_H, avail);
        // Width is not affected by the vertical squeeze, but is measured from the
        // same live box so a narrow phone caps the type before it ellipsizes.
        const availW = Math.max(120, (el && el.clientWidth) || 360);
        // Never ask for more rows than this height can hold at a readable pitch.
        const shown = Math.max(1, Math.min(lines, Math.floor(avail / LCD_MIN_ROW)));
        const rowH = Math.max(LCD_MIN_ROW, Math.floor(avail / shown));
        // Vertical: largest font that still leaves LCD_LINE_FACTOR of leading.
        const hFit = Math.floor((rowH - LCD_ROW_PAD * 2) / LCD_LINE_FACTOR);
        // Horizontal: largest font that fits LCD_MAX_TEXT characters in the same
        // box, so zooming in never starts cutting numbers off with an ellipsis.
        const wFit = Math.floor((availW - LCD_ROW_CHROME_W) /
                                (LCD_CHAR_W * LCD_MAX_TEXT));
        const font = Math.max(LCD_MIN_FONT,
                              Math.min(LCD_STEPS[lcdStep].font, hFit, wFit));
        // lines is what the detent ASKS for; shown is what this window can hold.
        return { lines: shown, wantLines: lines, rowH: rowH, font: font };
    }

    function applyLcdStep() {
        const g = lcdActual = lcdGeometry();
        const rs = document.documentElement.style;
        rs.setProperty('--lcd-font', g.font + 'px');
        // Leading fills the row's content box exactly, which centres each line
        // in its row and keeps rows tiling with no drift.
        rs.setProperty('--lcd-line-h', (g.rowH - LCD_ROW_PAD * 2) + 'px');
        rs.setProperty('--lcd-row-h', g.rowH + 'px');
        rs.setProperty('--lcd-lines', String(g.lines));
        // A font change reflows the entry text: a number that fitted before may
        // overflow now (or vice versa), so re-check the cursor window and chips.
        keepCursorInView();
    }

    applyLcdStep();   // set the CSS vars before the first fitToViewport()

    // ------------------------------------------------------------------
    // LCD tone detents (Menu > Preferences > Screen). Five steps per axis,
    // level 3 exactly x1.00 - the factory look with no filter applied.
    // Brightness tops out at 1.35 because past that the green washes to
    // grey-white; contrast extremes stay readable-but-characteristic.
    const LCD_BRIGHT = [0.60, 0.80, 1.00, 1.18, 1.35];
    const LCD_CONTRAST = [0.75, 0.88, 1.00, 1.15, 1.30];
    // One axis at a time (null = leave the other). Writes CSS vars only -
    // prefs are the record, and applyPrefs() rewrites both from prefs.
    function setLcdTone(brightLevel, contrastLevel) {
        const st = document.documentElement.style;
        if (brightLevel !== null)
            st.setProperty('--lcd-bright', LCD_BRIGHT[brightLevel - 1]);
        if (contrastLevel !== null)
            st.setProperty('--lcd-contrast', LCD_CONTRAST[contrastLevel - 1]);
    }

    // --- key press: haptics, and touch activation the app owns -------------
    // navigator.vibrate is Android/Chromium only; iOS Safari has no such API
    // at all, so everything there degrades to a silent no-op (the preference
    // still tells the truth: it gates the one path that exists). One short
    // tick as a key registers - nothing else buzzes. An abandoned press (slide
    // off) is SILENT: un-highlighting is its whole message, standard app
    // behaviour, and a reject buzz for what is really just 'not that key'
    // punishes a normal correction.
    // Length: raw vibrate pulses get spin-up/spin-down tails on real motors,
    // so the request stays well under the 10-40ms band the usual guides quote
    // for a 'crisp click' - this reads as a tick, not a buzz. One constant.
    const HAPTIC_TICK_MS = 6;
    function buzz(ms) {
        if (!prefs.haptics || !navigator.vibrate) return;
        // Pre-activation: queue this tick for the press's release instead of
