<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Pinch is disabled browser-wide (the app owns its own layout). Our own
         pinch handler on the LCD adjusts font/line-count instead. touch-action:
         none on .screen-container and .keypad reinforces this per-surface so a
         stray two-finger gesture never reaches the browser zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2b2b2b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Installable web app: this file + manifest.webmanifest + sw.js + icons/.
         Must be served over https (or http://localhost) - a manifest and service
         worker are ignored on file:// . All display modes feed isImmersive(). -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <title>PocketRPN - RPN Scientific Calculator</title>
    <style>
    :root {
        --bg-color: #1a1a1a;
        --screen-bg: #9ea792;
        --btn-dark: #3a3a3a;
        --btn-light: #505050;
        --btn-orange: #d68c45;
        /* The one 'indicator lamp' green in the palette (the Deg half of the
           Deg/Rad key). Any UI element that means 'a mode is ON' borrows it -
           see the Fn/Inv corner LEDs below - so amber stays reserved for
           operands/operators and lamps never multiply. */
        --led-green: #4caf50;
        --text-color: #1a1a1a;
        --display-text: #2b2b2b;

        /* LCD zoom. The WINDOW height (--stack-h) and the TYPE inside it are
           two independent things: pinch only ever changes the type, never the
           window. --lcd-lines is how many stack levels pinch asked for; JS then
           measures the real window and derives --lcd-row-h = floor(height /
           lines), so N rows tile the box exactly and no line can clip. The
           values here are only the pre-measurement defaults (5 rows of 33px in
           a 168px window). --lcd-line-h matches the row's content box, which
           vertically centres each line inside its row. */
        --lcd-font: 23px;
        --lcd-line-h: 29px;
        --lcd-row-pad: 2px;
        --lcd-row-h: 33px;
        --lcd-lines: 5;
        /* Height of the entry-line box, and so of the green LCD panel together
           with --stack-h. Fixed on purpose (the phone rule overrides it to 48px):
           scaling type must never resize the panel, or every pinch nudges the
           keypad. Big enough for the largest step's digits in both cases. */
        --lcd-entry-h: 62px;
        /* Width of the copy-rail column, shared by BOTH windows' rails and by
           the entry line's left overflow chip (which must start after it).
           Declared at :root so any of them can read it; keeping it in one
           place is what keeps the halves in one column. */
        --copy-rail-w: 48px;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Courier New', Courier, monospace;
        background-color: var(--bg-color);
        display: flex;
        justify-content: center;
        align-items: stretch;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        overflow-y: auto;
    }

    .calculator {
        background-color: #1a1a1a;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        width: auto;
        max-width: 450px;
        min-width: 320px;
        margin: auto;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* Display Screen */
    .screen-container {
        /* Pinch here is intercepted by our own handler (font/line zoom), so the
           browser must not also try to zoom. touch-action:none lets us receive
           the whole gesture; text selection still works because that is driven
           by long-press, not by a pan/pinch action. */
        touch-action: none;
        background-color: var(--screen-bg);
        /* LCD tone controls (Menu > Preferences > Screen): the glass dims and
           sharpens like a backlit instrument panel - brightness multiplies
           every channel, contrast pivots about mid-grey, so the green field
           lifts while the digits darken. Everything inside the container
           (lamps, menu surface, chips) follows together; the keypad outside
           deliberately does not - real hardware has no key-darkness wheel.
           JS writes both vars from prefs; defaults are identity filters. */
        filter: brightness(var(--lcd-bright, 1)) contrast(var(--lcd-contrast, 1));
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 15px;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        flex-shrink: 0;
    }
    /* Annunciator lamps. Small type has hardware precedence - these are
       annotations, not content. Hidden lamps keep their space (visibility,
       not display) so the row never reflows when a lamp lights. */
    .annunciators {
        --ann-h: 16px;
        height: var(--ann-h);
        line-height: var(--ann-h);
        display: flex;
        gap: 12px;
        align-items: center;
        padding-left: 2px;
        margin-bottom: 2px;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1px;
/*        color: rgba(43, 43, 43, 0.4); */
        user-select: none;
    }
    .annunciators .lamp { visibility: hidden; }
    .annunciators .lamp.on { visibility: visible; color: var(--display-text); }
    .annunciators .tappable { cursor: pointer; padding: 0 2px; }
    /* ERR is red even on this green glass - a refusal must not read as a
       mode. Three hard blinks, then off (JS removes the class). */
    .annunciators .lamp.err.on {
        color: #b3402e;
        visibility: visible;
        animation: err-blink 0.45s steps(1) 3;
    }
    @keyframes err-blink { 50% { visibility: hidden; } }
    /* Copy confirmations. Steady light, display ink - these are acknowledgments,
       not refusals, so they deliberately do NOT borrow ERR's red blink. JS turns
       them off on a timer (same pattern as flashErr). Hidden lamps keep their
       space, so lighting one never reflows the strip. */
    .annunciators .lamp.cpy.on,
    .annunciators .lamp.full.on { visibility: visible; }

    .stack-display {
        /* Tapping is a COPY action here (delegated listener), not a text
           selection - kill the native touch-hold selection entirely. Its
           anchor lands wherever the engine feels like, and it could never give
           the 'copies exactly what you see' guarantee the tap makes. */
        user-select: none;
        -webkit-user-select: none;
        /* Height is --stack-h (the fixed LCD_WINDOW_H) MINUS the annunciator
           strip, independent of the pinch zoom; --lcd-row-h below is derived
           from whatever height survives - lcdGeometry() measures, so taking
           18px for the lamp row costs rows and type automatically. */
        height: calc(var(--stack-h, calc(var(--lcd-lines, 5) * var(--lcd-row-h, 33px))) - 18px);
        /* The rail column's x, shared with .input-line (which declares the same
           8px). The stack is a scroll container, so its content box IS its clip
           box and the label's negative margin cannot reach past this edge - the
           inset has to be declared here for the visible box to start there. */
        padding-left: 8px;
        overflow-y: auto;
        display: flex;
        flex-direction: column-reverse;
    /*    justify-content: flex-end; */
        align-items: stretch;
        font-size: var(--lcd-font, 20px);
        /* Explicit leading keeps stack rows a predictable height (copy 2's idea). */
        line-height: var(--lcd-line-h, 24px);
        color: var(--display-text);
        border-bottom: 1px solid rgba(0,0,0,0.2);
        margin-bottom: 5px;
	scrollbar-width: none;
    }

    .stack-display::-webkit-scrollbar {
        display: none; /* Chrome/Safari/Webkit */
    }

    .stack-item {
        display: flex;
        justify-content: space-between;
        padding-right: 4px;
        /* Every row gets the same vertical padding that the highlighted level-0
           value has, so all rows are exactly --lcd-row-h tall. Otherwise the
           highlighted row is 4px taller than its siblings and pushes one line
           out of the (exact-multiple) window - the half-clipped line. box-sizing
           is border-box globally, so this padding sits inside the declared
           height instead of adding to it. */
        height: var(--lcd-row-h);
        padding-top: var(--lcd-row-pad, 2px);
        padding-bottom: var(--lcd-row-pad, 2px);
	scroll-snap-align: start;
    }

    /* The copy rail: one column down the left edge of BOTH display windows -
       the stack's level labels and the entry line's button below them. Same
       gesture in both places (copy the FULL stored value), so it gets one class
       and one look: a faint box that darkens while pressed. Keeping the visual
       treatment identical is what tells the user these two targets do the same
       thing; keeping the width identical (--copy-rail-w) is what keeps them
       actually in one column.
       The rail sits OUTSIDE the scrollable area of both windows: in the stack it
       is the row's first flex item, and in the entry strip it is the first flex
       item of a flex .input-line (#entry-view scrolls on its own), so panning a
       long number sideways cannot slide the box away and it stays under the
       finger for a whole hold. That is what makes the position safe to reserve -
       a target painted over the digits would travel with them.
       min-width is border-box (global), so it includes this target's horizontal
       padding; 48px is wide enough to be a real touch target rather than the
       label's old text-width sliver. */
    .copy-rail {
        min-width: var(--copy-rail-w, 48px);
        flex-shrink: 0;
        padding: 3px 12px;
        border-radius: 5px;
        background-color: rgba(43, 43, 43, 0.07);
        cursor: pointer;
    }
    /* Both halves darken under the finger. The stack label is a plain span, so
       it has no activation to hang a state on and takes :active; the entry-line
       button drives .pressed from its own pointerdown instead, because a press
       that gets cancelled (a scroll, a drag-off) must leave no trace - and
       :active on a button is not reliably cleared in every engine when the
       pointer leaves it mid-press. */
    .stack-pos:active,
    .copy-rail.pressed {
        background-color: rgba(43, 43, 43, 0.16);
    }

    .stack-pos {
        /* The level label is an annotation, not part of the number, so it keeps a
           fixed size instead of scaling with --lcd-font: at the big detents a
           proportional label was ~27px tall and ate the width the digits need.
           min-width (not width) + no shrink means '10:' can never overlap or
           squeeze the value - numbers right-align on a constant right edge, so a
           wider label column is invisible to them. */
        /* Deep-copy control: tapping this copies the level's FULL stored value
           (tapping the number itself copies what is shown). The digits keep
           their exact size and position; padding + an equal negative margin
           grow the hit area around them - full row height, wider column - with
           zero layout shift, and the subtle box marks the enlarged target. Row
           height caps at ~36px by design (exact tiling), so the target is as
           generous as the row allows rather than a literal 44px square. */
        width: auto;
        white-space: nowrap;
        text-align: left;
        font-weight: bold;
        opacity: 0.6;
        font-size: 12px;
        /* The negative VERTICAL margin is what makes the box full-row-height with
           zero layout shift (the row's own vertical padding is --lcd-row-pad,
           mirrored here).
           No negative LEFT margin, though it looks free: the label used to reach
           8px into the window's padding, and that overhang is exactly what put it
           out of column with the entry line's copy box. Both windows now declare
           the same 8px inset, so the two boxes start at one x and a finger aimed
           anywhere in that strip means 'copy in full' whichever row it lands on.
           (A negative margin could not have pulled the button over to match: the
           entry strip pins its first flex item to the content edge, where margins
           are inert - verified by measuring both ways.) */
        margin: -3px 0 -3px 0;
    }

    .stack-val {
        flex-grow: 1;
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: var(--lcd-font, 20px);
    }

    .stack-0-val {
        font-weight: bold;
        background-color: rgba(214, 140, 69, 0.3);
        border-radius: 4px;
        /* Vertical padding now comes from every .stack-item row (so all rows
           match); this keeps only the horizontal inset for the highlight. */
        padding: var(--lcd-row-pad, 2px) 6px;
        margin-right: -6px;
    }

    .input-line {
        /* The digits scale with the same --lcd-font so pinch keeps the two
           windows proportional (a physical LCD has one cell size) - but the
           LINE BOX does not: its height is the fixed --lcd-entry-h. Tying the
           height to the font was what made the whole green panel grow/shrink a
           few pixels per pinch step; with a constant box the panel only changes
           when --stack-h does, and line-height = height centres the digits. */
        /* min() so the digits stop growing rather than overflowing a box whose
           height is deliberately fixed: at the 3-line detent the stack type gets
           large enough that *1.6 would need more room than --lcd-entry-h gives.
           (48px glyph box / 1.15 leading on the phone, 62px on desktop.) */
        font-size: min(calc(var(--lcd-font, 20px) * 1.6),
                       calc((var(--lcd-entry-h, 62px) - 8px) / 1.15));
        font-weight: bold;
        color: var(--display-text);
        min-height: var(--lcd-entry-h, 62px);
        line-height: var(--lcd-entry-h, 62px);
        /* Positioning context for the scroll window and the two overflow chips.
           Clipping starts HERE, not out at .calculator: a long number used to
           be block overflow that escaped this box entirely (unbreakable digit
           runs never wrap) and got cut by whatever ancestor clipped last - the
           right side going off with no way to reach it. Now nothing leaves
           #entry-view, which JS pans horizontally.
           The left padding matches the stack window's own 8px inset exactly, so
           the copy rail starts at the same x in both windows and they read as
           one column. It costs the number 8px of width (the rail is always
           there, so that space was never usable anyway); it buys a strip whose
           clip box - and therefore whose visible rail - lines up with the
           stack's instead of hanging further left into the panel padding.
           NOTE: this padding does NOT position #entry-view - an absolutely
           positioned window ignores its containing block's padding (offsets
           resolve from the PADDING box). The view carries the same 8px + rail
           width as its own 'left' (see .entry-view); keep the two in step. */
        position: relative;
        /* Same left inset as .stack-display, so the copy rail and the level
           labels start at one x. It replaces the label's old negative-margin
           overhang rather than adding to it, so no digit moves. */
        padding-left: 8px;
        /* A flex row for the same reason the stack rows are one: the rail is a
           flex item, so nothing to its left can be reached by overflow and the
           number keeps its own box to scroll in. (As a plain block, an inline-
           flex child sat on the text baseline and no margin could pull it onto
           the labels' x - that is what made this strip 8px off for two tries.)
           align-items:center keeps the digits vertically centred, which is what
           line-height: var(--lcd-entry-h) did before; #entry-text's auto margin
           still right-aligns a number that fits and collapses to zero once it
           overflows. */
        display: flex;
        align-items: center;
        overflow: hidden;
        /* No native text selection in either display window. Over the entry
           line a drag is a PAN; when the pan ran out of travel (or the finger
           outran it) the same gesture fell through to selection, which drew
           blue rectangles over an LCD that has no use for them - and copying
           from here is an explicit action now (the left rail, long-press, or
           Ctrl-C). The caret stays exactly where it was: suppressing selection
           must never move it, so the guard is 'no selection', not 'select all'. */
        user-select: none;
        -webkit-user-select: none;
    }
    /* ...but a press-and-hold inside the number is PASTE (see attachEntryPan),
       and a control that visibly darkens must darken under the finger at the
       moment it fires, not on release. */
    #entry-view.paste-armed { background-color: rgba(43, 43, 43, 0.16); }

    /* The entry line's half of the copy rail (see .copy-rail): a button in the
       same column as the stack level labels, holding the whole height of the
       entry box. It reads 'e:' and wears the label look (same 12px bold, same
       left alignment, same dimming as .stack-pos) because that is what it is -
       the entry line's row label - with copy as its unlabeled extra duty, one
       gesture in both halves of the column. The stack rows' text starts at
       8px window inset + 12px rail padding; matching that exactly (same two
       numbers here, and justify-content:flex-start instead of centring) puts
       'e:' on the same x as 'X:', 'Y:', 'Z:', '0:'. */
    #entry-copy {
        /* A flex item of .input-line first, and its own left-aligned box second. */
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        height: var(--lcd-entry-h, 62px);
        /* Only the vertical padding is overridden - horizontal padding lives in
           .copy-rail and overriding it here would break column alignment with
           the stack labels. */
        padding-top: 0;
        padding-bottom: 0;
        border: none;
        border-radius: 5px;
        font-family: inherit;
        font-size: 12px;   /* = .stack-pos: it is a label, not part of the number */
        line-height: 1;
        color: var(--display-text);
        opacity: 0.6;
    }

    /* Horizontal window onto the entry number. A flex row whose single item has
       margin-left:auto: while the number fits, the auto margin eats the slack
       and it sits flush right like a calculator always has; once the number is
       wider than the window, auto margins collapse to zero, the text starts at
       the left edge and overflows RIGHT - which, unlike right-aligned overflow,
       is reachable by scrollLeft. JS owns scrolling (overflow stays hidden:
       touch-action:none on the screen already killed native panning) so the
       cursor can be kept in view; a pointer drag pans the window directly. */
    .entry-view {
        /* ABSOLUTE - and it has to stay that way for a non-obvious reason:
           .calculator is width:auto (fit-content, clamped 320-450px), so any
           in-flow box here lets its content's max-content size widen the whole
           panel - a long number physically grew the LCD. An out-of-flow window
           contributes nothing to intrinsic width, which is what kept the panel
           a fixed size for its whole life. min-width:0 does NOT fix that (it
           permits shrinking; it does not stop the max-content contribution),
           and neither does overflow:hidden (that zeroes only the MIN-content
           contribution). Reproduced: flex item = 369px -> 410px on overflow.

           What it must NOT be is inset:0 - absolute offsets resolve against
           .input-line's PADDING box, so 'left:0' covered the rail column and a
           long number painted straight through the 'e:' label (the button's
           faint translucent box floated on top; that was the smear). The fix is
           this left offset: out of flow for width purposes, but starting where
           the rail ends - 8px window inset + one rail column, the same numbers
           .input-line's padding-left and #entry-copy's min-width use, so the
           two cannot drift. Measured identical to the flex-item version at
           every scroll offset; the pan/tap target is unchanged for every pixel
           that ever held a digit. */
        position: absolute;
        top: 0;
        bottom: 0;
        left: calc(8px + var(--copy-rail-w, 48px));
        right: 0;
        display: flex;
        align-items: center;
        overflow: hidden;
        white-space: nowrap;
    }
    #entry-text {
        margin-left: auto;
        flex: none;             /* never squish - overflowing is the point */
    }

    /* '…' chips: shown over an edge only while text continues that way, so a
       number that merely fills the window stays clean. Opaque background sits
       on top of the digits it replaces. */
    .ovf {
        position: absolute;
        top: 0;
        bottom: 0;
        display: none;
        align-items: center;
        padding: 0 2px;
        background-color: var(--screen-bg);
        color: var(--display-text);
        pointer-events: none;
    }
    .ovf.on { display: inline-flex; }
    /* The chips are absolute in .input-line's padding box, so the LEFT chip
       must start where the number window starts - past the 8px inset AND the
       rail column - or it would blank a strip of the 'e:' label whenever the
       number scrolls. (Right edge needs no such offset: the view ends there.) */
    .ovf-left  { left: calc(8px + var(--copy-rail-w, 48px)); }
    .ovf-right { right: 0; }

    /* --- Menu mode: LCD takeover ------------------------------------------
       The menu is a modal surface that replaces the stack + entry line inside
       the SAME green window (the hardware metaphor: it is all one LCD). It is
       plain HTML/CSS boxed inside .screen-container - standard list rows and
       paragraphs, only styled to the panel's palette. While html.menu-open:
       the calculator surfaces hide, the menu fills exactly their combined
       height (stack window + 5px gap + entry line), and native vertical pan
       replaces pinch (touch-action:none on the screen would otherwise eat
       the scroll - the ancestor value wins, so it is relaxed here). */
    html.menu-open .stack-display,
    html.menu-open .input-line { display: none; }
    html.menu-open .screen-container { touch-action: pan-y; }

    .menu-display {
        display: none;
        /* EXACTLY the area the stack + entry line occupy. openMenu()/showWelcome()
           measure that area before hiding it and hand it in as --menu-h; this
           calc() is only the never-measured fallback (it approximates borders
           and margins - which is exactly why the reconstruction was the bug:
           every CSS tweak silently changed how much the LCD grew when the
           menu opened).
           Two subtractions, because the area being replaced is made of two
           boxes: the stack window's 18px annunciator strip (which lives inside
           --stack-h but is not part of the menu), and the 5px margin-bottom gap
           that separates it from the entry line. The old version added that gap
           instead of subtracting it - a 10px error, doubled to 22px short on a
           phone, where --lcd-entry-h is overridden to 48px and the same wrong
           sign lands against a smaller number. That margin is space between the
           two rows being replaced, not part of either one.
           Still 1px under what measureLcdArea() stores (offsetHeight counts the
           stack window's 1px border-bottom), which is the point: this fallback
           approximates from constants and errs a hair small rather than
           assuming borders it cannot see. */
        height: var(--menu-h,
                    calc(var(--stack-h, calc(var(--lcd-lines, 5) * var(--lcd-row-h, 33px)))
                         + var(--lcd-entry-h, 62px)
                         - var(--ann-h, 16px) - 5px));
        overflow-y: auto;
        scrollbar-width: none;
        color: var(--display-text);
        font-size: 17px;                 /* menu copy is dense; fixed size */
        /* Sizing quarantine. The framed desktop layout sizes .calculator to
           fit-content (width:auto, max-width 450px), and a block's contribution
           to that is its MAX-CONTENT width - for this element, the longest
           paragraph as ONE unwrapped line (the preference hints are 300+ chars).
           Opening a menu therefore used to widen the whole calculator to the
           450px cap. width:0 removes the contribution from intrinsic sizing
           entirely; min-width:100% restores the used width to fill the screen.
           (Percentages resolve against the parent's definite width, so nothing
           is circular - this is the standard scroll-container quarantine.)
           overflow-wrap keeps long tokens like 'Scientific/Engineering' inside
           the column instead of earning themselves a horizontal scrollbar. */
        width: 0;
        min-width: 100%;
        overflow-wrap: break-word;
    }
    .menu-display::-webkit-scrollbar { display: none; }
    html.menu-open .menu-display { display: block; }

    .menu-title {
        font-weight: bold;
        font-size: 14px;
        opacity: 0.6;
        margin: 2px 0 6px 2px;
    }
    .menu-item {
        display: flex;
        gap: 10px;
        padding: 8px 6px;
        border-radius: 4px;
        cursor: pointer;
    }
    .menu-item .menu-num { opacity: 0.6; min-width: 12px; }   /* label only */
    .menu-val { margin-left: auto; opacity: 0.75; font-weight: normal; }
    /* Numeric editor: the value IS the screen - big, with a static caret.
       (No cursor movement by design: <=3-digit integers appended at the end,
       BS/C handle mistakes.) */
    .menu-edit-val {
        font-size: 30px; font-weight: bold; text-align: right;
        padding: 2px 6px 0 2px; min-height: 34px;
    }
    .menu-caret { font-weight: normal; opacity: 0.85; margin-left: 1px; }
    .menu-toggle-val {
        font-size: 26px; font-weight: bold; text-align: center;
        padding: 6px 2px; cursor: pointer;
    }
    /* Armed destructive confirm: red, unmistakable - the one place the LCD
       is allowed to shout. */
    .menu-toggle-val.armed { color: #b3402e; }
    .menu-hint { font-size: 12px; opacity: 0.75; margin: 8px 2px 0 2px; line-height: 1.35; }
    /* Unsaved-change line on a choice screen: shown only while the choice on
       screen differs from the stored one, and above the value so the shortest
       LCD cannot clip it. Bold and full-strength because unlike a hint this is
       not explanation, it is a debt - something still has to be committed. */
    .menu-keys { margin: 0 0 4px 2px; opacity: 1; font-weight: bold; }
    .menu-item.sel { background-color: rgba(214, 140, 69, 0.35); font-weight: bold; }
    .menu-page p { margin: 0 0 10px 2px; line-height: 1.35; }
    /* Chapter headings inside Help/About. They were just bold until the guide
       grew real multi-section chapters, at which point bold-on-bold stopped
       reading as a heading - so: bigger, and underlined with a hairline that
       only spans the words themselves (an inline background paints behind the
       text, never past its last glyph). */
    .menu-page .menu-h {
        font-weight: bold;
        font-size: 1.08em;
        margin-top: 16px;
        padding-bottom: 2px;
        border-bottom: 1px solid rgba(43, 43, 43, 0.22);
    }
    /* The welcome page is a title card, not a chaptered page: its single
       heading wants presence rather than a section rule, and the underline
       above reads as an unfinished sentence when there is nothing under it.
       Bounded so it still fits the shortest LCD panel. */
    .menu-page.welcome-page .menu-h {
        font-size: 1.25em;
        line-height: 1.25;
        margin: 4px 0 12px 2px;
        padding-bottom: 0;
        border-bottom: none;
    }
    /* Inline tappable word inside menu/welcome copy (the Welcome page's link
       into Help). Styled as a link, not a button: it sits inside a sentence,
       and this calculator has no other hyperlinks so there is nothing else for
       it to be confused with. Underlined rather than coloured - the LCD palette
       is one dark ink on green glass, and the mode lamps already own colour. */
    .menu-link {
        text-decoration: underline;
        font-weight: bold;
        cursor: pointer;
    }
    /* External links from a doc page ([text](https://…)). Same underline-and-
       bold language as .menu-link - the LCD palette is one ink on green glass,
       and the mode lamps already own colour - plus the browser's default link
       blue suppressed so an href cannot be the one bright thing on screen. */
    .menu-page a {
        color: inherit;
        text-decoration: underline;
        font-weight: bold;
        cursor: pointer;
        overflow-wrap: anywhere;
    }
    /* Tappable back header on pages - the touch route out that does not
       require finding the softkey strip mid-scroll. */
    .menu-back {
        display: inline-block;
        padding: 4px 10px;
        margin: 0 0 6px 2px;
        border-radius: 4px;
        background-color: rgba(0, 0, 0, 0.12);
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }

    /* Inert keypad while the menu owns the screen: every key that has no menu
       meaning dims and stops receiving taps - the same 'present, legible,
       dead' language as empty registers. The five softkeys (top row) and
       ENTER stay live (.soft-live); labels/handlers are swapped in JS and
       restored by updateButtonStates() on exit. */
    html.menu-open .keypad button { opacity: 0.35; pointer-events: none; }
    html.menu-open .keypad button.soft-live { opacity: 1; pointer-events: auto; }

    /* Keypad */
    .keypad {
        /* The app owns its gestures: no browser pinch-zoom or double-tap zoom
           anywhere on the keypad. */
        touch-action: none;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(9, auto);
        gap: 6px;
        flex-grow: 1;
        overflow: hidden;
    }

    /* The two key groups are layout-invisible by default: their buttons are laid
       out as direct items of the single .keypad grid above, so the portrait /
       desktop layout is byte-for-byte what it always was. Only html.wide (set by
       JS when the viewport is much wider than it is tall) gives them boxes, and
       then .keypad itself becomes the invisible one - see the split rules. */
    .keys {
        display: contents;
    }

    button {
        border: none;
        /* --btn-pad is the resting key height driver; fitKeys() only ever shrinks
           it, and only when the fixed layout genuinely does not fit. */
        padding: var(--btn-pad, 14px) 0;
        font-size: 16px;
        /* (An older note here defended a content-driven line box for the 26px
           operator glyphs. Keypad keys no longer work that way - see the
           .keypad button lock below: an explicit height, a fixed 1em line box,
           and flex centring replaced 'whatever the glyph's font metrics say'.) */
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        /* Was 'transition: all 0.1s' - but 'all' includes HEIGHT, so any
           content-driven height change (a relabelled key growing a row) got a
           visible 100ms slide, and even fitKeys()'s legitimate flattening on
           resize animated the whole keypad. The only properties that ever
           legitimately animate are the tint of a press and the scale; name
           them, so height can never ride along again. */
        transition: background-color 0.1s, transform 0.1s;
        user-select: none;
    }

    button:active {
        transform: scale(0.95);
    }
    /* Touch press state driven by JS: the keypad's touchstart preventDefault
       (see the haptics block) retires :active AND native click synthesis for
       touches, so the press handler adds this class instead. Same transform
       as button:active - a touched key looks exactly like a clicked one, and
       sliding off lifts it by coordinate, not by luck of capture. */
    .keypad button.pressed {
        transform: scale(0.95);
    }

    /* Key heights are LOCKED to a formula, never handed to the label.
       Left to itself a key's height is padding + the text's natural line box,
       and that box depends on the font METRICS of whatever glyph the label
       happens to use: 'log_y(x)' carries a real <sub> that drops below the
       baseline, and superscript faces (eˣ, ˣ√y, x²) fall back to a different
       font whose ascent is taller. Fn/Inv repaint labels in place, so the row
       they land on grew or shrank by ~2-5px per toggle - and because grid rows
       stretch every key in them to the tallest, one odd label moved the whole
       row. A calculator's keys are furniture; touching a modifier may change
       what a key SAYS, never how big it is.
       The lock: line-height:1 pins the line box to exactly 1em of type - an
       inline box's height comes from line-height, NOT from glyph metrics, so
       no label can stretch it. Height = padding + 1em stays responsive (the
       em follows font-size; fitKeys() still flattens --btn-pad), and the grid
       keeps equalising each row because there is deliberately NO explicit
       height here - auto height + default align-items:stretch lets a shorter
       key (Deg/Rad's 12px) fill to its row rather than shrink it.
       display:flex + centring replaces what natural line-height used to do
       visually: glyphs taller than their line box (the 26px ÷×−+ faces)
       overflow symmetrically instead of hanging off the baseline, and keys
       stretched by 1fr rows (wide layout) keep their glyph in the middle.
       Nothing clips - buttons carry no overflow rule. Scoped to .keypad: the
       install-chip buttons live outside it and keep their content-sized shape. */
    .keypad button {
        line-height: 1;
        white-space: nowrap;   /* the other half of the lock: a label WIDER
                                  than the key must overflow sideways, not
                                  wrap and double the key's height - every
                                  real face is one short line, so this costs
                                  nothing today and keeps 'height never
                                  follows content' true unconditionally */
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /* The one label with markup - log_y(x) on the pow key's Fn face. A real
       <sub> shifts its inline box below the baseline, and a shifted box DOES
       grow the line box even at line-height:1 (the strut is not the only
       contributor). Neutralise it: zero-height inline box (line-height:0)
       contributes nothing to layout, and relative positioning moves PAINT
       only - the subscript still reads as a subscript, but it can never
       participate in row sizing again. */
    .keypad button sub {
        font-size: 0.72em;
        line-height: 0;
        vertical-align: baseline;
        position: relative;
        bottom: -0.35em;
    }

    /* Button Styles */
    .btn-num { background-color: var(--btn-dark); color: white; position: relative; }

    /* STO/RCL arming. While a register pick is armed, every digit key grows a
       corner tag naming what digits mean right now - modal state you cannot
       see is modal state that looks like a dead key. The tag COLOUR carries
       occupancy: orange = the register holds a value, dim grey = empty (JS
       mirrors registers[] onto the buttons as .reg-filled). That colour map is
       what lets every invalid pick be a silent no-op instead of a dialog: you
       can see why nothing happened. No alert() belongs in this flow - it is a
       calculator, and calculators do not interrupt you with windows.
       Targets [data-reg] rather than .btn-num so π, e and '.' stay untagged;
       html.sto-armed / rcl-armed / clr-armed are toggled on <html>.
       The corner is dead space on these keys: labels are centred. */
    html.sto-armed .btn-num[data-reg]::before,
    html.rcl-armed .btn-num[data-reg]::before,
    html.clr-armed .btn-num[data-reg]::before {
        content: 'Sto';
        position: absolute;
        top: 2px;
        left: 4px;
        font-size: 13px;
        line-height: 1;
        color: rgba(255,255,255,0.35);      /* empty register */
    }
    html.rcl-armed .btn-num[data-reg]::before { content: 'Rcl'; }
    html.clr-armed  .btn-num[data-reg]::before { content: 'Clr'; }
    html.sto-armed .btn-num[data-reg].reg-filled::before,
    html.rcl-armed .btn-num[data-reg].reg-filled::before,
    html.clr-armed  .btn-num[data-reg].reg-filled::before {
        color: var(--btn-orange);           /* holds a value */
    }

    /* Clear lives only in the store flow. While STO is armed the '.' key grows
       a 'Clear' tag; pressing it enters clear mode, where the word lights up
       on the key, digits clear single registers (their tags visibly dim - that
       IS the proof), and ⌫ grows a 'Clear All' tag. Wiping everything takes
       two deliberate presses ('.' then ⌫) and never a popup. */
    html.sto-armed #key-dot::before {
        content: 'Clear';
        position: absolute;
        top: 2px;
        left: 4px;
        font-size: 13px;
        line-height: 1;
        color: rgba(255,255,255,0.35);
    }
    html.clr-armed #key-dot {
        box-shadow: inset 0 0 12px var(--btn-orange);
    }
    html.clr-armed #key-dot::before {
        content: 'Clear';
        position: absolute;
        top: 2px;
        left: 4px;
        font-size: 13px;
        line-height: 1;
        color: var(--btn-orange);
        font-weight: bold;
    }
    /* ⌫ must be positioned for its corner tag to land on it: unlike .btn-num
       (which carries position:relative for the digit tags), this is a
       .btn-func, and an absolutely-positioned ::before with no positioned
       ancestor resolves against the VIEWPORT - the tag was being painted at
       the page's top-left corner, behind the calculator panel. It only
       appeared while held because button:active's transform(scale) turns the
       key into its own containing block for abspos descendants; releasing it
       let the tag drift away again. */
    #key-bs { position: relative; }
    html.clr-armed #key-bs::before {
        content: 'Clear All';
        position: absolute;
        top: 2px;
        left: 4px;
        font-size: 12px;
        line-height: 1;
        color: var(--btn-orange);
    }

    /* The armed key itself glows, so the eye can find its way back to it. */
    html.sto-armed [data-func="sto"],
    html.rcl-armed [data-func="sto"] {
        box-shadow: inset 0 0 12px var(--btn-orange);
    }
    /* Fn/Inv lock state: a corner LED, not a glow. The first attempt borrowed
       the STO/RCL orange inset glow; on screen it washed out against the Inv
       key's red fill and barely read over Fn's purple. The hardware metaphor
       wins instead: theoretical key caps carry indicator lamps, so a locked
       modifier lights a small green LED - the palette's one mode-ON green,
       --led-green, shared with the Deg lamp - through a lens in the key's
       upper-left corner. Green stays legible on both fills; the radial
       gradient (highlight -> body -> dark rim) alone carries the lens read.
       A bloom box-shadow was tried and dropped: everything else in the UI is
       flat, and the glow looked like a light leak rather than a lamp - at
       6px the dome shape does the work without it. Drawn with ::after: the
       digit keys' Sto/Rcl/Clr corner tags occupy ::before, so a second
       indicator system here keeps its own slot even if those caps ever grow
       tags of their own. */
    .btn-fn, .btn-inv { position: relative; }
    .btn-fn.mod-armed::after,
    .btn-inv.mod-armed::after {
        content: '';
        position: absolute;
        top: 7px;
        left: 7px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 32%,
                    #b9e4b9 0%, var(--led-green) 55%, #2e7d32 100%);
    }
    .btn-op { background-color: var(--btn-orange); color: black; font-size: 26px;}
    .btn-func { background-color: var(--btn-light); color: white;}
    .btn-fn { background-color: #6b4c9a; color: white;}
    .btn-inv { background-color: #d65a45; color: white;}
    .btn-fn-a { background-color: #6b4c9a; color: white;}
    .btn-inv-a {
        box-shadow: 0 0 0px #d65a45, inset 0 0 15px #d65a45;
        border-color: #d65a45;
    }
    .btn-deg-rad {
        background-color: var(--btn-light);
        color: white;
        /* 12px instead of 11: this is a mode indicator that must be readable at a
           glance, and its new row-9 cell has the room for it. */
        font-size: 12px;
        border: 2px solid transparent;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;   /* centred in its cell, from copy 2 */
    }

    /* Mode text spans */
    .mode-text {
        padding: 0 4px;
        border-radius: 3px;
        transition: all 0.2s ease;
    }

    /* When in Degree mode - highlight "Deg" with reverse video */
    .btn-deg-rad.deg-active .mode-text.deg {
        background-color: var(--led-green); /* the shared mode-ON green */
        color: white;              /* White text */
        font-weight: bold;
    }

    .btn-deg-rad.deg-active .mode-text.rad {
        opacity: 0.6;              /* Dim the inactive option */
    }

    /* When in Radian mode - highlight "Rad" with reverse video */
    .btn-deg-rad.rad-active .mode-text.rad {
        background-color: #2196f3; /* Blue background */
        color: white;              /* White text */
        font-weight: bold;
    }

    .btn-deg-rad.rad-active .mode-text.deg {
        opacity: 0.6;              /* Dim the inactive option */
    }



    .btn-enter { 
        background-color: var(--btn-orange); 
        color: black; 
/*        grid-column: 4 / span 2; */
	grid-column: span 2;
        grid-row: span 1;
        font-size: 16px;
    }
    /* Full-screen toggle + small non-blocking notice */
    .btn-fs { background-color: #2f6f5e; color: white; }
    .btn-fs[aria-pressed="true"] { box-shadow: inset 0 0 15px #7fd8c0; }

    /* Installed app mode: full screen is already the browser's own job, so the
       toggle has nothing to offer - hide it. visibility (not display) keeps the
       keypad cell occupied so ENTER and the column grid do not shift. */
    html.app-mode .btn-fs { visibility: hidden; pointer-events: none; }

    #toast {
        position: fixed;
        left: 50%;
        /* Keep notices clear of the gesture bar / curved corners too. */
        bottom: calc(24px + env(safe-area-inset-bottom, 0px) + env(safe-area-max-inset-bottom, 0px));
        transform: translateX(-50%);
        max-width: 90%;
        background-color: rgba(50,50,50,0.95);
        color: #fff;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        text-align: center;
        opacity: 0;
        transition: opacity 0.25s;
        pointer-events: none;
        z-index: 50;
    }
    #toast.show { opacity: 1; }

    /* Install chip: only shown when the browser says the app is installable and
       it is not already running installed. Sits under the (pointer-events:none)
       toast layer, inside the top safe area so it never hides behind a cutout. */
    #installChip {
        position: fixed;
        left: 50%;
        top: calc(8px + env(safe-area-inset-top, 0px));
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 8px;
        background-color: #2f6f5e;
        color: #fff;
        padding: 8px 10px 8px 14px;
        border-radius: 999px;
        font-size: 14px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.45);
        z-index: 60;
    }
    html.can-install #installChip { display: inline-flex; }
    #installChip button {
        padding: 6px 12px;
        font-size: 14px;
        border-radius: 999px;
    }
    #installChip .install-yes { background-color: #d68c45; color: #1a1a1a; }
    #installChip .install-no { background-color: transparent; color: #cfcfcf; padding: 6px 8px; }

    .btn-spacer {
        background-color: transparent;
        border: none;
        color: transparent;
        cursor: default;
        pointer-events: none; /* Prevents click events from being registered */
        user-select: none;
        padding: 0;
        margin: 0;
    }

    .btn-half {
        padding: 10px 0;
        font-size: 14px;
    }

    /* Mobile - Full Height with Safe Areas
       Two gates, one query: narrow (portrait phones) OR short (a phone turned
       sideways, a small window). The height figure must stay in step with
       PHONEISH_H in fitToViewport(), which makes the same call from JS against
       the real viewport before handing it to html.wide. */
    @media (max-width: 450px), (max-height: 620px) {
        /* Edge insets, all measured - never guessed:
           --safe-top / --safe-bottom / --safe-left / --safe-right are the larger of
             (a) what the browser reports through env(safe-area-inset-*) / 
                 env(safe-area-max-inset-*), and
             (b) the biggest inset this device/orientation has ever reported to us
                 (--bottom-floor / --side-floor, written by JS; --top-floor is
                  recorded but intentionally not applied at the top in app mode).
           On a Pixel 9 in fullscreen, (a) is what Chrome itself reports once
           viewport-fit=cover lets it draw under the camera cutout and the curved
           corners, so the keypad can never be pushed into them. (b) covers engines
           that report an inset and then drop it back to 0 while still drawing
           underneath (see Chromium's display_cutout / edge-to-edge docs). */
        /* Windowed mode: the browser keeps its own bars outside our viewport, so
           only what it reports matters (usually all zeros on Android). */
        :root {
            --safe-top:    env(safe-area-inset-top, 0px);
            --safe-bottom: max(env(safe-area-inset-bottom, 0px),
                               env(safe-area-max-inset-bottom, 0px));
            --safe-left:   max(env(safe-area-inset-left, 0px),
                               env(safe-area-max-inset-left, 0px));
            --safe-right:  max(env(safe-area-inset-right, 0px),
                               env(safe-area-max-inset-right, 0px));
        }

        /* Full screen / installed app: we may now be drawn under the cutout and
           the curved corners, so add the largest inset this orientation has ever
           reported (--*-floor, written by JS). Scoping it to .immersive matters:
           otherwise a value learned in full screen would keep padding the page
           after exiting, where nothing overlaps. */
        html.immersive {
            /* TOP: no guard by default. Measured on a Pixel 9 in app mode: the
               viewport already starts *below* the status bar (Chrome paints that
               band itself with our theme-color), yet env(safe-area-inset-top) /
               the cutout inset is still reported non-zero - padding for it would
               just double-count an area we are never drawn under, which showed up
               as a blank strip above the display. The bottom and side insets *are*
               honoured below, because there the page really is drawn underneath.
               If some device ever does draw our content under its status bar /
               cutout, set --min-top-guard to the needed height (long-press the
               display: the readout shows what is reported). */
            --min-top-guard: 0px;
            --safe-top:    var(--min-top-guard);
            --safe-bottom: max(env(safe-area-inset-bottom, 0px),
                               env(safe-area-max-inset-bottom, 0px),
                               var(--bottom-floor, 0px));
            --safe-left:   max(env(safe-area-inset-left, 0px),
                               env(safe-area-max-inset-left, 0px),
                               var(--side-floor, 0px));
            --safe-right:  max(env(safe-area-inset-right, 0px),
                               env(safe-area-max-inset-right, 0px),
                               var(--side-floor, 0px));
        }

        /* Fullscreen API active (the web view's Full button) - a DIFFERENT
           situation from installed standalone: here Chrome really does extend the
           viewport under the status bar and the camera cutout, because our
           viewport-fit=cover maps to Android's SHORT_EDGES cutout mode while
           fullscreen (see Chromium docs/ui/android/display_cutout.md). So:
             TOP    guard ON - take the inset live from env() (Android delivers it
                              once we draw under the cutout) and fall back on the
                              recorded --top-floor, since Chromium zeroes env()
                              briefly when the active frame switches.
             BOTTOM live insets only, no floors: the gesture bar is hidden in this
                              mode, so a bottom inset remembered from windowed /
                              standalone would push the keys too far up (the exact
                              complaint about the old Bars state).
           Installed app mode never matches .api-fs, so it keeps the behaviour
           that works today. */
        html.api-fs {
            --safe-top:    max(env(safe-area-inset-top, 0px), var(--top-floor, 0px),
                               var(--min-top-guard, 0px));
            --safe-bottom: max(env(safe-area-inset-bottom, 0px),
                               env(safe-area-max-inset-bottom, 0px));
            --safe-left:   max(env(safe-area-inset-left, 0px),
                               env(safe-area-max-inset-left, 0px));
            --safe-right:  max(env(safe-area-inset-right, 0px),
                               env(safe-area-max-inset-right, 0px));
        }

        body {
            /* Exact fit and no scrolling at all - full screen is a deliberate
               action now (the Full button / installed-app display mode), so the
               page never needs to be scrollable to reach anything, and nothing
               hangs below the bottom of the screen. */
            min-height: var(--app-height, 100dvh);
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* Only for viewports too short for even the smallest keys (e.g. some
           landscape phones): better scrollable than unreachable. fitKeys() puts
           this class on <html> as a last resort; normal phones never get it. */
        html.needs-scroll body {
            overflow-y: auto;
        }
        html.needs-scroll .calculator {
            height: auto;
            min-height: var(--app-height, 100dvh);
        }

        .calculator {
            /* Full-bleed: the safe-area insets are padding now, not margins. */
            width: 100%;
            max-width: none;
            border-radius: 0;
            box-shadow: none;
            /* Fill exactly the height the browser leaves visible. Padding is inside
               that height (border-box), so the guards below shrink the keys instead
               of pushing content off screen. */
            height: var(--app-height, 100dvh);
            padding: calc(5px + var(--safe-top))
                     calc(4px + var(--safe-right))
                     calc(6px + var(--safe-bottom))
                     calc(4px + var(--safe-left));
            margin: 0;
        }

        .screen-container {
            margin-bottom: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            /* Because the page can no longer scroll, the stack window is what
               gives way on a short viewport (LCD_WINDOW_H down to STACK_MIN_H,
               currently 185px to 40px) so the keys always stay fully visible
               above the bottom safe area. Named as constants rather than
               spelled out here: fitKeys() owns that number. */
            flex: 0 1 auto;
        }

        .stack-display {
            /* Resting height is --stack-h (LCD_WINDOW_H), which pinch zoom does
               NOT touch - a pinch only re-tiles the rows inside it. flex-grow is
               what lets a landscape viewport hand the extra height back as more
               history: JS measures this box and divides its real height by the
               chosen line count, so growing shows whole lines, never a cut one. */
            /* minus 18px: the annunciator strip's share (see .stack-display) */
            height: calc(var(--stack-h, calc(var(--lcd-lines, 5) * var(--lcd-row-h, 33px))) - 18px);
            flex: 1 1 auto;
            min-height: 40px;
            font-size: var(--lcd-font, 22px);
            line-height: var(--lcd-line-h, 26px);   /* roomier leading for the mobile digits */
        }
	.stack-pos {
	    /* Fixed, deliberately: see the base rule. Labels stay legible next to
	       40px digits without competing with them for width. */
	    font-size: 14px;
	}

	.stack-val {
	    font-size: var(--lcd-font, 22px);
	}

        .input-line {
            /* Larger mobile entry line, still capped by the fixed box (see the
               base rule): 48px of height holds ~34px digits, so the entry stops
               scaling before the stack does at the biggest detent. Raise
               --lcd-entry-h if you would rather have bigger entry digits and
               don't mind the LCD panel taking a few more pixels from the keys. */
            font-size: min(calc(var(--lcd-font, 22px) * 1.27),
                           calc((var(--lcd-entry-h, 48px) - 8px) / 1.15));
            /* Constant entry-line box on a phone (desktop keeps 62px): big enough
               for the biggest pinch step's digits, so the LCD panel is exactly
               the same height at every zoom level. */
            --lcd-entry-h: 48px;
        }

        .keypad {
            /* Bottom cut-off is handled by .calculator's padding above, so the
               keypad itself needs no inset of its own. */
            padding-bottom: 0;
        }

        /* ---------------------------------------------------------------
           WIDE / LANDSCAPE: two columns instead of one tall one.
           A phone on its side is ~2.3x wider than it is tall, so nine rows of
           keys only fit by being crushed. Instead the screen splits the way a
           wide hardware calculator is:

             +---------------------+-----------------------+
             |  stack history      |  7   8   9   ÷  <- -> |
             |  input line         |  4   5   6   ×   Inv  |
             +                     +  1   2   3   −   Fn   |
             |                     |  0   .  <    +   ±    |
             +-----+-----+-----+---+ Deg STO    ENTER      |
             | AC  C  Edit Dup Drop|                       |
             | Swap Roll LstX xʸ % |                       |
             | sin cos tan ln  log |                       |
             | sqrt 1/x   pi  e EE |                       |
             +---------------------+-----------------------+

           The display keeps the top of the left column, the four scientific /
           stack rows (old rows 1-4) sit under it, and the number pad (old row 5
           down) takes the whole right column. Nothing scrolls: fitKeys() still
           arbitrates the slack between the history window and the key height.
           --------------------------------------------------------------- */
        html.wide .calculator {
            display: grid;
            /* Two equal halves; minmax(0,..) so a long number in the display can
               never push one half wider than the other. */
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            /* Row 1 = display (takes all the leftover height), row 2 = the four
               function rows at their natural key height. The number pad spans
               both and is stretched instead (see .keys-num). */
            grid-template-rows: minmax(0, 1fr) auto;
            gap: 6px;
        }

        html.wide .screen-container {
            grid-column: 1;
            grid-row: 1;
            margin-bottom: 0;      /* the grid gap does this now */
            /* Its flexible row can be squeezed to very little on a short screen;
               clip instead of letting the history lines paint over the keys. */
            overflow: hidden;
        }

        /* Swap which wrapper is invisible. */
        html.wide .keypad { display: contents; }

        html.wide .keys-fn {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 6px;
            grid-column: 1;
            grid-row: 2;
            align-content: end;    /* keys flush with the bottom of the column */
        }

        /* The <- / -> pair lives in a nested two-up grid (see Row 5). Its own
           markup sets the columns inline; this lets it fill the tall cell too,
           so the pair is as high as the digit keys beside it. */
        html.wide .keys-num > div {
            grid-auto-rows: 1fr;
        }

        html.wide .keys-num {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            /* Five equal rows filling the full height of the right half: the
               digits are the keys you press most, so they get the tall cells.
               Plain 1fr (not minmax(0,1fr)) on purpose - an fr track keeps its
               automatic minimum, i.e. it can never squash a key below its own
               text; if the viewport really is too short, the grid overflows and
               fitKeys() sees that and flattens --btn-pad instead. */
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
            grid-column: 2;
            grid-row: 1 / span 2;
        }
    }
    </style>
</head>
<body>

<div id="toast" role="status" aria-live="polite"></div>

<div id="installChip">
    <span>Install this calculator?</span>
    <button class="install-yes" onclick="installApp()">Install</button>
    <button class="install-no" aria-label="Dismiss" onclick="dismissInstallChip()">&times;</button>
</div>

<div class="calculator">
    <div class="screen-container">
        <!-- Annunciator strip: hardware-style lamps in the top of the LCD.
             ENG is tappable (the quick notation toggle); ERR flashes on any
             refusal. Heights come from --ann-h, subtracted from the stack
             window so the panel never grows - the strip takes its pixels FROM
             the stack rows, exactly like a real display's bezel printing. -->
        <div class="annunciators" aria-hidden="true">
            <span class="lamp" id="ann-deg">DEG</span>
            <span class="lamp" id="ann-rad">RAD</span>
            <span class="lamp" id="ann-sci">SCI</span>
            <span class="lamp tappable" id="ann-eng" onclick="toggleEng()">ENG</span>
            <span class="lamp err" id="ann-err">ERR</span>
            <span class="lamp cpy" id="ann-cpy">CPY</span>
            <span class="lamp full" id="ann-full">FULL</span>
        </div>
        <!-- Stack History -->
        <div id="stack" class="stack-display"></div>
        <!-- Current Input. The outer div is the fixed-height LCD strip it always
             was; inside, #entry-view is a horizontal window (JS scrolls it so
             the cursor is never off-screen, and it can be dragged), #entry-text
             is the whole number, and the two .ovf chips are drawn over an edge
             only when text actually continues that way. -->
        <div id="input-line" class="input-line">
            <!-- Copy rail (see .copy-rail): this box is the entry line's half of
                 the left-hand column, directly under the stack's level labels,
                 and does the same job - copy the FULL stored value. It wears
                 the label 'e:' for the same reason the rows wear X:/Y:/Z:/0: -
                 it IS that row's label; copying in full is its extra, unlabeled
                 duty, identical to tapping a level number in the stack. A
                 button so it is reachable by keyboard and screen reader; its own
                 pointer handler owns its press, so it never enters the pan/tap
                 state machine at all. Press it (or Ctrl-C) to copy; holding does
                 the same thing once, not twice - click is the action. -->
            <button type="button" id="entry-copy" class="copy-rail"
                    aria-label="Copy the whole number in the edit line">e:</button>
            <div id="entry-view" class="entry-view"><span id="entry-text"></span></div>
            <span id="ovf-left" class="ovf ovf-left">&#8230;</span>
            <span id="ovf-right" class="ovf ovf-right">&#8230;</span>
        </div>
        <!-- Menu surface: hidden until menu mode; content rebuilt by JS. -->
        <div id="menu" class="menu-display"></div>
    </div>
    <div class="keypad">
      <!-- Two key groups: the scientific/stack block (rows 1-4) and the number
           pad (rows 5-9). In every layout except the wide one they are
           display:contents, i.e. invisible to layout, so all 45 keys flow into
           the single 5-column grid exactly as they always did. Only the wide
           (landscape) rules give them a box of their own, which is what lets the
           two halves sit side by side without touching this markup. -->
      <div class="keys keys-fn">
        <!-- Row 1: Stack-move family. The five movers sit in display
             order (push up / pull down): dup/over pick items UP onto the stack,
             drop/nip push them DOWN off it. Inv/Fn extend each key: dup<->drop,
             nip/tuck, and n-variants (n pick, n drop) consume their operand from
             the stack first, then act on what remains. -->
        <button class="btn-func" data-func="dup" onclick="handleDup()">dup</button>
        <button class="btn-func" data-func="over" onclick="handleOver()">over</button>
        <button class="btn-func" data-func="swap" onclick="handleSwap()">swap</button>
        <button class="btn-func" data-func="roll" onclick="handleRollDown()">roll&#8595;</button>
        <button class="btn-func" data-func="drop" onclick="handleDrop()">drop</button>
        <!-- Row 2: All Clear, Clear edit window, edit, then xʸ and %. -->
        <button class="btn-func" data-func="ac" onclick="handleAllClear()">AC</button>
        <button class="btn-func" data-func="clear" onclick="handleClear()">C</button>
        <!-- Edit and Lst X share a key: both move something INTO the edit window. -->
        <button class="btn-func" data-func="edit" onclick="handleEdit()">Edit</button>
        <!-- xʸ is power (x to the y); Inv makes it ˣ√y (the x'th root of y),
             Fn makes it log<sub>y</sub>(x) (log of x to the base y). The three faces solve
             the three unknowns of b^e = r; operands are entered in spoken
             order, and Lst X + Swap + the next key in the pow->root->log cycle
             reverses any of them.
             % divides by 100, Inv-% multiplies back by 100, and Fn-% is the HP
             percent-change between two values. -->
        <button class="btn-func" data-func="pow" onclick="handleOp('^')">x&#696;</button>
        <button class="btn-func" data-func="pct" onclick="handlePercent()">%</button>

        <!-- Row 3 -->
        <button class="btn-func" data-func="sin" onclick="calcFunc('sin')">sin</button>
        <button class="btn-func" data-func="cos" onclick="calcFunc('cos')">cos</button>
        <button class="btn-func" data-func="tan" onclick="calcFunc('tan')">tan</button>
        <button class="btn-func" data-func="ln" onclick="calcFunc('ln')">ln</button>
        <button class="btn-func" data-func="log" onclick="calcFunc('log')">log</button>

        <!-- Row 4: roots, constants and the exponent key (EE becomes EE− under Inv) -->
        <button class="btn-func" data-func="sqrt" onclick="calcFunc('sqrt')">√x</button>
        <button class="btn-func" data-func="recip" onclick="calcFunc('inv')">1/x</button>
        <button class="btn-num" onclick="appendNum(piText())">π</button>
        <button class="btn-num" onclick="appendNum(eText())">e</button>
        <button class="btn-num" data-func="EE" onclick="handleExponent(false)">EE</button>

      </div><!-- /.keys-fn -->
      <div class="keys keys-num">
        <!-- Row 5 -->
        <button class="btn-num" data-reg="7" onclick="appendNum('7')">7</button>
        <button class="btn-num" data-reg="8" onclick="appendNum('8')">8</button>
        <button class="btn-num" data-reg="9" onclick="appendNum('9')">9</button>
        <button class="btn-op" onclick="handleOp('/')">÷</button>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
            <button class="btn-func btn-half" onclick="moveCursor(-1)">←</button>
            <button class="btn-func btn-half" onclick="moveCursor(1)">→</button>
        </div>

        <!-- Row 6 -->
        <button class="btn-num" data-reg="4" onclick="appendNum('4')">4</button>
        <button class="btn-num" data-reg="5" onclick="appendNum('5')">5</button>
        <button class="btn-num" data-reg="6" onclick="appendNum('6')">6</button>
        <button class="btn-op" onclick="handleOp('*')">×</button>
	<button class="btn-inv" onclick="toggleInv()">Inv</button>

        <!-- Row 7 -->
        <button class="btn-num" data-reg="1" onclick="appendNum('1')">1</button>
        <button class="btn-num" data-reg="2" onclick="appendNum('2')">2</button>
        <button class="btn-num" data-reg="3" onclick="appendNum('3')">3</button>
        <!-- A real minus sign (U+2212), not the ASCII hyphen: it matches the ÷
             and × keys next to it and sits on the maths axis instead of down at
             the hyphen line. Only the LABEL changes - the handler still receives
             the plain '-' operator it always did. -->
        <button class="btn-op" onclick="handleOp('-')">&#8722;</button>
        <button class="btn-fn" onclick="toggleFn()">Fn</button>

        <!-- Row 8 -->
        <button class="btn-num" data-reg="0" onclick="appendNum('0')">0</button>
        <button class="btn-num" id="key-dot" onclick="appendNum('.')">.</button>
        <button class="btn-func" id="key-bs" onclick="handleBackspace()">⌫</button>
        <button class="btn-op" onclick="handleOp('+')">+</button>
        <button class="btn-func" data-func="neg" onclick="toggleSign()">±</button>

        <!-- Row 9: Deg/Rad moved down here (was row 4) to free the EE key.
             STO sits beside it in the other corner of the keypad - a low-use
             pair of functions (store/recall, RCL on Inv) parked away from the
             keys you hammer. The cell after it stays spare. -->
        <button class="btn-deg-rad" data-func="degRad" onclick="toggleAngleMode()">
            <span class="mode-text deg">Deg</span>/<span class="mode-text rad">Rad</span>
        </button>
        <button class="btn-func" data-func="sto" onclick="handleSto()">STO</button>
        <!-- Spare cell. A full-screen toggle could live here again (machinery is
             intact: toggleFullscreen(), fullscreenchange listeners, html.api-fs
             safe-area rules, .btn-fs styles); swap this spacer for
             <button class="btn-fs" id="fsBtn" aria-pressed="false"
                     onclick="toggleFullscreen()" title="Toggle full screen">Full</button>
             and syncFsButton() picks it up by id. -->
        <button class="btn-spacer"></button>
        <button class="btn-enter" onclick="handleEnter()">ENTER</button>
      </div><!-- /.keys-num -->
    </div>
</div>

<!-- decimal.js: the calculator's math engine (vendored, MIT; see README).
     Plain script tag - no modules, no build step - so file://, offline
     launches and the service-worker shell all keep working. -->

<!-- docs.js: the Help / About / Welcome copy, as plain text in one string.
     A classic script tag, not fetch(), so it also loads when this file is opened
     straight from disk - see the header of that file for why, and tools/ for the
     test that keeps it rendering. Must stay ahead of the app script below, which
     reads RPN_DOCS as it starts up. -->
<script src="docs.js"></script>

<script src="decimal.min.js"></script>
<script>
    // State Management
    let stack = [];
    let currentInput = "";
    let cursorPos = 0;
    let fnMode = false;
    let invMode = false;
    let lastX = null;
    let pendingNegative = false;
    let lastCalc = false;
    let maxSeenHeight = 0;   // tallest visible height ever measured = real full-screen height
    let refWidth = 0;        // width that reference was taken at (orientation guard)
    let chromeHeight = 0;    // browser UI (URL bar/toolbar) currently covering the page
    let lastLayoutKey = '';
    let angleMode = 'deg'; // 'deg' or 'rad'

    // STO/RCL registers. Ten of them, addressed by digit key. They deliberately
    // SURVIVE AC (the HP convention): All Clear wipes the working stack, not the
    // values you filed away on purpose.
    let registers = new Array(10).fill(null);
    // Armed modifier: null | 'sto' | 'rcl'. While set, digit keys select a
    // register instead of typing, and every digit key shows a corner tag.
    let stoMode = null;

    // --- decimal engine ----------------------------------------------------
    // The calculator computes with decimal.js (arbitrary-precision decimal,
    // vendored beside this file) instead of IEEE 754 doubles. What that buys:
    //   * 0.1 + 0.2 is exactly 0.3 - representation error cannot happen
    //   * operations do NOT re-round to display precision, so chains keep
    //     guard digits and (1e12+1)-1e12 no longer vanishes
    //   * no fixed exponent range: exp(1000) computes instead of returning
    //     Infinity, tanh saturates exactly
    // What it does NOT buy: PI is still transcendental, so the Deg-mode
    // quarter-turn snap stays (sin 180 at precision 40 still comes back
    // 1.69e-40 - measured, not assumed), and every domain guard stays,
    // because decimal.js answers out-of-domain questions with a SILENT NaN
    // rather than an error.
    // Precision is a PAIR of user preferences (see the prefs store below), so
    // these are live variables, not constants: applyPrefs() rewrites them and
    // recomputes everything derived - Decimal's precision, PI_D, and the snap
    // threshold. Existing stack values keep whatever digits they were computed
    // with; only NEW operations run at the new precision.
    let WORK_PRECISION = 40;        // internal significant digits
    let DISPLAY_SIGDIGITS = 15;     // the most the LCD ever shows
    // Scientific-notation cutoffs (Preferences -> 'Large/Small -> scientific').
    // Live for the same reason the two above are: applyPrefs() rewrites them.
    let SCI_LARGE_AT = 15;          // plain form may use at most this many integer positions
    let SCI_SMALL_ZEROS = 5;        // leading zeros tolerated after the decimal point
    let EDIT_SCI_ZEROS = 0;         // edit window: placeholder zeros before compacting (0 = off)
    Decimal.set({ precision: WORK_PRECISION });   // ties: half-even (as before)

    // PI to working precision (decimal.js ships no constant; acos(-1) is it).
    // let, not const: recomputed when the internal-digits pref changes.
    let PI_D = new Decimal(-1).acos();
    // e to working precision (exp(1) at the live Decimal precision).
    let E_D = new Decimal(1).exp();

    // The pi / e keys insert these as TEXT so the entry line holds something a
    // user could have typed - but DERIVED from the engine, not hard-coded:
    // exactly WORK_PRECISION significant digits, so what π inserts is always
    // what will actually be stored. (Hard-coded 40-digit strings ignored the
    // internal-digits pref: with it at 18, π still filled the entry line with
    // 40 digits that were supposed to not exist.)
    function piText() { return PI_D.toString(); }
    function eText()  { return E_D.toString(); }

    // Exactly WORK_PRECISION significand digits (no dot) + decimal exponent
    // of |d|:  2.5 -> { m: '2500...0', e: 0 }. Used by the snap rules below.
    function sigChars(d) {
        const parts = d.abs().toExponential(WORK_PRECISION - 1).split('e');
        let m = parts[0].replace('.', '');
        if (m.length < WORK_PRECISION) m += '0'.repeat(WORK_PRECISION - m.length);
        return { m: m.slice(0, WORK_PRECISION), e: parseInt(parts[1], 10) };
    }

    // Cascade-snap for COMPUTED results only (parsed entry never snaps):
    //   * a trailing run of 9s >= SNAP_RUN_MIN carries at the start of the
    //     run: 0.999..9 -> 1, 2.499..9 -> 2.5, 17.999..9 -> 18
    //   * its mirror, a lone junk digit after a full run of zeros, collapses:
    //     sqrt(2)^2 = 2.000..001 -> 2
    // Cancelling round-trips (1/3*3, ln(e^5), x^(1/x)) leave exactly these two
    // digit patterns; a run this long cannot come from typing, and ENTER never
    // snaps, so no entered value can be eaten. The 40-vs-15 guard-digit gap is
    // what makes display rounding carry over the rest on its own - this rule
    // simply removes the residue at the source so (1/3*3)-1 is 0, not 1e-40.
    // REVIEW NOTE: detect the carry by building the rounded value, NOT by
    // comparing significant-digit COUNTS - plain truncation shrinks counts
    // too, and that misread silently degraded precision during design tests.
    let SNAP_RUN_MIN = 20;          // half the working precision (applyPrefs)
    function snapResult(v) {
        if (v.isNaN() || v.isZero() || !v.isFinite()) return v;
        const sc = sigChars(v), m = sc.m, P = WORK_PRECISION;
        let run = 0;                                    // trailing nines
        for (let i = P - 1; i > 0 && m[i] === '9'; i--) run++;
        if (run >= SNAP_RUN_MIN) {
            const k = P - run;                          // digits before the run
            const snapped = new Decimal(m.slice(0, k)).plus(1)
                                   .times(new Decimal('1e' + (sc.e - k + 1)));
            return v.isNegative() ? snapped.neg() : snapped;
        }
        let z = 1;                                      // zeros after digit 1
        while (z < P - 1 && m[z] === '0') z++;
        if (z === P - 1 && m[P - 1] !== '0') {          // d.000..00j -> d
            const snapped = new Decimal(m[0]).times(new Decimal('1e' + sc.e));
            return v.isNegative() ? snapped.neg() : snapped;
        }
        return v;
    }

    // Mantissa + exponent with the zeros the rounding produced trimmed off,
    // i.e. '1.23456789012346e+19' and not '1.2345678901234600000000e+19'.
    // r is already rounded, so toExponential cannot change the value.
    function sciText(r) {
        const i = r.toExponential(Math.max(0, DISPLAY_SIGDIGITS - 1));
        const at = i.indexOf('e');
        let m = i.slice(0, at);
        if (m.indexOf('.') >= 0) m = m.replace(/0+$/, '').replace(/\.$/, '');
        return m + i.slice(at);
    }

    // Fixed (non-exponent) text for a value wantsExponent() called plain.
    // toFixed rather than toString on purpose: Decimal.toString carries its OWN
    // 1e21/1e-7 thresholds, and raising a cutoff above one of those is the user
    // outvoting it - printing must obey our decision in both directions. The
    // place count is exact for every value the plain path can produce (display-
    // rounded mantissa <= 30 digits, exponent within the cutoff bounds), so
    // toFixed cannot round; the trim only removes padding.
    function fixedText(r) {
        const dp = Math.max(0, r.sd() - r.e - 1);
        let s = r.toFixed(dp);
        if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
        return s;
    }

    // WHEN a value is written in exponent form - the single decision both
    // notations share. v is the stored value, r the display-rounded one; r is
    // what gets printed, but v is consulted so nothing is ever shown with
    // invented digits (see the never-lie floor below).
    //
    //   large:  plain form would occupy more integer positions than
    //           SCI_LARGE_AT (default = the old display-width rule), OR rounding
    //           lost real digits into integer places - printing those back as
    //           zeros would present figures that were never in the value.
    //   small:  more leading zeros after the decimal point than
    //           SCI_SMALL_ZEROS (default reproduces decimal.js's old 1e-7
    //           boundary: '0.00001' plain, '1e-6' scientific).
    //
    // Everything else stays plain: 1200, 0.00052, and a rounded fraction like
    // '1.23456789012346' are never exiled to an exponent for having more digits
    // than the display width - digits are information; placeholder zeros are noise.
    function wantsExponent(v, r) {
        if (r.isZero()) return false;
        if (r.e >= 0) {
            if (r.e + 1 > SCI_LARGE_AT) return true;   // magnitude cutoff
            // Never-lie floor: rounding ate real digits and plain form would
            // fill those positions with zeros. True whatever the cutoffs say.
            return !r.eq(v) && r.e + 1 > r.sd();
        }
        return (-r.e - 1) > SCI_SMALL_ZEROS;           // e=-4 -> '0.000d' -> 3 zeros
    }

    // The single display formatter for the STACK lines. The entry line does
    // NOT go through here: recall (Edit / RCL / Lst X) writes a value's full
    // internal digits so an unedited round-trip cannot silently truncate 40
    // guard digits to 15 - see recallToEntry.
    //
    // Notation is applied in two steps, which fixes the old asymmetry where
    // engineering mode only rewrote values Decimal.toString() happened to put
    // in exponent form (a 16-digit integer read plain in ENG but scientific in
    // SCI). Now: (1) wantsExponent() decides the form - same answer for both
    // notations; (2) scientific prints d.ddde±E, engineering rewrites that SAME
    // value's exponent to a multiple of three. ENG therefore stays a pure
