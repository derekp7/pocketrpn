        // firing a call Chrome would silently drop. (userActivation is
        // Chromium-only; where it is absent there is nothing to check, and on
        // engines without vibrate at all we already returned.)
        if (navigator.userActivation && !navigator.userActivation.hasBeenActive) {
            pendingTickMs = ms;
            return;
        }
        navigator.vibrate(ms);
    }
    // Chrome grants the frame 'sticky user activation' only AFTER the first
    // real tap has completed - a vibrate call made inside that very first
    // handler is still pre-activation and gets dropped outright (the classic
    // 'first click never vibrates' report). Handled two ways, belt and
    // guarantee: buzzWarm() asks the gate to open inside the press itself (a
    // 0-duration call - no vibration, but the request may count), and if
    // navigator.userActivation says we are still pre-activation, that press's
    // tick is DEFERRED to its pointerup, when activation has certainly landed.
    // One deferred tick can ever exist - after the first gesture completes,
    // activation sticks and nothing queues again.
    let pendingTickMs = null;
    function buzzWarm() {
        if (navigator.vibrate) navigator.vibrate(0);
    }

    // Touch on the keypad is app-owned, like every other gesture here. The
    // preventDefault below (touchstart, buttons only) retires Chrome's
    // long-press takeover WHOLE: its haptic buzz, the context menu, and the
    // pointercancel that used to eat a held key. Suppressing 'contextmenu'
    // alone was tried first and does NOT work - Chrome fires the long-press
    // haptic at gesture recognition, before any JS sees the menu event, and
    // it cancels the pointer regardless. With the takeover gone, a hold is
    // just a slow key: it registers when released, like a physical one.
    const keypadEl = document.querySelector('.keypad');
    keypadEl.addEventListener('contextmenu', (e) => e.preventDefault());
    keypadEl.addEventListener('touchstart', (e) => {
        if (e.target.closest && e.target.closest('button')) e.preventDefault();
    }, { passive: false });

    // The cost of that preventDefault is real and paid in full here: the
    // browser no longer synthesises click for a touch tap, so press state and
    // activation are driven from pointer events instead - TOUCH POINTERS ONLY;
    // mouse keeps every native behaviour (:active, its own release/click
    // semantics), leaving desktop exactly as it was.
    const keyPresses = new Map();      // pointerId -> { btn, rect }
    const overPress = (p, e) => {
        const r = p.rect;
        return e.clientX >= r.left && e.clientX <= r.right &&
               e.clientY >= r.top  && e.clientY <= r.bottom;
    };
    keypadEl.addEventListener('pointerdown', (e) => {
        // Warm the vibration gate BEFORE any early return: this is a pointer
        // handler (no native click follows for touches), so without it the
        // page's first-ever tap - fresh load, PWA cold start - dies at the
        // mouse/chord guards or at buzz() itself with no activation ever
        // having been granted. Unconditional: prefs.haptics gates real ticks,
        // not this zero-length formality.
        buzzWarm();
        if (e.pointerType === 'mouse') return;
        const btn = e.target.closest ? e.target.closest('button') : null;
        if (!btn) return;
        // A second finger landing on a key that is already down is a chord,
        // not a second tap: the live press owns that key.
        for (const p of keyPresses.values())
            if (p.btn === btn) return;
        keyPresses.set(e.pointerId, { btn, rect: btn.getBoundingClientRect() });
        btn.classList.add('pressed');
        buzz(HAPTIC_TICK_MS);          // the tick fires at the press itself
    });
    // Touch pointers are implicitly captured to their target: pointermove and
    // pointerup report the pressed button wherever the finger actually is.
    // The live position therefore comes from coordinates against the press
    // rect - the same inside/outside rule a native highlight follows, so
    // sliding off visibly lifts the key (silently) and sliding back re-arms it.
    keypadEl.addEventListener('pointermove', (e) => {
        const p = keyPresses.get(e.pointerId);
        if (p) p.btn.classList.toggle('pressed', overPress(p, e));
    });
    window.addEventListener('pointerup', (e) => {
        const p = keyPresses.get(e.pointerId);
        if (!p) return;                // mouse, or a press that started off-keys
        keyPresses.delete(e.pointerId);
        // The first tap's deferred tick: activation has landed with the
        // gesture completing, so this one cannot be dropped. Fires wherever
        // the release lands - the press happened, and it was promised a tick.
        if (pendingTickMs !== null) {
            const ms = pendingTickMs;
            pendingTickMs = null;
            if (navigator.vibrate) navigator.vibrate(ms);
        }
        const inside = overPress(p, e);
        p.btn.classList.remove('pressed');
        // Release inside = the tap. Synthesise the click the prevented
        // touchstart took away: .click() runs the inline handlers exactly as
        // a native one would - attachAutoRepeat's swallow still gets its
        // click, and every key keeps its single activation path.
        if (inside) p.btn.click();
    });
    window.addEventListener('pointercancel', (e) => {
        const p = keyPresses.get(e.pointerId);
        if (!p) return;
        keyPresses.delete(e.pointerId);
        p.btn.classList.remove('pressed');   // abandoned: lift, no click, no buzz
    });

    // Applying preferences. One function does it all so a change from ANY
    // route (menu editor, annunciator tap, startup load) lands completely:
    // engine precision, derived constants, LCD line count, annunciator lamps.
    // Order matters only in that Decimal.set must precede the PI_D recompute.
    function applyPrefs() {
        WORK_PRECISION = Math.max(8, prefs.internalDigits);
        SCI_LARGE_AT = prefs.sciLargeAt;
        SCI_SMALL_ZEROS = prefs.sciSmallZeros;
        EDIT_SCI_ZEROS = prefs.editSciZeros;
        SNAP_RUN_MIN = Math.floor(WORK_PRECISION / 2);
        DISPLAY_SIGDIGITS = Math.min(prefs.displayDigits, WORK_PRECISION);
        Decimal.set({ precision: WORK_PRECISION });
        PI_D = new Decimal(-1).acos();
        E_D = new Decimal(1).exp();
        // Lines pref <-> pinch detent. LCD_STEPS lines are unique and dense
        // (3..6), so the mapping is exact; clampPrefs already bounded it.
        const si = LCD_STEPS.findIndex(s => s.lines === prefs.stackLines);
        if (si >= 0) lcdStep = si;
        applyLcdStep();
        setLcdTone(prefs.lcdBright, prefs.lcdContrast);
        updateAnnunciators();
        // The line-count change reflows everything the viewport arbitration
        // cached; force a full re-measure (same trick pinch uses).
        lastLayoutKey = '';
        fitToViewport();
        updateDisplay();      // re-render stack lines under new digits/notation
    }

    // ------------------------------------------------------------------
    // Annunciator strip: the small-lamp row along the top of the LCD, the
    // way hardware calcs print DEG / ENG in the bezel. One lamp per mode that
    // has no key of its own to light; ERR flashes whenever something refuses
    // (every alert() routes through flashErr, plus the silent underflow
    // returns). The lamps are facts about current state - they stay lit over
    // the menu too, which is exactly what a real annunciator does.
    function updateAnnunciators() {
        const set = (id, on) => {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('on', !!on);
        };
        // Every mode shows BOTH of its states, hardware-style: exactly one
        // lamp of each pair is always lit. A lone ENG lamp left SCI dark was
        // the old bug - 'nothing' should never be a mode's display state.
        set('ann-deg', angleMode === 'deg');
        set('ann-rad', angleMode === 'rad');
        set('ann-eng', prefs.engNotation);
        set('ann-sci', !prefs.engNotation);
    }

    // Tap the ENG lamp to toggle notation - the quick route that keeps the
    // keypad out of it (Fn-EE was rejected: state visible only while holding
    // Fn is invisible state).
    function toggleEng() {
        prefs.engNotation = !prefs.engNotation;
        savePrefs();
        updateAnnunciators();
        updateDisplay();
    }

        let errTimer = null;
    function flashErr() {
        const el = document.getElementById('ann-err');
        if (!el) return;
        el.classList.remove('on');
        void el.offsetWidth;            // restart the blink animation
        el.classList.add('on');
        clearTimeout(errTimer);
        errTimer = setTimeout(() => el.classList.remove('on'), 1400);
    }

    // --- stack copy gestures -------------------------------------------------
    // Tap a stack number -> clipboard gets EXACTLY what is displayed (the row's
    // own text: whatever notation, rounding and ENG form the LCD is showing).
    // Tap the level label at the left -> deep copy: every stored digit in the
    // canonical text recall uses, which can differ from the display (15 shown
    // vs 40 kept). A failed write answers with ERR - a confirmation lamp for a
    // copy that did not happen would be worse than none. Copy is READ-ONLY:
    // unlike every mover and operator it never commits a pending entry, because
    // nothing here consumes stack state.
    const lampTimers = {};
    function flashLamp(ids, ms) {
        // Accepts one id or an array of them: a full copy lights FULL and CPY
        // together, so every lamp goes on first, then every timer is armed.
        const els = (Array.isArray(ids) ? ids : [ids])
            .map(id => document.getElementById(id)).filter(Boolean);
        els.forEach((el) => {
            el.classList.remove('on');
            void el.offsetWidth;        // restart any running blink
            el.classList.add('on');
        });
        els.forEach((el) => {
            clearTimeout(lampTimers[el.id]);
            lampTimers[el.id] = setTimeout(() => el.classList.remove('on'), ms);
        });
    }

    function legacyCopy(text) {
        try {
            const ta = document.createElement('textarea');
            ta.value = text;
            // Park it on-screen but invisible: off-screen coords and
            // display:none both void execCommand('copy') in some engines.
            ta.style.position = 'fixed';
            ta.style.top = '0'; ta.style.left = '-2em'; ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            return ok;
        } catch (e) { return false; }
    }

    // Resolves true/false - callers light the confirmation lamp or ERR off the
    // result. The async clipboard API needs a secure context (the installed PWA
    // is https, fine); the textarea path covers anything else that still lets
    // execCommand run inside this click's user gesture.
    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text).then(() => true,
                                                            () => legacyCopy(text));
        }
        return Promise.resolve(legacyCopy(text));
    }

    // One delegated listener survives updateDisplay's innerHTML re-renders.
    // Anywhere in a row except the level label copies the shown text, so the
    // whole line is the common target; the label alone is the deep copy.
    document.getElementById('stack').addEventListener('click', (e) => {
        const row = e.target.closest('.stack-item');
        if (!row) return;
        const pos = e.target.closest('.stack-pos');
        if (pos) {
            const level = parseInt(pos.dataset.level, 10);
            const v = stack[stack.length - 1 - level];
            if (v === undefined) return;              // stale row mid-render
            copyToClipboard(storedText(v)).then(ok =>
                ok ? flashLamp(['ann-full', 'ann-cpy'], 1200) : flashErr());
            return;
        }
        const val = row.querySelector('.stack-val');
        if (!val) return;
        copyToClipboard(val.textContent).then(ok =>
            ok ? flashLamp('ann-cpy', 1200) : flashErr());
    });
    // Every alert() is an error worth a lamp: wrap once at load so all 20+
    // call sites light ERR without touching them. (The dialog blocks the
    // main thread, so the blink lands when the dialog dismisses - still the
    // right feedback ordering: reason first, trace after.)
    const rawAlert = window.alert ? window.alert.bind(window) : null;
    window.alert = (m) => { flashErr(); if (rawAlert) rawAlert(m); };


    // Natural height of the whole layout minus what is actually on screen.
    // The calculator clips its own overflow, so scrollHeight of the box as sized
    // cannot show the shortfall - measuring it with height:auto can, and it all
    // happens inside one script turn so nothing flashes.
    function layoutDeficit(calc) {
        calc.style.height = 'auto';
        const natural = calc.scrollHeight;
        calc.style.height = '';                        // back to var(--app-height)
        return Math.round(natural - calc.clientHeight);
    }

    function fitKeys() {
        const calc = document.querySelector('.calculator');
        const rootEl = document.documentElement;
        if (!calc) return;
        const rootStyle = rootEl.style;
        rootEl.classList.remove('needs-scroll');   // re-decided from scratch

        // Which layout are we actually in? Ask the computed style instead of
        // trusting the class: the two-column rules need html.wide AND the media
        // query, and .calculator only computes to grid when both hold. That makes
        // this function correct whatever the two decisions do on their own.
        const wide = window.getComputedStyle &&
                     getComputedStyle(calc).display === 'grid';
        // Padding edges a --btn-pad change moves: one column = 9 rows x 2 sides;
        // two columns = the number pad's 5 rows x 2, since the blocks sit side by
        // side and overlap vertically.
        const units = wide ? 10 : 18;
        const basePad = wide ? KEY_BASE_PAD_WIDE : KEY_BASE_PAD;
        // The window gets its fixed resting height, independent of the pinch
        // zoom; the ROW pitch is then derived from what that actually measured.
        rootStyle.setProperty('--stack-h', LCD_WINDOW_H + 'px');
        applyLcdStep();
        rootStyle.setProperty('--btn-pad', basePad + 'px');
        let deficit = layoutDeficit(calc);
        if (deficit <= 0) return;                     // everything already fits

        // 1. shrink the stack history window first (least harmful). It gives way
        //    from the fixed LCD_WINDOW_H down to STACK_MIN_H.
        const stackGive = Math.min(deficit, LCD_WINDOW_H - STACK_MIN_H);
        if (stackGive > 0) {
            rootStyle.setProperty('--stack-h', (LCD_WINDOW_H - stackGive) + 'px');
            // Fewer pixels for the same number of lines: re-tile the rows so a
            // squeezed window still shows whole lines instead of a cut one.
            applyLcdStep();
            deficit = layoutDeficit(calc);
        }
        if (deficit <= 0) return;

        // 2. then flatten the keys, re-measuring after each pass. The first pass
        //    uses the row-count estimate; a couple of confirming passes mean the
        //    two-column layout converges however its slack is distributed (which
        //    column binds, how much the display gave back) without hard-coding
        //    any of that.
        let pad = basePad;
        for (let i = 0; i < 4 && deficit > 1; i++) {
            const room = pad - KEY_MIN_PAD;
            if (room <= 0.05) break;                  // keys already as flat as allowed
            const step = Math.min(room, Math.max(0.25, deficit / units));
            pad = Math.round((pad - step) * 100) / 100;
            rootStyle.setProperty('--btn-pad', pad + 'px');
            deficit = layoutDeficit(calc);
        }

        // 3. still not enough? Then let the page scroll rather than bury the
        //    bottom rows behind the curved corners.
        if (deficit > 1) rootEl.classList.add('needs-scroll');
    }

    // Fit immediately (script is at the end of <body>) and then follow the viewport.
    fitToViewport();

    // resize covers Chrome; visualViewport events cover Firefox/Safari. Both are
    // cheap because fitToViewport() returns early when nothing has changed, so no
    // debouncing is needed and the reflow tracks the toolbar animation itself.
    window.addEventListener('resize', fitToViewport);
    window.addEventListener('orientationchange', fitToViewport);
    if (visualVP) {
        visualVP.addEventListener('resize', fitToViewport);
        visualVP.addEventListener('scroll', fitToViewport);
    }
    // Safety net for engines that fire no event for a collapsing toolbar.
    setInterval(fitToViewport, 500);

    // ------------------------------------------------------------------
    // Pinch-to-zoom on the LCD: changes font size / line count (see LCD_STEPS).
    // The browser's own pinch is disabled via the viewport meta and touch-action,
    // so a two-finger gesture over the display reaches us whole. Spread = more
    // lines (smaller type); pinch in = fewer, larger lines. Snaps to detents.
    function attachLcdPinch() {
        const el = document.querySelector('.screen-container');
        if (!el) return;
        let startDist = 0, startStep = lcdStep, active = false;

        const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX,
                                       t[0].clientY - t[1].clientY);

        el.addEventListener('touchstart', (e) => {
            if (menuOpen) return;   // menu mode: the LCD scrolls, it does not zoom
            if (e.touches.length === 2) {
                active = true;
                startDist = dist(e.touches);
                startStep = lcdStep;
                e.preventDefault();
            }
        }, { passive: false });

        el.addEventListener('touchmove', (e) => {
            if (!active || menuOpen || e.touches.length < 2) return;
            e.preventDefault();
            const ratio = dist(e.touches) / (startDist || 1);
            // Spread fingers = zoom IN = bigger type = LOWER step index, so the
            // accumulated scale is SUBTRACTED. Detents are ~1.18x apart; clamp
            // to the ends of the table.
            let target = Math.round(startStep - Math.log(ratio) / Math.log(1.18));
            target = Math.max(0, Math.min(LCD_STEPS.length - 1, target));
            if (target !== lcdStep) {
                lcdStep = target;
                // Write-through: with 'remember zoom' on, the pinch detent IS
                // the stackLines pref - one stored number, one truth. The
                // editor and the finger always agree.
                if (prefs.rememberZoom) {
                    prefs.stackLines = LCD_STEPS[target].lines;
                    savePrefs();
                }
                // The window height is fixed, so a pinch cannot change it - but
                // the type size does change how tall the entry line wants to be,
                // so re-run the whole arbitration. fitToViewport() short-circuits
                // when its viewport key is unchanged (it is: only the type
                // moved), so drop the cached key first or nothing re-measures.
                lastLayoutKey = '';
                fitToViewport();
                showToast('LCD: ' + lcdActual.lines + ' lines' +
                          (lcdActual.lines === lcdActual.wantLines ? ''
                                                                   : ' (max that fits)'), 1200);
            }
        }, { passive: false });

        const end = () => { active = false; };
        el.addEventListener('touchend', end);
        el.addEventListener('touchcancel', end);
    }
    attachLcdPinch();

    // ------------------------------------------------------------------
    // Full screen: the standard, documented way in.
    //
    // STATUS: dormant by design - no #fsBtn exists in the keypad any more (row 9
    // uses a spacer), so nothing calls this interactively. Kept complete and
    // wired: re-adding the button markup restores the feature exactly, including
    // the html.api-fs safe-area handling for the under-cutout fullscreen case.
    //
    // Scrolling hard enough to make Chrome tuck its toolbar away was never a
    // spec'd behaviour (it is a browser UX heuristic, and it keeps changing).
    // The supported equivalents are:
    //   1. Fullscreen API - documentElement.requestFullscreen({navigationUI:
    //      'hide'}) from a user gesture; exits via Esc / system back.
    //      Not available on iOS (WebKit has no element fullscreen for pages),
    //      so that case is reported instead of silently doing nothing.
    //   2. Manifest display mode - install the page (Add to Home Screen /
    //      Install app) with "display": "standalone" or "fullscreen"; then the
    //      browser chrome is gone from launch, permanently. iOS does this via
    //      apple-mobile-web-app-capable, already set in <head>.
    // Both are detected by (display-mode: ...) media queries / the Fullscreen
    // API state, and both funnel into fitToViewport() so layout follows.
    const fsBtn = document.getElementById('fsBtn');

    function mm(q) { return window.matchMedia ? window.matchMedia(q).matches : false; }

    // True when the browser has already handed us its whole window.
    function isImmersive() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
                  navigator.standalone ||
                  mm('(display-mode: fullscreen)') ||
                  mm('(display-mode: standalone)') ||
                  mm('(display-mode: minimal-ui)'));
    }

    function showToast(msg, ms) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(showToast._h);
        showToast._h = setTimeout(() => t.classList.remove('show'), ms || 4000);
    }

    function syncFsButton() {
        const apiFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
        // Installed app mode: the browser already owns full screen, so the toggle
        // has nothing useful to do -> hidden via html.app-mode (cell kept, so the
        // keypad grid does not shift). In a browser tab it stays as Full / Exit.
        document.documentElement.classList.toggle('app-mode', runningInstalled() && !apiFS);
        // The Fullscreen-API state draws under the cutout (unlike installed
        // standalone) and gets its own safe-area rules via .api-fs.
        document.documentElement.classList.toggle('api-fs', apiFS);
        if (!fsBtn) return;
        fsBtn.setAttribute('aria-pressed', apiFS ? 'true' : 'false');
        fsBtn.textContent = apiFS ? 'Exit' : 'Full';
    }

    // Diagnostics: long-press (or right-click) the *display window* to see what
    // the app detected about safe areas and layout. Gated behind DEBUG because it
    // is a development aid, not a user feature - and, importantly, when off we do
    // NOT attach any pointer/contextmenu handler here at all, so long-press falls
    // through to Android's native text-selection (copying a result) untouched.
    const DEBUG = false;
    const diagTarget = document.querySelector('.screen-container');
    if (DEBUG && diagTarget) {
        const reportMode = () => {
            let mode = 'browser';
            ['fullscreen', 'standalone', 'minimal-ui', 'picture-in-picture']
                .some(v => mm('(display-mode: ' + v + ')') && (mode = v));
            if (navigator.standalone && mode === 'browser') mode = 'standalone(iOS)';
            const apiFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
            showToast('mode: ' + mode + (apiFS ? ' + Fullscreen API' : '') +
                      '\nreported insets T/B/L/R: ' + Math.round(readInset('Top')) + '/' +
                      Math.round(readInset('Bottom')) + '/' + Math.round(readInset('Left')) + '/' +
                      Math.round(readInset('Right')) +
                      '\nguards applied T/B: ' + getComputedStyle(document.querySelector('.calculator')).paddingTop +
                      '/' + getComputedStyle(document.querySelector('.calculator')).paddingBottom +
                      '  app-h: ' + measureVisibleHeight() +
                      // Which layout the aspect-ratio test picked, and why.
                      '\nlayout: ' + (document.documentElement.classList.contains('wide') ? 'two-column' : 'one-column') +
                      '  (' + Math.round(window.innerWidth) + 'x' + Math.round(window.innerHeight) +
                      ', ratio ' + (window.innerHeight ? (window.innerWidth / window.innerHeight).toFixed(2) : '?') + ')', 7000);
        };
        let lpTimer = null;
        diagTarget.addEventListener('pointerdown', () => {
            lpTimer = setTimeout(() => { lpTimer = null; reportMode(); }, 550);
        });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
            diagTarget.addEventListener(ev, () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } }));
        // Only swallow the context menu in debug mode, so a right-click gives the
        // readout; with DEBUG off this line never runs and selection is unaffected.
        diagTarget.addEventListener('contextmenu', (e) => { e.preventDefault(); reportMode(); });
    }

    function toggleFullscreen() {
        const el = document.documentElement;
        const running = document.fullscreenElement || document.webkitFullscreenElement;
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;

        if (running && exit) {
            Promise.resolve(exit.call(document)).catch(e => showToast('Could not exit: ' + e.name));
            return;
        }
        if (!req) {
            // iOS / WebKit: no element fullscreen for documents. Point at the
            // supported route instead of failing quietly (this page already sets
            // apple-mobile-web-app-capable, so Add to Home Screen = real
            // full-screen launch).
            showToast(isImmersive()
                        ? 'Already full screen (installed app).'
                        : 'No full-screen API here - use "Add to Home Screen" to launch it full screen.');
            return;
        }
        if (document.fullscreenEnabled === false) {
            showToast('Full screen is blocked for this page (permissions policy).');
            return;
        }

        // navigationUI:'hide' asks the UA to drop its own bars; engines that do
        // not know the option still accept the plain call.
        const attempt = () => {
            try { return req.call(el, { navigationUI: 'hide' }); }
            catch (e) { return req.call(el); }
        };
        let p;
        try { p = attempt(); } catch (e) { showToast('Full screen failed: ' + e.name); return; }
        if (p && p.catch) p.catch(e => showToast('Full screen failed: ' + e.name +
                                (e.name === 'NotAllowedError' ? ' (needs a direct tap, and permission)' : '')));
    }

    // Keep the button and the layout in step with every way in or out:
    // our own call, Esc, system back/gesture, app install mode changes.
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(t =>
        document.addEventListener(t, () => { syncFsButton(); fitToViewport(); }));
    ['fullscreenerror', 'webkitfullscreenerror'].forEach(t =>
        document.addEventListener(t, e => showToast('Full screen was refused by the browser.')));
    const dmQuery = window.matchMedia ?
        window.matchMedia('(display-mode: fullscreen), (display-mode: standalone), (display-mode: minimal-ui), (display-mode: browser)') : null;
    if (dmQuery) {
        // One query covering every mode, so a single listener catches entering
        // *and* leaving installed-app display modes.
        const onDm = () => { syncFsButton(); fitToViewport(); };
        dmQuery.addEventListener ? dmQuery.addEventListener('change', onDm)
                                 : dmQuery.addListener(onDm);   // older Safari
    }
    syncFsButton();

    // ------------------------------------------------------------------
    // Installation (PWA). Two supported routes, both handled:
    //   * Chrome / Edge / Samsung Internet / Firefox Android: the browser fires
    //     'beforeinstallprompt' once the manifest + service worker check out; we
    //     stash the event and offer our own chip, then call prompt(). (If you
    //     prefer the browser's built-in address-bar button, that still appears on
    //     its own - this chip is additive.)
    //   * iOS / iPadOS Safari: no install event exists. "Share > Add to Home
    //     Screen" works off apple-touch-icon + apple-mobile-web-app-capable; we
    //     detect the browser and show those words instead of a dead button.
    // Already-installed runs (display-mode: standalone/fullscreen or
    // navigator.standalone) never get the chip, and isImmersive() already covers
    // their layout.
    let deferredInstallPrompt = null;
    const installChip = document.getElementById('installChip');

    function runningInstalled() {
        return !!navigator.standalone ||
               mm('(display-mode: standalone)') || mm('(display-mode: fullscreen)') ||
               mm('(display-mode: minimal-ui)');
    }

    function dismissInstallChip() {
        document.documentElement.classList.remove('can-install');
        try { sessionStorage.setItem('rpn-install-dismissed', '1'); } catch (e) {}
    }

    function installApp() {
        if (deferredInstallPrompt) {
            deferredInstallPrompt.prompt();
            deferredInstallPrompt.userChoice.then((choice) => {
                showToast(choice.outcome === 'accepted'
                            ? 'Installing - look for the app icon.'
                            : 'Maybe next time.');
                deferredInstallPrompt = null;
                dismissInstallChip();
            }).catch(() => {});
        } else {
            // iOS / anything without the event: say how, don't fail silently.
            showToast('iOS: tap Share, then "Add to Home Screen".\nAndroid: browser menu > "Install app".');
        }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();                       // we show our own chip
        deferredInstallPrompt = e;
        let dismissed = false;
        try { dismissed = !!sessionStorage.getItem('rpn-install-dismissed'); } catch (err) {}
        if (!dismissed && !runningInstalled()) {
            document.documentElement.classList.add('can-install');
        }
    });

    window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        dismissInstallChip();
        showToast('Installed. Launch it from your home screen / app list.');
    });

    // No event but an installable-looking browser (iOS Safari): keep the chip as
    // a how-to hint, since Add to Home Screen is manual there.
    if (!runningInstalled() && typeof InstallPromptEvent === 'undefined' &&
        /iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.maxTouchPoints > 0) {
        let alreadyDismissed = false;
        try { alreadyDismissed = !!sessionStorage.getItem('rpn-install-dismissed'); } catch (e) {}
        if (!alreadyDismissed) {
            const label = installChip && installChip.querySelector('span');
            if (label) label.textContent = 'Full screen on iOS:';
            document.documentElement.classList.add('can-install');
        }
    }

    // Service worker: enables offline launches once installed. Ignored on http://
    // and file://, so guard rather than throw.
    if ('serviceWorker' in navigator &&
        (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js', { scope: './' })
                .catch(() => { /* offline support absent; app still works */ });
        });
    }

    // Keyboard Support

    // Ctrl/Cmd + C and V on the edit line. They live in their own listener,
    // registered BEFORE the main one, because the main handler claims every
    // letter - 'c' is a shortcut for clear-entry there - and a shortcut that is
    // added as another branch inside it would depend on ordering with that.
    // Here only a chorded Ctrl/Cmd press is even considered, so nothing else can
    // be disturbed. stopPropagation once acted on keeps the main handler from
    // also treating 'c' or 'v' as a key.
    document.addEventListener('keydown', (event) => {
        if (!(event.ctrlKey || event.metaKey) || event.altKey) return;
        const k = event.key.toLowerCase();
        // Ctrl-C with something already selected stays the browser's: on this
        // page that can only be help or menu text, where a real selection is
        // exactly what the user meant. Over the two display windows selection is
        // now suppressed, so there is no competition with our own copy.
        if (k === 'c' && !getSelection().isCollapsed) return;
        if (menuOpen) return;                 // the menu owns its own keys
        if (k === 'c') {
            event.preventDefault(); event.stopPropagation();
            copyEntryValue();
            return;
        }
        if (k === 'v') {
            // Deliberately NO preventDefault here: that cancels the browser's
            // own paste event, which is the one route that carries the clipboard
            // with no permission prompt (reading it ourselves via readText is
            // what makes Chrome pop its 'Paste' confirmation bubble). So the
            // keydown just re-arms the latch; the document 'paste' listener
            // below does the paste. Only if NO paste event follows - a browser
            // that withholds it from a non-editable page - does the delayed
            // fallback read the clipboard ourselves.
            event.stopPropagation();
            entryPasteSeen = false;
            const clipHint = event.clipboardData && event.clipboardData.getData('text');
            if (clipHint) { pasteIntoEntry(clipHint); return; }
            clearTimeout(entryPasteTimer);
            entryPasteTimer = setTimeout(() => {
                // Re-check BEFORE reading: the paste event may have landed in
                // the meantime, and it is the readText() CALL that pops the
                // bubble - pasting nothing is not enough to stand down.
                if (entryPasteSeen) return;
                readClipboardText().then((t) => {
                    // A native 'paste' event may have landed while the read was
                    // in flight. Whoever gets there first wins.
                    if (entryPasteSeen) return;
                    entryPasteSeen = true;
                    pasteIntoEntry(t == null ? '' : t);
                });
            }, 300);
        }
    });

    // Set by the paste listener below when the browser delivered clipboard data
    // itself, so the Ctrl-V fallback above does not paste a second time.
    let entryPasteSeen = false;
    let entryPasteTimer = null;   // pending readText fallback (cleared on repeat keys)
    document.addEventListener('paste', (event) => {
        // A paste event arrived, so this browser does hand Ctrl-V to the page:
        // cancel any pending readText() fallback outright. Leaving it armed
        // would pop Chrome's 'Paste' bubble after a paste that already worked -
        // the latch alone only stopped the second paste, not the prompt.
        clearTimeout(entryPasteTimer);
        entryPasteSeen = true;
        if (menuOpen) return;
        const t = event.clipboardData && event.clipboardData.getData('text');
        if (!t) return;                        // nothing we can read: leave it be
        event.preventDefault();                // and do not let it reach a form field
        pasteIntoEntry(t);
    });

    document.addEventListener('keydown', (event) => {
        const key = event.key;

        // Menu mode owns the keyboard completely - arrows/Enter/Escape route
        // to it, everything else is swallowed so nothing types into the
        // calculator hidden behind the menu.
        if (menuOpen) { menuKeyHandler(event); return; }

        // Armed store/recall swallows the next digit, exactly like a keypad
        // tap: Escape cancels, a digit completes (or no-ops and stays armed),
        // '.' toggles clear mode in the store flow, ⌫ is Clear All while in
        // clear mode - anything else disarms and then does its normal job.
        if (stoMode !== null) {
            if (key === 'Escape') {
                event.preventDefault();
                cancelStoArm();
                return;
            }
            if (/^[0-9]$/.test(key)) {
                event.preventDefault();
                completeStoArm(Number(key));
                return;
            }
            if (key === '.' && stoMode !== 'rcl') {
                event.preventDefault();
                armSto(stoMode === 'sto' ? 'clr' : 'sto');
                return;
            }
            if (key === 'Backspace' && stoMode === 'clr') {
                event.preventDefault();
                clearAllRegisters();
                return;
            }
            cancelStoArm();
        }
        
        // Letters are claimed by the stack shortcuts below - never feed them to
        // the entry buffer (appendNum would otherwise take 'e' for a digit and
        // the old code hijacked 'e' as an exponent marker). 'Enter' is not a
        // letter, but guard anyway so this block can only swallow single chars.
        if (key.length === 1 && /[a-zA-Z]/.test(key)) {
            const lk = key.toLowerCase();
            if (lk === 'd') handleDup();
            else if (lk === 'o') handleOver();
            else if (lk === 'p') handleNPick();
            else if (lk === 'k') handleTuck();       // tacK
            else if (lk === 's') handleSwap();
            else if (lk === 'r') { if (event.shiftKey) handleRollUp(); else handleRollDown(); }
            else if (lk === 'f') { if (event.shiftKey) handleRotUp(); else handleRotDown(); }  // f(lip)
            else if (lk === 'l') handleLastX();
            else if (lk === 'w') handleDepth();
            return;
        }
        if (key !== ' ' && !isNaN(key)) appendNum(key);
        if (key === '.') appendNum('.');

        if (key === 'Enter') {
	    event.preventDefault();
	    handleEnter();
	}
        if (key === '+' || key === '-' || key === '*' || key === '/') handleOp(key);
        // Shift = Inv everywhere on this keyboard, so Shift+^ is now the root
        // (the Inv face); log_y(x) lives on Fn-^ (screen only).
        if (key === '^') { if (event.shiftKey) handleRoot(); else handleOp('^'); }
        if (key === '%') { if (event.shiftKey) handlePercentInv(); else handlePercent(); }
        // x100 / percent-change are reached with the modifiers on screen; the
        // plain keys stay unambiguous (% is always divide-by-100).
        if (key === 'm' || key === 'M') handlePctChange();   // m: percent change
        // Use the button's handler: it honours the cursor position (the old inline
        // slice(0,-1) always deleted the last character and could drive the cursor
        // negative), and it keeps 'e+' / 'e-' atomic.
        if (key === 'Backspace') handleBackspace();
        if (key === 'ArrowLeft') moveCursor(-1);
        if (key === 'ArrowRight') moveCursor(1);
        // Stack moves on non-letter keys (the letter shortcuts live in the
        // single-character block above).
        if (key === 'Delete') { if (event.shiftKey) handleNDrop(); else handleDrop(); }
        if (key === '\\') handleNip();
        // STO/RCL on the bracket keys ([ = store, ] = recall - "put in" /
        // "take out"); digits then pick the register, same as on screen.
        if (key === '[') handleSto();
        if (key === ']') handleRcl();
    });

    // Cursor keys repeat while held. Selected by handler rather than by id or
    // position so relabelling or moving the caps cannot silently unhook repeat
    // while the keys still look like they work.
    document.querySelectorAll('.keypad [onclick^="moveCursor("]').forEach((btn) => {
        const m = /moveCursor\(\s*(-?\d+)\s*\)/.exec(btn.getAttribute('onclick') || '');
        if (!m) return;
        const dir = parseInt(m[1], 10);
        attachAutoRepeat(btn, () => moveCursor(dir));
    });

    // Initialize: prefs first (they gate everything), then the remembered
    // session, THEN the first paint - precision, notation, line count,
    // restored stack all land before the user sees a number. Welcome page
    // takes over the LCD only after that, so dismissing it reveals a fully
    // restored calculator.
    loadPrefs();
    restoreSession();
    applyPrefs();
    updateDegRadBtnState();     // restored angle must beat the markup default
    updateDisplay();
    if (prefs.showWelcome) showWelcome();
    sessionBooting = false;
    // One more fit once the browser has settled. On the FIRST launch of an
    // installed app the viewport is not final while this script runs - the
    // window is still being sized for standalone display - so measurements
    // taken above can come out short, and fitToViewport() caches its layout key
    // and will not redo work it believes it already did. Forcing that single
    // re-fit covers this and any other late viewport change no event reported.
    requestAnimationFrame(() => { lastLayoutKey = ''; fitToViewport(); });
    // Belt for mobile: tab-discards can skip normal hooks; pagehide is the
    // reliable one there, beforeunload the classic desktop one.
    window.addEventListener('pagehide', saveSession);
    window.addEventListener('beforeunload', saveSession);
</script>

</body>
</html>
